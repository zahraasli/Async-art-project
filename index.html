<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>


  <style>

    /* =========================================================
       PAGE RESET
       Removes default browser spacing
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================================
       PAGE BACKGROUND
       Full-screen black background
    ========================================================= */

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      cursor: crosshair;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       MAIN OUTPUT CANVAS
       Footage, webcam and all glitch effects are merged here
    ========================================================= */

    #outputCanvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;
    }


    /* =========================================================
       HIDDEN VIDEO SOURCES
       Videos are processed inside JavaScript
       and are not displayed directly
    ========================================================= */

    #footage,
    #webcam {
      position: fixed;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA + MICROPHONE BUTTON
       Activates webcam and microphone
    ========================================================= */

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 20;

      padding: 10px 16px;

      border: 1px solid rgba(255, 255, 255, 0.85);

      background: rgba(0, 0, 0, 0.55);

      color: white;

      font-size: 11px;

      letter-spacing: 1.4px;

      cursor: pointer;

      backdrop-filter: blur(4px);
    }


    /* =========================================================
       BUTTON HOVER
    ========================================================= */

    #startButton:hover {
      background: white;
      color: black;
    }


    /* =========================================================
       ACTIVE BUTTON
       Makes the control less visually dominant after activation
    ========================================================= */

    #startButton.active {
      opacity: 0.3;
    }

  </style>

</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this URL later with your own footage
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >

    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================================================
       LIVE WEBCAM SOURCE
       Webcam is merged into the footage inside the canvas
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       CAMERA + MICROPHONE CONTROL
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       FINAL VISUAL OUTPUT
  ========================================================== -->

  <canvas id="outputCanvas"></canvas>


  <script>


    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const outputCanvas =
      document.getElementById("outputCanvas");

    const ctx =
      outputCanvas.getContext("2d");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       CURRENT COMPOSITE FRAME
       Stores footage + webcam as one merged image
    ========================================================= */

    const compositeCanvas =
      document.createElement("canvas");

    const compositeCtx =
      compositeCanvas.getContext("2d");


    /* =========================================================
       TEMPORAL MEMORY FRAME
       Stores previous frames for datamosh-style feedback
    ========================================================= */

    const memoryCanvas =
      document.createElement("canvas");

    const memoryCtx =
      memoryCanvas.getContext("2d");


    /* =========================================================
       WEBCAM MOTION DETECTION CANVAS
       Small canvas used to compare webcam frames efficiently
    ========================================================= */

    const motionCanvas =
      document.createElement("canvas");

    const motionCtx =
      motionCanvas.getContext(
        "2d",
        { willReadFrequently: true }
      );


    /* =========================================================
       WEBCAM MOTION DETECTION SIZE
       Smaller resolution makes motion analysis faster
    ========================================================= */

    const MOTION_WIDTH = 64;
    const MOTION_HEIGHT = 48;

    motionCanvas.width =
      MOTION_WIDTH;

    motionCanvas.height =
      MOTION_HEIGHT;


    /* =========================================================
       PREVIOUS WEBCAM FRAME
       Used to calculate movement between frames
    ========================================================= */

    let previousMotionFrame = null;


    /* =========================================================
       WEBCAM STATE
    ========================================================= */

    let webcamActive = false;


    /* =========================================================
       WEBCAM MOTION VALUES
    ========================================================= */

    let webcamMotionAmount = 0;

    let webcamMotionX =
      window.innerWidth / 2;

    let webcamMotionY =
      window.innerHeight / 2;


    /* =========================================================
       MOUSE VALUES
    ========================================================= */

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let lastMouseX =
      mouseX;

    let lastMouseY =
      mouseY;

    let mouseSpeed = 0;

    let mouseMoving = false;

    let mouseTimer = null;


    /* =========================================================
       AUDIO VALUES
    ========================================================= */

    let analyser = null;

    let timeData = null;

    let frequencyData = null;

    let audioLevel = 0;

    let bassLevel = 0;

    let audioPeak = 0;


    /* =========================================================
       FOOTAGE + WEBCAM MIX
       Higher webcam value makes the body more visible
    ========================================================= */

    const WEBCAM_OPACITY = 0.48;


    /* =========================================================
       MOUSE GLITCH AREA
       Keeps mouse interaction in a small local region
    ========================================================= */

    const MOUSE_MIN_RADIUS = 24;

    const MOUSE_MAX_RADIUS = 68;


    /* =========================================================
       WEBCAM MOTION GLITCH AREA
       Movement in camera creates slightly larger distortion
    ========================================================= */

    const MOTION_MIN_RADIUS = 38;

    const MOTION_MAX_RADIUS = 145;


    /* =========================================================
       AUDIO SENSITIVITY
       Higher values make sound produce more glitch
    ========================================================= */

    const AUDIO_SENSITIVITY = 8.5;


    /* =========================================================
       DATAMOSH STRENGTH
       Controls displacement and temporal distortion
    ========================================================= */

    const MOSH_STRENGTH = 1.65;


    /* =========================================================
       TEMPORAL MEMORY
       Higher values make previous frames persist longer
    ========================================================= */

    const MEMORY_AMOUNT = 0.88;


    /* =========================================================
       EXTREME GLITCH COLORS
       Saturated colors used for chromatic corruption
    ========================================================= */

    const glitchColors = [

      "#ff003c",
      "#ff1744",
      "#ff3d00",
      "#ff7a00",

      "#ffe600",
      "#ccff00",

      "#00ff3c",
      "#00ff99",
      "#00fff0",

      "#00a8ff",
      "#003cff",

      "#6900ff",
      "#9d00ff",

      "#ff00e6",
      "#ff0080"

    ];


    /* =========================================================
       RANDOM NUMBER HELPER
    ========================================================= */

    function random(min, max) {

      return (
        min +
        Math.random() *
        (max - min)
      );

    }


    /* =========================================================
       RANDOM INTEGER HELPER
    ========================================================= */

    function randomInt(min, max) {

      return Math.floor(
        random(min, max + 1)
      );

    }


    /* =========================================================
       RANDOM COLOR HELPER
    ========================================================= */

    function randomColor() {

      return glitchColors[
        Math.floor(
          Math.random() *
          glitchColors.length
        )
      ];

    }


    /* =========================================================
       CANVAS RESIZE
       Keeps all visual buffers aligned to the screen
    ========================================================= */

    function resizeCanvas() {

      const width =
        window.innerWidth;

      const height =
        window.innerHeight;


      outputCanvas.width =
        width;

      outputCanvas.height =
        height;


      compositeCanvas.width =
        width;

      compositeCanvas.height =
        height;


      memoryCanvas.width =
        width;

      memoryCanvas.height =
        height;

    }


    resizeCanvas();


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================================
       VIDEO COVER FUNCTION
       Draws video without stretching its aspect ratio
    ========================================================= */

    function drawVideoCover(
      context,
      video,
      width,
      height
    ) {

      if (
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
      ) {

        return;

      }


      const videoRatio =
        video.videoWidth /
        video.videoHeight;


      const canvasRatio =
        width /
        height;


      let sourceX = 0;
      let sourceY = 0;

      let sourceWidth =
        video.videoWidth;

      let sourceHeight =
        video.videoHeight;


      if (
        videoRatio > canvasRatio
      ) {

        sourceHeight =
          video.videoHeight;

        sourceWidth =
          sourceHeight *
          canvasRatio;

        sourceX =
          (
            video.videoWidth -
            sourceWidth
          ) / 2;

      }

      else {

        sourceWidth =
          video.videoWidth;

        sourceHeight =
          sourceWidth /
          canvasRatio;

        sourceY =
          (
            video.videoHeight -
            sourceHeight
          ) / 2;

      }


      context.drawImage(

        video,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        0,
        0,

        width,
        height

      );

    }


    /* =========================================================
       FOOTAGE + WEBCAM MERGE
       Webcam becomes part of the footage rather than
       appearing as a separate visual layer
    ========================================================= */

    function buildCompositeFrame() {

      compositeCtx.clearRect(
        0,
        0,
        compositeCanvas.width,
        compositeCanvas.height
      );


      /* =====================================================
         MAIN FOOTAGE LAYER
      ===================================================== */

      compositeCtx.globalAlpha = 1;

      compositeCtx.globalCompositeOperation =
        "source-over";


      drawVideoCover(

        compositeCtx,

        footage,

        compositeCanvas.width,

        compositeCanvas.height

      );


      /* =====================================================
         WEBCAM MERGED LAYER
         Hard-light produces stronger visual integration
      ===================================================== */

      if (
        webcamActive &&
        webcam.readyState >= 2
      ) {

        compositeCtx.save();


        compositeCtx.globalAlpha =
          WEBCAM_OPACITY;


        compositeCtx.globalCompositeOperation =
          "hard-light";


        compositeCtx.filter =
          "saturate(1.35) contrast(1.15)";


        /* Mirror webcam */

        compositeCtx.translate(
          compositeCanvas.width,
          0
        );


        compositeCtx.scale(
          -1,
          1
        );


        drawVideoCover(

          compositeCtx,

          webcam,

          compositeCanvas.width,

          compositeCanvas.height

        );


        compositeCtx.restore();

      }


      compositeCtx.globalAlpha = 1;

      compositeCtx.globalCompositeOperation =
        "source-over";

      compositeCtx.filter =
        "none";

    }


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }

            });


          /* =====================================================
             WEBCAM ACTIVATION
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          webcamActive = true;


          /* =====================================================
             AUDIO CONTEXT
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          await audioContext.resume();


          const audioSource =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize =
            512;


          analyser.smoothingTimeConstant =
            0.35;


          audioSource.connect(
            analyser
          );


          timeData =
            new Uint8Array(
              analyser.fftSize
            );


          frequencyData =
            new Uint8Array(
              analyser.frequencyBinCount
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }

        catch (error) {

          console.error(
            "Camera or microphone failed:",
            error
          );


          startButton.textContent =
            "ACCESS FAILED";

        }

      }
    );


    /* =========================================================
       STRONG AUDIO ANALYSIS
       Uses waveform RMS + bass frequencies
       for much stronger sound reaction
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !timeData ||
        !frequencyData
      ) {

        audioLevel *= 0.9;

        bassLevel *= 0.9;

        audioPeak *= 0.88;

        return;

      }


      /* =====================================================
         WAVEFORM ENERGY
      ===================================================== */

      analyser.getByteTimeDomainData(
        timeData
      );


      let sumSquares = 0;


      for (
        let i = 0;
        i < timeData.length;
        i++
      ) {

        const value =
          (
            timeData[i] -
            128
          ) / 128;


        sumSquares +=
          value * value;

      }


      const rms =
        Math.sqrt(
          sumSquares /
          timeData.length
        );


      /* =====================================================
         FREQUENCY ENERGY
      ===================================================== */

      analyser.getByteFrequencyData(
        frequencyData
      );


      let bassSum = 0;

      const bassBins =
        Math.min(
          24,
          frequencyData.length
        );


      for (
        let i = 0;
        i < bassBins;
        i++
      ) {

        bassSum +=
          frequencyData[i];

      }


      const bassAverage =
        bassSum /
        bassBins /
        255;


      /* =====================================================
         AMPLIFIED AUDIO LEVEL
      ===================================================== */

      const amplified =
        Math.min(
          1,
          rms *
          AUDIO_SENSITIVITY
        );


      const amplifiedBass =
        Math.min(
          1,
          bassAverage * 3.5
        );


      audioLevel =
        audioLevel * 0.48 +
        amplified * 0.52;


      bassLevel =
        bassLevel * 0.52 +
        amplifiedBass * 0.48;


      const currentPeak =
        Math.max(
          audioLevel,
          bassLevel
        );


      audioPeak =
        Math.max(
          currentPeak,
          audioPeak * 0.82
        );

    }


    /* =========================================================
       WEBCAM MOTION DETECTION
       Detects where movement happens inside the camera
    ========================================================= */

    function detectWebcamMotion() {

      if (
        !webcamActive ||
        webcam.readyState < 2
      ) {

        webcamMotionAmount *= 0.85;

        return;

      }


      motionCtx.save();


      /* Mirror motion analysis to match displayed webcam */

      motionCtx.translate(
        MOTION_WIDTH,
        0
      );


      motionCtx.scale(
        -1,
        1
      );


      motionCtx.drawImage(

        webcam,

        0,
        0,

        MOTION_WIDTH,
        MOTION_HEIGHT

      );


      motionCtx.restore();


      const imageData =
        motionCtx.getImageData(

          0,
          0,

          MOTION_WIDTH,
          MOTION_HEIGHT

        );


      const pixels =
        imageData.data;


      if (
        previousMotionFrame === null
      ) {

        previousMotionFrame =
          new Uint8ClampedArray(
            pixels
          );

        return;

      }


      let totalDifference = 0;

      let weightedX = 0;

      let weightedY = 0;

      let changedPixels = 0;


      /* =====================================================
         MOTION PIXEL COMPARISON
      ===================================================== */

      for (
        let y = 0;
        y < MOTION_HEIGHT;
        y += 2
      ) {

        for (
          let x = 0;
          x < MOTION_WIDTH;
          x += 2
        ) {

          const index =
            (
              y *
              MOTION_WIDTH +
              x
            ) * 4;


          const currentBrightness =
            (
              pixels[index] +
              pixels[index + 1] +
              pixels[index + 2]
            ) / 3;


          const previousBrightness =
            (
              previousMotionFrame[index] +
              previousMotionFrame[index + 1] +
              previousMotionFrame[index + 2]
            ) / 3;


          const difference =
            Math.abs(
              currentBrightness -
              previousBrightness
            );


          if (
            difference > 18
          ) {

            const weight =
              difference - 18;


            totalDifference +=
              weight;


            weightedX +=
              x * weight;


            weightedY +=
              y * weight;


            changedPixels++;

          }

        }

      }


      /* =====================================================
         MOTION POSITION
      ===================================================== */

      if (
        totalDifference > 0 &&
        changedPixels > 2
      ) {

        const motionX =
          weightedX /
          totalDifference;


        const motionY =
          weightedY /
          totalDifference;


        const targetX =
          (
            motionX /
            MOTION_WIDTH
          ) *
          outputCanvas.width;


        const targetY =
          (
            motionY /
            MOTION_HEIGHT
          ) *
          outputCanvas.height;


        webcamMotionX =
          webcamMotionX * 0.55 +
          targetX * 0.45;


        webcamMotionY =
          webcamMotionY * 0.55 +
          targetY * 0.45;


        const rawMotion =
          totalDifference /
          9000;


        webcamMotionAmount =
          Math.min(
            1,
            webcamMotionAmount * 0.35 +
            rawMotion * 0.65
          );

      }

      else {

        webcamMotionAmount *=
          0.78;

      }


      previousMotionFrame.set(
        pixels
      );

    }


    /* =========================================================
       MOUSE TRACKING
       Mouse creates only a small local disturbance
    ========================================================= */

    window.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;


        const dx =
          mouseX -
          lastMouseX;


        const dy =
          mouseY -
          lastMouseY;


        mouseSpeed =
          Math.hypot(
            dx,
            dy
          );


        lastMouseX =
          mouseX;

        lastMouseY =
          mouseY;


        mouseMoving = true;


        clearTimeout(
          mouseTimer
        );


        mouseTimer =
          setTimeout(
            () => {

              mouseMoving = false;

            },
            70
          );

      }
    );


    /* =========================================================
       IRREGULAR POLYGON PATH
       Creates non-rectangular glitch boundaries
    ========================================================= */

    function createIrregularPath(
      context,
      centerX,
      centerY,
      radius
    ) {

      const points =
        randomInt(
          5,
          13
        );


      const angleStep =
        (
          Math.PI * 2
        ) / points;


      context.beginPath();


      for (
        let i = 0;
        i < points;
        i++
      ) {

        const angle =
          angleStep * i +
          random(
            -0.3,
            0.3
          );


        const localRadius =
          radius *
          random(
            0.25,
            1
          );


        const x =
          centerX +
          Math.cos(angle) *
          localRadius;


        const y =
          centerY +
          Math.sin(angle) *
          localRadius *
          random(
            0.35,
            1.15
          );


        if (
          i === 0
        ) {

          context.moveTo(
            x,
            y
          );

        }

        else {

          context.lineTo(
            x,
            y
          );

        }

      }


      context.closePath();

    }


    /* =========================================================
       IRREGULAR DATAMOSH SHARD
       Copies temporal image through a random polygon
    ========================================================= */

    function irregularShard(
      centerX,
      centerY,
      radius,
      strength
    ) {

      ctx.save();


      createIrregularPath(

        ctx,

        centerX +
        random(
          -radius * 0.55,
          radius * 0.55
        ),

        centerY +
        random(
          -radius * 0.55,
          radius * 0.55
        ),

        random(
          radius * 0.15,
          radius * 0.7
        )

      );


      ctx.clip();


      const offsetX =
        random(
          -38,
          38
        ) *
        strength;


      const offsetY =
        random(
          -18,
          18
        ) *
        strength;


      ctx.globalAlpha =
        random(
          0.45,
          0.96
        );


      ctx.drawImage(

        memoryCanvas,

        offsetX,
        offsetY,

        outputCanvas.width *
        random(
          0.97,
          1.04
        ),

        outputCanvas.height *
        random(
          0.97,
          1.04
        )

      );


      ctx.restore();

    }


    /* =========================================================
       LIQUID DATAMOSH BLOB
       Creates an organic distorted shape instead of rectangles
    ========================================================= */

    function liquidBlob(
      centerX,
      centerY,
      radius,
      strength
    ) {

      const x =
        centerX +
        random(
          -radius,
          radius
        );


      const y =
        centerY +
        random(
          -radius,
          radius
        );


      const blobRadius =
        random(
          7,
          radius * 0.55
        );


      ctx.save();


      ctx.beginPath();


      const points = 10;


      for (
        let i = 0;
        i <= points;
        i++
      ) {

        const angle =
          (
            i / points
          ) *
          Math.PI *
          2;


        const distortion =
          random(
            0.25,
            1
          );


        const px =
          x +
          Math.cos(angle) *
          blobRadius *
          distortion;


        const py =
          y +
          Math.sin(angle) *
          blobRadius *
          random(
            0.25,
            1
          );


        if (
          i === 0
        ) {

          ctx.moveTo(
            px,
            py
          );

        }

        else {

          const cpX =
            px +
            random(
              -blobRadius * 0.3,
              blobRadius * 0.3
            );


          const cpY =
            py +
            random(
              -blobRadius * 0.3,
              blobRadius * 0.3
            );


          ctx.quadraticCurveTo(

            cpX,
            cpY,

            px,
            py

          );

        }

      }


      ctx.closePath();

      ctx.clip();


      ctx.globalAlpha =
        random(
          0.35,
          0.88
        );


      const shiftX =
        random(
          -50,
          50
        ) *
        strength;


      const shiftY =
        random(
          -20,
          20
        ) *
        strength;


      ctx.drawImage(

        memoryCanvas,

        shiftX,
        shiftY,

        outputCanvas.width,
        outputCanvas.height

      );


      ctx.restore();

    }


    /* =========================================================
       JAGGED TEMPORAL RIP
       Creates fractured non-uniform digital tearing
    ========================================================= */

    function jaggedRip(
      centerX,
      centerY,
      radius,
      strength
    ) {

      ctx.save();


      const startX =
        centerX +
        random(
          -radius,
          radius
        );


      const startY =
        centerY +
        random(
          -radius,
          radius
        );


      ctx.beginPath();


      ctx.moveTo(
        startX,
        startY
      );


      const segments =
        randomInt(
          4,
          12
        );


      let currentX =
        startX;

      let currentY =
        startY;


      for (
        let i = 0;
        i < segments;
        i++
      ) {

        currentX +=
          random(
            -radius * 0.35,
            radius * 0.55
          );


        currentY +=
          random(
            -radius * 0.25,
            radius * 0.25
          );


        ctx.lineTo(
          currentX,
          currentY
        );

      }


      for (
        let i = 0;
        i < segments;
        i++
      ) {

        currentX +=
          random(
            -radius * 0.4,
            radius * 0.25
          );


        currentY +=
          random(
            radius * 0.04,
            radius * 0.25
          );


        ctx.lineTo(
          currentX,
          currentY
        );

      }


      ctx.closePath();

      ctx.clip();


      ctx.globalAlpha =
        random(
          0.45,
          0.95
        );


      ctx.drawImage(

        memoryCanvas,

        random(
          -65,
          65
        ) *
        strength,

        random(
          -12,
          12
        ) *
        strength,

        outputCanvas.width,
        outputCanvas.height

      );


      ctx.restore();

    }


    /* =========================================================
       EXTREME CHROMATIC SHARD
       Creates exaggerated neon color displacement
    ========================================================= */

    function chromaticShard(
      centerX,
      centerY,
      radius,
      strength
    ) {

      ctx.save();


      createIrregularPath(

        ctx,

        centerX +
        random(
          -radius,
          radius
        ),

        centerY +
        random(
          -radius,
          radius
        ),

        random(
          5,
          radius * 0.6
        )

      );


      ctx.clip();


      const hue =
        random(
          0,
          360
        );


      ctx.globalCompositeOperation =
        Math.random() > 0.5
          ? "screen"
          : "hard-light";


      ctx.globalAlpha =
        random(
          0.55,
          0.95
        );


      ctx.filter =
        `saturate(${random(4, 12)})
         contrast(${random(1.5, 3)})
         hue-rotate(${hue}deg)`;


      ctx.drawImage(

        memoryCanvas,

        random(
          -45,
          45
        ) *
        strength,

        random(
          -20,
          20
        ) *
        strength,

        outputCanvas.width,
        outputCanvas.height

      );


      ctx.restore();


      ctx.globalCompositeOperation =
        "source-over";


      ctx.filter =
        "none";

    }


    /* =========================================================
       NEON COLOR SPLASH
       Creates irregular saturated color fields
    ========================================================= */

    function neonSplash(
      centerX,
      centerY,
      radius
    ) {

      ctx.save();


      createIrregularPath(

        ctx,

        centerX +
        random(
          -radius,
          radius
        ),

        centerY +
        random(
          -radius,
          radius
        ),

        random(
          4,
          radius * 0.45
        )

      );


      ctx.globalCompositeOperation =
        Math.random() > 0.5
          ? "screen"
          : "hard-light";


      ctx.fillStyle =
        randomColor();


      ctx.globalAlpha =
        random(
          0.3,
          0.82
        );


      ctx.fill();


      ctx.restore();

    }


    /* =========================================================
       GHOST FRAME
       Repeats old fragments with motion trails
    ========================================================= */

    function ghostFragment(
      centerX,
      centerY,
      radius,
      strength
    ) {

      const repeats =
        randomInt(
          2,
          5
        );


      for (
        let i = 0;
        i < repeats;
        i++
      ) {

        ctx.save();


        createIrregularPath(

          ctx,

          centerX,

          centerY,

          random(
            radius * 0.15,
            radius * 0.7
          )

        );


        ctx.clip();


        ctx.globalAlpha =
          0.32 /
          (
            i + 0.7
          );


        ctx.drawImage(

          memoryCanvas,

          random(
            -18,
            18
          ) *
          strength *
          i,

          random(
            -12,
            12
          ) *
          strength *
          i,

          outputCanvas.width,
          outputCanvas.height

        );


        ctx.restore();

      }

    }


    /* =========================================================
       RANDOM GLITCH ENGINE
       Chooses a different visual process for every fragment
       so there is no repeating pattern
    ========================================================= */

    function createIrregularGlitch(
      x,
      y,
      radius,
      intensity,
      amount
    ) {

      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const choice =
          Math.random();


        if (
          choice < 0.23
        ) {

          irregularShard(
            x,
            y,
            radius,
            intensity
          );

        }

        else if (
          choice < 0.44
        ) {

          liquidBlob(
            x,
            y,
            radius,
            intensity
          );

        }

        else if (
          choice < 0.63
        ) {

          jaggedRip(
            x,
            y,
            radius,
            intensity
          );

        }

        else if (
          choice < 0.81
        ) {

          chromaticShard(
            x,
            y,
            radius,
            intensity
          );

        }

        else if (
          choice < 0.93
        ) {

          ghostFragment(
            x,
            y,
            radius,
            intensity
          );

        }

        else {

          neonSplash(
            x,
            y,
            radius
          );

        }

      }

    }


    /* =========================================================
       MOUSE-REACTIVE GLITCH
       Affects only a small region around the cursor
    ========================================================= */

    function createMouseGlitch() {

      if (
        !mouseMoving ||
        mouseSpeed < 0.5
      ) {

        mouseSpeed *=
          0.84;

        return;

      }


      const speed =
        Math.min(
          mouseSpeed,
          35
        );


      const radius =
        Math.min(

          MOUSE_MAX_RADIUS,

          MOUSE_MIN_RADIUS +
          speed * 0.85

        );


      const intensity =
        MOSH_STRENGTH +
        speed * 0.035 +
        audioPeak * 1.7;


      const amount =
        Math.floor(

          2 +
          Math.random() * 4 +
          speed * 0.08 +
          audioLevel * 8

        );


      createIrregularGlitch(

        mouseX,
        mouseY,

        radius,

        intensity,

        amount

      );


      mouseSpeed *=
        0.82;

    }


    /* =========================================================
       WEBCAM-MOTION GLITCH
       Body movement creates glitch at the actual moving area
    ========================================================= */

    function createWebcamMotionGlitch() {

      if (
        webcamMotionAmount < 0.025
      ) {

        return;

      }


      const radius =
        Math.min(

          MOTION_MAX_RADIUS,

          MOTION_MIN_RADIUS +
          webcamMotionAmount * 110 +
          audioLevel * 35

        );


      const intensity =
        MOSH_STRENGTH +
        webcamMotionAmount * 4.5 +
        audioPeak * 2.8;


      const amount =
        Math.floor(

          3 +
          webcamMotionAmount * 28 +
          audioLevel * 16

        );


      /* =====================================================
         MAIN MOTION CENTER
      ===================================================== */

      createIrregularGlitch(

        webcamMotionX,
        webcamMotionY,

        radius,

        intensity,

        amount

      );


      /* =====================================================
         SECONDARY MOTION BURST
         Creates less predictable spatial behavior
      ===================================================== */

      if (
        Math.random() <
        webcamMotionAmount * 0.8
      ) {

        createIrregularGlitch(

          webcamMotionX +
          random(
            -radius,
            radius
          ),

          webcamMotionY +
          random(
            -radius,
            radius
          ),

          radius *
          random(
            0.25,
            0.65
          ),

          intensity *
          random(
            0.7,
            1.4
          ),

          randomInt(
            1,
            6
          )

        );

      }

    }


    /* =========================================================
       STRONG SOUND-REACTIVE GLITCH
       Microphone can create visual disruption anywhere
       on the screen
    ========================================================= */

    function createAudioGlitch() {

      if (
        audioLevel < 0.025
      ) {

        return;

      }


      const energy =
        Math.max(
          audioLevel,
          bassLevel
        );


      /* =====================================================
         CONTINUOUS SOUND REACTION
      ===================================================== */

      const chance =
        0.15 +
        energy * 0.82;


      if (
        Math.random() >
        chance
      ) {

        return;

      }


      const burstCount =
        Math.floor(

          1 +
          energy * 5 +
          audioPeak * 4

        );


      for (
        let b = 0;
        b < burstCount;
        b++
      ) {

        let x;
        let y;


        /* ===================================================
           SOUND SOMETIMES FOLLOWS WEBCAM MOVEMENT
        =================================================== */

        if (
          webcamActive &&
          webcamMotionAmount > 0.03 &&
          Math.random() > 0.35
        ) {

          x =
            webcamMotionX +
            random(
              -120,
              120
            );


          y =
            webcamMotionY +
            random(
              -120,
              120
            );

        }

        else {

          x =
            random(
              0,
              outputCanvas.width
            );


          y =
            random(
              0,
              outputCanvas.height
            );

        }


        const radius =
          random(
            18,
            48 +
            energy * 100
          );


        const intensity =
          1 +
          energy * 5.5;


        const amount =
          Math.floor(

            1 +
            energy * 10

          );


        createIrregularGlitch(

          x,
          y,

          radius,

          intensity,

          amount

        );

      }

    }


    /* =========================================================
       AUDIO PEAK EXPLOSION
       Loud sounds cause sudden unpredictable visual ruptures
    ========================================================= */

    function createAudioPeakExplosion() {

      if (
        audioPeak < 0.22
      ) {

        return;

      }


      const probability =
        audioPeak * 0.55;


      if (
        Math.random() >
        probability
      ) {

        return;

      }


      const x =
        webcamMotionAmount > 0.04
          ? webcamMotionX +
            random(-100, 100)
          : random(
              0,
              outputCanvas.width
            );


      const y =
        webcamMotionAmount > 0.04
          ? webcamMotionY +
            random(-100, 100)
          : random(
              0,
              outputCanvas.height
            );


      const radius =
        random(
          45,
          150
        );


      createIrregularGlitch(

        x,
        y,

        radius,

        2 +
        audioPeak * 6,

        randomInt(
          6,
          18
        )

      );

    }


    /* =========================================================
       MEMORY UPDATE
       Blends the current image with old visual information
       to create datamosh-style temporal persistence
    ========================================================= */

    function updateMemory() {

      memoryCtx.save();


      memoryCtx.globalAlpha =
        MEMORY_AMOUNT;


      memoryCtx.drawImage(

        memoryCanvas,

        random(
          -1.5,
          1.5
        ),

        random(
          -1,
          1
        ),

        memoryCanvas.width,

        memoryCanvas.height

      );


      memoryCtx.restore();


      memoryCtx.save();


      memoryCtx.globalAlpha =
        0.34;


      memoryCtx.globalCompositeOperation =
        "screen";


      memoryCtx.drawImage(

        compositeCanvas,

        0,
        0,

        memoryCanvas.width,

        memoryCanvas.height

      );


      memoryCtx.restore();

    }


    /* =========================================================
       DRAW BASE IMAGE
       Displays the merged footage + webcam every frame
    ========================================================= */

    function drawBaseFrame() {

      ctx.globalAlpha = 1;

      ctx.globalCompositeOperation =
        "source-over";

      ctx.filter =
        "saturate(1.15) contrast(1.05)";


      ctx.drawImage(

        compositeCanvas,

        0,
        0,

        outputCanvas.width,

        outputCanvas.height

      );


      ctx.filter =
        "none";

    }


    /* =========================================================
       MAIN ANIMATION LOOP
       Combines footage, webcam motion, mouse and sound
    ========================================================= */

    function animate() {

      buildCompositeFrame();


      updateAudio();


      detectWebcamMotion();


      updateMemory();


      drawBaseFrame();


      createMouseGlitch();


      createWebcamMotionGlitch();


      createAudioGlitch();


      createAudioPeakExplosion();


      requestAnimationFrame(
        animate
      );

    }


    /* =========================================================
       START INTERACTIVE SYSTEM
    ========================================================= */

    animate();


  </script>

</body>
