<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>


  <style>

    /* =========================================================
       PAGE SETUP
       Full-screen interactive installation
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      cursor: crosshair;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================================================
       HYDRA OUTPUT
       Final interactive image
    ========================================================= */

    #hydraCanvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: black;
    }


    /* =========================================================
       HIDDEN VIDEO SOURCES
       Footage and webcam remain active
       but are not directly displayed
    ========================================================= */

    #footage,
    #webcam {
      position: fixed;

      top: 0;
      left: 0;

      width: 2px;
      height: 2px;

      opacity: 0.001;

      pointer-events: none;
    }


    /* =========================================================
       HIDDEN MOUSE FIELD
       Canvas used as a Hydra modulation source
    ========================================================= */

    #mouseField {
      position: fixed;

      width: 2px;
      height: 2px;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA + SOUND BUTTON
    ========================================================= */

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 100;

      padding: 9px 14px;

      border:
        1px solid
        rgba(255,255,255,0.78);

      background:
        rgba(0,0,0,0.45);

      color: white;

      font-size: 10px;

      letter-spacing: 1.5px;

      cursor: pointer;
    }


    /* =========================================================
       ACTIVE BUTTON
    ========================================================= */

    #startButton.active {
      opacity: 0.18;
    }


    /* =========================================================
       ERROR MESSAGE
       Only appears if Hydra fails to load
    ========================================================= */

    #errorMessage {
      position: fixed;

      left: 20px;
      bottom: 20px;

      z-index: 200;

      color: white;

      font-size: 12px;

      display: none;
    }

  </style>

</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this URL later with your own footage
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >

    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================================================
       LIVE WEBCAM
       Only becomes active after button click
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       MOUSE MODULATION SOURCE
  ========================================================== -->

  <canvas id="mouseField"></canvas>


  <!-- =========================================================
       CAMERA + MICROPHONE CONTROL
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       HYDRA OUTPUT
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       ERROR MESSAGE
  ========================================================== -->

  <div id="errorMessage">
    Hydra could not start.
  </div>


  <!-- =========================================================
       HYDRA-SYNTH LIBRARY
  ========================================================== -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>


    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const hydraCanvas =
      document.getElementById(
        "hydraCanvas"
      );


    const footage =
      document.getElementById(
        "footage"
      );


    const webcam =
      document.getElementById(
        "webcam"
      );


    const mouseCanvas =
      document.getElementById(
        "mouseField"
      );


    const mouseCtx =
      mouseCanvas.getContext(
        "2d"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =========================================================
       CAMERA STATE
    ========================================================= */

    let cameraStarted = false;


    /* =========================================================
       HYDRA STATE
    ========================================================= */

    let patchStarted = false;


    /* =========================================================
       MOUSE STATE
    ========================================================= */

    let mouseX =
      window.innerWidth / 2;


    let mouseY =
      window.innerHeight / 2;


    let previousMouseX =
      mouseX;


    let previousMouseY =
      mouseY;


    let mouseEnergy = 0;


    /* =========================================================
       AUDIO STATE
    ========================================================= */

    let analyser = null;

    let audioData = null;

    let audioLevel = 0;

    let audioPeak = 0;


    /* =========================================================
       VISUAL SETTINGS — FOOTAGE
       Higher value = footage remains more recognizable
    ========================================================= */

    const FOOTAGE_RETURN = 0.24;


    /* =========================================================
       VISUAL SETTINGS — CAMERA
       Webcam is present but merged into footage
    ========================================================= */

    const CAMERA_BLEND = 0.34;


    /* =========================================================
       VISUAL SETTINGS — CAMERA WARP
       Webcam deforms the footage
    ========================================================= */

    const CAMERA_WARP = 0.09;


    /* =========================================================
       VISUAL SETTINGS — MOUSE
       Strong visible cursor deformation
    ========================================================= */

    const MOUSE_RADIUS = 180;

    const MOUSE_WARP = 0.75;

    const MOUSE_COLOR = 0.40;


    /* =========================================================
       VISUAL SETTINGS — COLOR
       Controls psychedelic color intensity
    ========================================================= */

    const COLOR_STRENGTH = 2.4;


    /* =========================================================
       VISUAL SETTINGS — AUDIO
    ========================================================= */

    const AUDIO_SENSITIVITY = 17;


    /* =========================================================
       VISUAL SETTINGS — FEEDBACK
       Kept moderate to avoid sandy texture
    ========================================================= */

    const FEEDBACK_AMOUNT = 0.20;


    /* =========================================================
       CHECK HYDRA LIBRARY
    ========================================================= */

    if (
      typeof Hydra === "undefined"
    ) {

      errorMessage.style.display =
        "block";


      throw new Error(
        "Hydra library failed to load."
      );

    }


    /* =========================================================
       HYDRA ENGINE
    ========================================================= */

    const hydra =
      new Hydra({

        canvas:
          hydraCanvas,

        detectAudio:
          false,

        enableStreamCapture:
          false,

        makeGlobal:
          true

      });


    /* =========================================================
       RESIZE SYSTEM
    ========================================================= */

    function resizeSystem() {

      const width =
        window.innerWidth;


      const height =
        window.innerHeight;


      mouseCanvas.width =
        width;


      mouseCanvas.height =
        height;


      if (
        typeof setResolution ===
        "function"
      ) {

        setResolution(
          width,
          height
        );

      }

    }


    resizeSystem();


    window.addEventListener(
      "resize",
      resizeSystem
    );


    /* =========================================================
       MOUSE SOURCE INITIALIZATION
       Hydra s2 receives the live mouse field
    ========================================================= */

    s2.init({
      src: mouseCanvas
    });


    /* =========================================================
       MOUSE TRACKING
       Mouse movement creates a strong energy value
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        mouseX =
          event.clientX;


        mouseY =
          event.clientY;


        const dx =
          mouseX -
          previousMouseX;


        const dy =
          mouseY -
          previousMouseY;


        const speed =
          Math.hypot(
            dx,
            dy
          );


        mouseEnergy =
          Math.min(

            1,

            0.25 +
            speed *
            0.035

          );


        previousMouseX =
          mouseX;


        previousMouseY =
          mouseY;

      }
    );


    /* =========================================================
       MOUSE FIELD DRAWING
       Creates an irregular soft field exactly at cursor position
    ========================================================= */

    function drawMouseField() {

      mouseCtx.clearRect(

        0,
        0,

        mouseCanvas.width,
        mouseCanvas.height

      );


      const radius =

        MOUSE_RADIUS +

        mouseEnergy *
        130;


      /* =====================================================
         MAIN MOUSE GRADIENT
      ===================================================== */

      const gradient =
        mouseCtx.createRadialGradient(

          mouseX,
          mouseY,
          0,

          mouseX,
          mouseY,
          radius

        );


      gradient.addColorStop(

        0,

        `rgba(
          255,
          255,
          255,
          ${mouseEnergy}
        )`

      );


      gradient.addColorStop(

        0.18,

        `rgba(
          255,
          255,
          255,
          ${mouseEnergy * 0.9}
        )`

      );


      gradient.addColorStop(

        0.50,

        `rgba(
          160,
          160,
          160,
          ${mouseEnergy * 0.45}
        )`

      );


      gradient.addColorStop(

        1,

        "rgba(0,0,0,0)"

      );


      mouseCtx.fillStyle =
        gradient;


      mouseCtx.fillRect(

        0,
        0,

        mouseCanvas.width,
        mouseCanvas.height

      );


      /* =====================================================
         IRREGULAR MOUSE BLOBS
         Makes cursor influence less perfectly circular
      ===================================================== */

      for (
        let i = 0;
        i < 6;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;


        const distance =
          Math.random() *
          radius *
          0.55;


        const x =
          mouseX +
          Math.cos(angle) *
          distance;


        const y =
          mouseY +
          Math.sin(angle) *
          distance;


        const size =
          radius *
          (
            0.10 +
            Math.random() *
            0.20
          );


        const blob =
          mouseCtx.createRadialGradient(

            x,
            y,
            0,

            x,
            y,
            size

          );


        blob.addColorStop(

          0,

          `rgba(
            255,
            255,
            255,
            ${mouseEnergy * 0.45}
          )`

        );


        blob.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );


        mouseCtx.fillStyle =
          blob;


        mouseCtx.fillRect(

          0,
          0,

          mouseCanvas.width,
          mouseCanvas.height

        );

      }


      /* =====================================================
         MOUSE ENERGY DECAY
      ===================================================== */

      mouseEnergy *=
        0.94;


      requestAnimationFrame(
        drawMouseField
      );

    }


    drawMouseField();


    /* =========================================================
       AUDIO ANALYSIS LOOP
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *=
          0.9;


        audioPeak *=
          0.86;


        requestAnimationFrame(
          updateAudio
        );


        return;

      }


      analyser.getByteTimeDomainData(
        audioData
      );


      let sum =
        0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        const value =

          (
            audioData[i] -
            128
          ) /

          128;


        sum +=
          value *
          value;

      }


      const rms =
        Math.sqrt(

          sum /
          audioData.length

        );


      const target =
        Math.min(

          1,

          rms *
          AUDIO_SENSITIVITY

        );


      audioLevel =

        audioLevel *
        0.5 +

        target *
        0.5;


      audioPeak =
        Math.max(

          target,

          audioPeak *
          0.87

        );


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       FOOTAGE INITIALIZATION
       IMPORTANT:
       The visual starts immediately.
       Camera is NOT required.
    ========================================================= */

    function initializeFootage() {

      if (
        patchStarted
      ) {
        return;
      }


      /* =====================================================
         MAKE SURE FOOTAGE IS PLAYING
      ===================================================== */

      footage.play()
        .catch(
          error => {

            console.log(
              "Footage autoplay:",
              error
            );

          }
        );


      /* =====================================================
         FOOTAGE = HYDRA SOURCE s0
      ===================================================== */

      s0.init({
        src: footage
      });


      /* =====================================================
         START PATCH IMMEDIATELY
      ===================================================== */

      startHydraPatch();


      patchStarted =
        true;

    }


    /* =========================================================
       LOAD FOOTAGE AS SOON AS POSSIBLE
    ========================================================= */

    if (
      footage.readyState >= 2
    ) {

      initializeFootage();

    }

    else {

      footage.addEventListener(

        "loadeddata",

        initializeFootage,

        {
          once: true
        }

      );

    }


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
       Camera joins an already-running visual
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          cameraStarted
        ) {
          return;
        }


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode:
                  "user"
              },

              audio: {
                echoCancellation:
                  false,

                noiseSuppression:
                  false,

                autoGainControl:
                  true
              }

            });


          /* =====================================================
             WEBCAM ACTIVATION
             Hydra s1 becomes live camera
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          s1.init({
            src: webcam
          });


          cameraStarted =
            true;


          /* =====================================================
             MICROPHONE ACTIVATION
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          await audioContext.resume();


          const microphone =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize =
            512;


          analyser.smoothingTimeConstant =
            0.32;


          microphone.connect(
            analyser
          );


          audioData =
            new Uint8Array(
              analyser.fftSize
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }

        catch(error) {

          console.error(
            "Camera / microphone error:",
            error
          );


          startButton.textContent =
            "CAMERA / SOUND FAILED";

        }

      }
    );


    /* =========================================================
       MAIN HYDRA PATCH
    ========================================================= */

    function startHydraPatch() {


      /* =====================================================
         WEBCAM GHOST — o1

         IMPORTANT:
         Before webcam activation, s1 is effectively empty.
         After activation, face/body enters this feedback system.

         Webcam is distorted BEFORE being combined with footage.
      ===================================================== */

      src(s1)

        .scale(

          () =>
            1.01 +
            audioLevel *
            0.02

        )


        /* ===================================================
           LIQUID CAMERA DISTORTION
      =================================================== */

        .modulate(

          osc(
            1.5,
            0.015,
            0.45
          )

            .rotate(

              () =>
                Math.sin(
                  time *
                  0.08
                ) *
                0.15

            ),

          () =>
            0.018 +
            audioLevel *
            0.055

        )


        /* ===================================================
           CAMERA COLOR
           Cyan / blue / pink / purple color movement
      =================================================== */

        .colorama(

          () =>
            0.015 +
            Math.sin(
              time *
              0.12
            ) *
            0.012 +
            audioLevel *
            0.035

        )


        .saturate(

          () =>
            2.7 +
            audioLevel *
            3.0

        )


        .contrast(
          1.08
        )


        /* ===================================================
           CAMERA GHOST TRAILS
      =================================================== */

        .blend(

          src(o1)

            .scale(

              () =>
                1.002 +
                audioLevel *
                0.005

            )

            .scrollX(

              () =>
                Math.sin(
                  time *
                  0.10
                ) *
                0.002

            )

            .scrollY(

              () =>
                Math.cos(
                  time *
                  0.085
                ) *
                0.002

            )

            .colorama(
              0.003
            ),

          () =>
            0.13 +
            audioLevel *
            0.08

        )


        .out(o1);



      /* =====================================================
         MAIN FOOTAGE — o0

         Footage is ALWAYS the foundation.
      ===================================================== */

      src(s0)


        /* ===================================================
           FOOTAGE COLOR ENHANCEMENT
      =================================================== */

        .saturate(

          () =>
            COLOR_STRENGTH +
            audioLevel *
            1.2

        )


        .contrast(
          1.06
        )


        /* ===================================================
           SLOW LIQUID FOOTAGE MOVEMENT
      =================================================== */

        .modulate(

          osc(
            1.2,
            0.008,
            0.25
          )

            .rotate(

              () =>
                Math.sin(
                  time *
                  0.055
                ) *
                0.18

            ),

          () =>
            0.007 +
            audioLevel *
            0.02

        )


        /* ===================================================
           WEBCAM DEFORMS FOOTAGE

           Before camera:
           o1 is basically empty, so effect is minimal.

           After camera:
           face/body physically bends the footage.
      =================================================== */

        .modulate(

          src(o1)

            .saturate(
              0
            )

            .contrast(
              1.25
            ),

          () =>
            cameraStarted
              ? CAMERA_WARP +
                audioLevel *
                0.055
              : 0

        )


        /* ===================================================
           WEBCAM MERGES INTO FOOTAGE
      =================================================== */

        .blend(

          src(o1)

            .colorama(

              () =>
                0.015 +
                audioLevel *
                0.02

            )

            .saturate(

              () =>
                2.5 +
                audioLevel *
                2.4

            ),

          () =>
            cameraStarted
              ? CAMERA_BLEND +
                audioLevel *
                0.05
              : 0

        )


        /* ===================================================
           CYAN / ELECTRIC BLUE COLOR FIELD

           This is blended INTO existing pixels.
           It does not cover the image as a solid layer.
      =================================================== */

        .blend(

          osc(
            2.0,
            0.008,
            0.65
          )

            .color(
              0.0,
              0.85,
              1.5
            )

            .modulate(

              src(o1),

              () =>
                cameraStarted
                  ? 0.025
                  : 0.008

            ),

          () =>
            0.045 +
            audioLevel *
            0.045

        )


        /* ===================================================
           MAGENTA / PINK COLOR FIELD
      =================================================== */

        .blend(

          osc(
            1.35,
            -0.009,
            1.3
          )

            .color(
              1.45,
              0.0,
              0.8
            )

            .rotate(
              0.6
            ),

          () =>
            0.035 +
            audioLevel *
            0.04

        )


        /* ===================================================
           ACID GREEN / YELLOW COLOR FIELD
      =================================================== */

        .blend(

          osc(
            1.1,
            0.006,
            0.8
          )

            .color(
              0.45,
              1.35,
              0.0
            )

            .rotate(
              -0.8
            ),

          () =>
            0.025 +
            audioPeak *
            0.04

        )


        /* ===================================================
           SOFT TEMPORAL FEEDBACK

           Low enough to avoid "sand".
      =================================================== */

        .blend(

          src(o0)

            .scale(
              1.0015
            )

            .scrollX(

              () =>
                Math.sin(
                  time *
                  0.08
                ) *
                0.0015

            )

            .scrollY(

              () =>
                Math.cos(
                  time *
                  0.07
                ) *
                0.0015

            )

            .colorama(
              0.003
            ),

          () =>
            FEEDBACK_AMOUNT +
            audioLevel *
            0.045

        )


        /* ===================================================
           FINAL PSYCHEDELIC FOOTAGE COLOR
      =================================================== */

        .colorama(

          () =>
            0.004 +
            Math.sin(
              time *
              0.07
            ) *
            0.004 +
            audioLevel *
            0.012

        )


        .saturate(

          () =>
            1.5 +
            audioLevel *
            1.4

        )


        .out(o0);



      /* =====================================================
         MOUSE FIELD — o2

         s2 is a REAL canvas following the cursor.
      ===================================================== */

      src(s2)


        .contrast(
          1.8
        )


        /* ===================================================
           IRREGULARIZE MOUSE FIELD
      =================================================== */

        .modulate(

          osc(
            3,
            0.025,
            0.5
          )

            .rotate(

              () =>
                time *
                0.018

            ),

          () =>
            0.04 +
            mouseEnergy *
            0.16

        )


        .out(o2);



      /* =====================================================
         FINAL MOUSE EFFECT — o3

         Mouse now produces THREE clearly visible changes:

         1. strong spatial warp
         2. local color mutation
         3. local feedback smear
      ===================================================== */

      src(o0)


        /* ===================================================
           1. STRONG MOUSE WARP
      =================================================== */

        .modulate(

          src(o2),

          () =>
            0.04 +
            mouseEnergy *
            MOUSE_WARP

        )


        /* ===================================================
           2. MOUSE COLOR MUTATION
      =================================================== */

        .blend(

          src(o0)

            .modulateHue(

              src(o2),

              () =>
                0.5 +
                mouseEnergy *
                3.0

            )

            .colorama(

              () =>
                0.015 +
                mouseEnergy *
                0.10

            )

            .saturate(

              () =>
                1.5 +
                mouseEnergy *
                3.0

            ),

          () =>
            mouseEnergy *
            MOUSE_COLOR

        )


        /* ===================================================
           3. MOUSE TEMPORAL SMEAR
      =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.0 +
                mouseEnergy *
                0.015

            )

            .scrollX(

              () =>
                mouseEnergy *
                0.008

            )

            .scrollY(

              () =>
                -mouseEnergy *
                0.005

            )

            .modulate(

              src(o2),

              () =>
                mouseEnergy *
                0.45

            ),

          () =>
            mouseEnergy *
            0.24

        )


        .out(o3);



      /* =====================================================
         FOOTAGE REINFORCEMENT

         Original footage is deliberately returned
         to the final image.

         This prevents webcam / color / feedback
         from swallowing the footage completely.
      ===================================================== */

      src(o3)

        .blend(

          src(s0)

            .saturate(
              1.5
            )

            .contrast(
              1.03
            ),

          FOOTAGE_RETURN

        )


        .out(o3);



      /* =====================================================
         FINAL OUTPUT
      ===================================================== */

      render(o3);

    }


  </script>

</body>

</html>
