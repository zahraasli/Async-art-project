<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>


  <style>

    /* =========================================================
       PAGE RESET
       Removes default browser spacing
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================================
       PAGE BACKGROUND
    ========================================================= */

    html,
    body {
      width: 80%;
      height: 80%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       MAIN FOOTAGE
       This remains the dominant image
    ========================================================= */

    #footage {
      position: fixed;
      inset: 0;

      width: 60%;
      height: 50%;

      object-fit: cover;

      z-index: 1;
    }


    /* =========================================================
       WEBCAM OVERLAY
       Webcam appears over the main footage
    ========================================================= */

    #webcam {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      mix-blend-mode: screen;

      z-index: 3;

      pointer-events: none;

      transition: opacity 1s ease;
    }


    /* =========================================================
       WEBCAM VISIBILITY
       Lower value = footage stays more dominant
    ========================================================= */

    #webcam.active {
      opacity: 0.50;
    }


    /* =========================================================
       DATAMOSH CANVAS
       Temporal glitch is displayed here
    ========================================================= */

    #moshCanvas {
      position: fixed;
      inset: 0;

      width: 70%;
      height: 70%;

      z-index: 10;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA + MICROPHONE BUTTON
    ========================================================= */

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 10;

      padding: 10px 19px;

      border: 1px solid white;

      background: rgba(0, 0, 0.8, 0.65);

      color: white;

      font-size: 11px;

      letter-spacing: 1.4px;

      cursor: pointer;
    }


    /* =========================================================
       BUTTON HOVER
    ========================================================= */

    #startButton:hover {
      background: white;
      color: black;
    }


  </style>

</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this source with your own footage later
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >

    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================================================
       LIVE WEBCAM
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       CAMERA + MICROPHONE CONTROL
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       DATAMOSH OUTPUT
  ========================================================== -->

  <canvas id="moshCanvas"></canvas>


  <script>


    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const canvas =
      document.getElementById("moshCanvas");

    const ctx =
      canvas.getContext("2d");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       CURRENT FRAME BUFFER
       Stores the current footage + webcam frame
    ========================================================= */

    const frameCanvas =
      document.createElement("canvas");

    const frameCtx =
      frameCanvas.getContext("2d");


    /* =========================================================
       TEMPORAL FEEDBACK BUFFER
       Stores previous corrupted frames
       This creates the datamosh-like persistence
    ========================================================= */

    const feedbackCanvas =
      document.createElement("canvas");

    const feedbackCtx =
      feedbackCanvas.getContext("2d");


    /* =========================================================
       MOUSE POSITION
    ========================================================= */

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let previousX =
      mouseX;

    let previousY =
      mouseY;

    let mouseSpeed = 0;

    let mouseActive = false;


    /* =========================================================
       AUDIO VALUES
    ========================================================= */

    let analyser = null;

    let frequencyData = null;

    let audioLevel = 0;


    /* =========================================================
       DATAMOSH AREA SIZE
       Keep these values small for a local mouse effect
    ========================================================= */

    const MIN_RADIUS = 38;

    const MAX_RADIUS = 75;


    /* =========================================================
       DATAMOSH INTENSITY
       Higher value = stronger displacement
    ========================================================= */

    const MOSH_STRENGTH = 1.50;


    /* =========================================================
       TEMPORAL PERSISTENCE
       Higher value keeps old frames visible longer

       Recommended range:
       0.90 = short
       0.85 = medium
       0.98 = long
    ========================================================= */

    const FRAME_PERSISTENCE = 0.965;


    /* =========================================================
       COLOR BLEED COLORS
       Sharp colors used very occasionally
    ========================================================= */

    const sharpColors = [
      "#ff004c",
      "#ff2800",
      "#ff00b7",
      "#6a00ff",
      "#003cff",
      "#00eaff",
      "#00ff72",
      "#d9ff00"
    ];


    /* =========================================================
       RANDOM NUMBER HELPER
    ========================================================= */

    function random(min, max) {

      return (
        min +
        Math.random() *
        (max - min)
      );

    }


    /* =========================================================
       CANVAS RESIZE
    ========================================================= */

    function resizeCanvas() {

      const width =
        window.innerWidth;

      const height =
        window.innerHeight;


      canvas.width =
        width;

      canvas.height =
        height;


      frameCanvas.width =
        width;

      frameCanvas.height =
        height;


      feedbackCanvas.width =
        width;

      feedbackCanvas.height =
        height;

    }


    resizeCanvas();


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================================
       VIDEO COVER DRAWING
       Draws video like CSS object-fit: cover
       without stretching the image
    ========================================================= */

    function drawVideoCover(
      context,
      video,
      width,
      height
    ) {

      if (
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
      ) {
        return;
      }


      const videoRatio =
        video.videoWidth /
        video.videoHeight;


      const canvasRatio =
        width /
        height;


      let sourceWidth;

      let sourceHeight;

      let sourceX;

      let sourceY;


      if (
        videoRatio >
        canvasRatio
      ) {

        sourceHeight =
          video.videoHeight;

        sourceWidth =
          sourceHeight *
          canvasRatio;

        sourceX =
          (
            video.videoWidth -
            sourceWidth
          ) / 2;

        sourceY = 0;

      }

      else {

        sourceWidth =
          video.videoWidth;

        sourceHeight =
          sourceWidth /
          canvasRatio;

        sourceX = 0;

        sourceY =
          (
            video.videoHeight -
            sourceHeight
          ) / 2;

      }


      context.drawImage(

        video,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        0,
        0,

        width,
        height

      );

    }


    /* =========================================================
       CURRENT FRAME CAPTURE
       Combines footage and webcam into one source frame
    ========================================================= */

    function captureCurrentFrame() {

      frameCtx.clearRect(
        0,
        0,
        frameCanvas.width,
        frameCanvas.height
      );


      /* MAIN FOOTAGE */

      frameCtx.globalAlpha = 1;

      frameCtx.globalCompositeOperation =
        "source-over";


      drawVideoCover(

        frameCtx,

        footage,

        frameCanvas.width,

        frameCanvas.height

      );


      /* WEBCAM */

      if (
        webcam.readyState >= 2 &&
        webcam.classList.contains("active")
      ) {

        frameCtx.globalAlpha =
          0.28;


        frameCtx.globalCompositeOperation =
          "screen";


        drawVideoCover(

          frameCtx,

          webcam,

          frameCanvas.width,

          frameCanvas.height

        );

      }


      frameCtx.globalAlpha = 1;

      frameCtx.globalCompositeOperation =
        "source-over";

    }


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: true

            });


          /* =====================================================
             WEBCAM ACTIVATION
          ===================================================== */

          webcam.srcObject =
            stream;


          webcam.classList.add(
            "active"
          );


          await webcam.play();


          /* =====================================================
             MICROPHONE ANALYSIS
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          await audioContext.resume();


          const source =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize =
            256;


          analyser.smoothingTimeConstant =
            0.72;


          source.connect(
            analyser
          );


          frequencyData =
            new Uint8Array(
              analyser.frequencyBinCount
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";

        }

        catch (error) {

          console.error(
            error
          );


          startButton.textContent =
            "ACCESS FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO LEVEL DETECTION
       Sound affects datamosh intensity
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !frequencyData
      ) {

        audioLevel *= 0.94;

        return;

      }


      analyser.getByteFrequencyData(
        frequencyData
      );


      let total = 0;


      for (
        let i = 0;
        i < frequencyData.length;
        i++
      ) {

        total +=
          frequencyData[i];

      }


      const average =
        total /
        frequencyData.length;


      const normalized =
        Math.min(
          1,
          average / 255 * 5
        );


      audioLevel =
        audioLevel * 0.72 +
        normalized * 0.28;

    }


    /* =========================================================
       MOUSE TRACKING
       Only a small region around the mouse is affected
    ========================================================= */

    window.addEventListener(
      "mousemove",
      (event) => {

        mouseActive = true;


        mouseX =
          event.clientX;


        mouseY =
          event.clientY;


        const dx =
          mouseX -
          previousX;


        const dy =
          mouseY -
          previousY;


        mouseSpeed =
          Math.hypot(
            dx,
            dy
          );


        previousX =
          mouseX;


        previousY =
          mouseY;

      }
    );


    /* =========================================================
       TEMPORAL FEEDBACK
       Keeps fragments of previous frames alive
    ========================================================= */

    function updateFeedback() {

      feedbackCtx.save();


      feedbackCtx.globalAlpha =
        FRAME_PERSISTENCE;


      /* Slight random motion creates temporal instability */

      feedbackCtx.drawImage(

        feedbackCanvas,

        random(-1.5, 1.5),

        random(-1, 1),

        feedbackCanvas.width,

        feedbackCanvas.height

      );


      feedbackCtx.restore();

    }


    /* =========================================================
       DATAMOSH STRIP
       Copies previous frame fragments and pushes them sideways
    ========================================================= */

    function moshStrip(
      centerX,
      centerY,
      radius,
      strength
    ) {

      const width =
        random(
          12,
          radius * 1.25
        );


      const height =
        random(
          2,
          11
        );


      const sourceX =
        centerX +
        random(
          -radius,
          radius
        );


      const sourceY =
        centerY +
        random(
          -radius,
          radius
        );


      const displacement =
        random(
          -25,
          25
        ) *
        strength;


      ctx.globalAlpha =
        random(
          0.45,
          0.92
        );


      ctx.drawImage(

        feedbackCanvas,

        sourceX,
        sourceY,

        width,
        height,

        sourceX +
        displacement,

        sourceY +
        random(-3, 3),

        width *
        random(
          0.85,
          1.45
        ),

        height

      );


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       DATAMOSH SMEAR
       Stretches old image information across nearby pixels
    ========================================================= */

    function moshSmear(
      centerX,
      centerY,
      radius,
      strength
    ) {

      const sourceWidth =
        random(
          3,
          18
        );


      const sourceHeight =
        random(
          8,
          45
        );


      const sourceX =
        centerX +
        random(
          -radius,
          radius
        );


      const sourceY =
        centerY +
        random(
          -radius,
          radius
        );


      const destinationWidth =
        sourceWidth *
        random(
          1.2,
          4
        );


      ctx.globalAlpha =
        random(
          0.35,
          0.78
        );


      ctx.drawImage(

        feedbackCanvas,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        sourceX +
        random(
          -18,
          18
        ) *
        strength,

        sourceY +
        random(
          -7,
          7
        ),

        destinationWidth,
        sourceHeight

      );


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       MOTION ECHO
       Repeats fragments from previous frames
    ========================================================= */

    function motionEcho(
      centerX,
      centerY,
      radius,
      strength
    ) {

      const size =
        random(
          8,
          28
        );


      const sourceX =
        centerX +
        random(
          -radius,
          radius
        );


      const sourceY =
        centerY +
        random(
          -radius,
          radius
        );


      const repeats =
        Math.floor(
          random(
            2,
            5
          )
        );


      for (
        let i = 0;
        i < repeats;
        i++
      ) {

        ctx.globalAlpha =
          0.28 /
          (
            i + 1
          );


        ctx.drawImage(

          feedbackCanvas,

          sourceX,
          sourceY,

          size,
          size,

          sourceX +
          i *
          random(
            -8,
            8
          ) *
          strength,

          sourceY +
          i *
          random(
            -4,
            4
          ),

          size,
          size

        );

      }


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       CHROMA BLEED
       Creates subtle codec-like color separation
    ========================================================= */

    function chromaBleed(
      centerX,
      centerY,
      radius,
      strength
    ) {

      const width =
        random(
          8,
          35
        );


      const height =
        random(
          2,
          10
        );


      const x =
        centerX +
        random(
          -radius,
          radius
        );


      const y =
        centerY +
        random(
          -radius,
          radius
        );


      ctx.globalCompositeOperation =
        "screen";


      ctx.filter =
        "sepia(1) saturate(10) hue-rotate(155deg)";


      ctx.globalAlpha =
        random(
          0.15,
          0.38
        );


      ctx.drawImage(

        feedbackCanvas,

        x,
        y,

        width,
        height,

        x -
        random(
          2,
          10
        ) *
        strength,

        y,

        width,
        height

      );


      ctx.filter =
        "sepia(1) saturate(12) hue-rotate(290deg)";


      ctx.drawImage(

        feedbackCanvas,

        x,
        y,

        width,
        height,

        x +
        random(
          2,
          10
        ) *
        strength,

        y,

        width,
        height

      );


      ctx.filter =
        "none";


      ctx.globalCompositeOperation =
        "source-over";


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       RARE SHARP COLOR ARTIFACT
       Color appears only occasionally
       This prevents the image from becoming too graphic
    ========================================================= */

    function rareColorArtifact(
      centerX,
      centerY,
      radius
    ) {

      if (
        Math.random() > 0.14
      ) {
        return;
      }


      const x =
        centerX +
        random(
          -radius,
          radius
        );


      const y =
        centerY +
        random(
          -radius,
          radius
        );


      ctx.fillStyle =
        sharpColors[
          Math.floor(
            Math.random() *
            sharpColors.length
          )
        ];


      ctx.globalAlpha =
        random(
          0.2,
          0.48
        );


      ctx.fillRect(

        x,
        y,

        random(
          4,
          22
        ),

        random(
          1,
          5
        )

      );


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       LOCAL DATAMOSH GENERATOR
       Main mouse-controlled distortion
    ========================================================= */

    function createLocalMosh() {

      if (
        !mouseActive
      ) {
        return;
      }


      const speed =
        Math.min(
          mouseSpeed,
          25
        );


      const radius =
        Math.min(

          MAX_RADIUS,

          MIN_RADIUS +
          speed * 0.8

        );


      const strength =
        MOSH_STRENGTH +
        speed * 0.025 +
        audioLevel * 1.8;


      const fragmentCount =
        Math.floor(

          5 +

          Math.random() * 8 +

          speed * 0.15 +

          audioLevel * 10

        );


      for (
        let i = 0;
        i < fragmentCount;
        i++
      ) {

        const choice =
          Math.random();


        if (
          choice < 0.38
        ) {

          moshStrip(
            mouseX,
            mouseY,
            radius,
            strength
          );

        }

        else if (
          choice < 0.67
        ) {

          moshSmear(
            mouseX,
            mouseY,
            radius,
            strength
          );

        }

        else if (
          choice < 0.85
        ) {

          motionEcho(
            mouseX,
            mouseY,
            radius,
            strength
          );

        }

        else {

          chromaBleed(
            mouseX,
            mouseY,
            radius,
            strength
          );

        }


        rareColorArtifact(
          mouseX,
          mouseY,
          radius
        );

      }


      mouseSpeed *= 0.82;

    }


    /* =========================================================
       SOUND-REACTIVE MOSH
       Sound creates occasional small temporal ruptures
    ========================================================= */

    function createSoundMosh() {

      if (
        audioLevel < 0.06
      ) {
        return;
      }


      const probability =
        audioLevel * 0.22;


      if (
        Math.random() >
        probability
      ) {
        return;
      }


      const x =
        random(
          0,
          canvas.width
        );


      const y =
        random(
          0,
          canvas.height
        );


      const radius =
        random(
          18,
          45
        );


      const strength =
        1 +
        audioLevel * 2.5;


      const count =
        Math.floor(
          random(
            2,
            7
          )
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        if (
          Math.random() > 0.5
        ) {

          moshStrip(
            x,
            y,
            radius,
            strength
          );

        }

        else {

          moshSmear(
            x,
            y,
            radius,
            strength
          );

        }

      }

    }


    /* =========================================================
       CANVAS DECAY
       Old distortion slowly disappears
       instead of permanently covering the footage
    ========================================================= */

    function decayCanvas() {

      ctx.save();


      ctx.globalCompositeOperation =
        "destination-out";


      ctx.fillStyle =
        "rgba(0,0,0,0.065)";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.restore();

    }


    /* =========================================================
       FEEDBACK FRAME UPDATE
       Saves the current image plus part of the previous frame
       to create temporal corruption
    ========================================================= */

    function storeFeedbackFrame() {

      feedbackCtx.save();


      feedbackCtx.globalAlpha =
        0.90;


      feedbackCtx.drawImage(

        frameCanvas,

        0,
        0,

        feedbackCanvas.width,
        feedbackCanvas.height

      );


      feedbackCtx.restore();


      /* Add some existing glitch back into memory */

      feedbackCtx.save();


      feedbackCtx.globalAlpha =
        0.25;


      feedbackCtx.drawImage(

        canvas,

        0,
        0,

        feedbackCanvas.width,
        feedbackCanvas.height

      );


      feedbackCtx.restore();

    }


    /* =========================================================
       MAIN ANIMATION LOOP
    ========================================================= */

    function animate() {

      captureCurrentFrame();


      updateAudio();


      updateFeedback();


      decayCanvas();


      createLocalMosh();


      createSoundMosh();


      storeFeedbackFrame();


      requestAnimationFrame(
        animate
      );

    }


    /* =========================================================
       START DATAMOSH SYSTEM
    ========================================================= */

    animate();


  </script>

</body>

</html>
