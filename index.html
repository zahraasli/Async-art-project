<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      cursor: crosshair;
      font-family: Arial, Helvetica, sans-serif;
    }

    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      z-index: 1;
    }

    /*
      These media elements are sources for Hydra.
      They should not appear directly on the page.
    */

    #footage,
    #webcam,
    #analysisCanvas,
    #motionCanvas {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 160px;
      height: 90px;
      opacity: 0;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1000;

      padding: 10px 15px;

      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.52);
      color: white;

      font-size: 10px;
      letter-spacing: 1.5px;

      cursor: pointer;
    }

    #startButton:hover {
      background: rgba(255,255,255,0.12);
    }

    #startButton.active {
      opacity: 0.25;
    }

    #startButton.active:hover {
      opacity: 1;
    }

    #status {
      position: fixed;
      bottom: 16px;
      left: 18px;
      z-index: 1000;

      color: rgba(255,255,255,0.55);

      font-size: 9px;
      letter-spacing: 1.4px;

      pointer-events: none;
    }

  </style>
</head>


<body>


  <!-- ======================================================
       PRERECORDED FOOTAGE
  ======================================================= -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="./DSC_3062.mp4"
      type="video/mp4"
    >
  </video>


  <!-- ======================================================
       WEBCAM
  ======================================================= -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- ======================================================
       MOTION DETECTION
  ======================================================= -->

  <canvas
    id="analysisCanvas"
    width="160"
    height="90"
  ></canvas>

  <canvas
    id="motionCanvas"
    width="160"
    height="90"
  ></canvas>


  <!-- ======================================================
       HYDRA OUTPUT
  ======================================================= -->

  <canvas id="hydraCanvas"></canvas>


  <!-- ======================================================
       UI
  ======================================================= -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>

  <div id="status">
    LOADING FOOTAGE... | KEYS: 1 2 3 4 SPACE
  </div>


  <!-- ======================================================
       HYDRA
  ======================================================= -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* ======================================================
       ELEMENTS
    ======================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const analysisCanvas =
      document.getElementById("analysisCanvas");

    const motionCanvas =
      document.getElementById("motionCanvas");

    const startButton =
      document.getElementById("startButton");

    const statusText =
      document.getElementById("status");


    const analysisContext =
      analysisCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    const motionContext =
      motionCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    /* ======================================================
       STATE
    ======================================================= */

    let cameraActive = false;

    let hydraStarted = false;

    let analyser = null;

    let audioData = null;

    let audioLevel = 0;

    let audioPeak = 0;

    let motionLevel = 0;

    let motionPeak = 0;

    let previousFrame = null;

    let mouseX = 0.5;

    let mouseY = 0.5;

    let previousMouseX = 0.5;

    let previousMouseY = 0.5;

    let mouseEnergy = 0;

    // Keyboard-triggered glitch energies.
    let keyBurst = 0;
    let keySmear = 0;
    let keyFlash = 0;
    let keyFold = 0;
    let keyColor = 0;


    /* ======================================================
       SETTINGS
    ======================================================= */

    const AUDIO_SENSITIVITY = 22;

    const MOTION_GAIN = 13;

    const BODY_GLITCH = 0.62;

    const WEBCAM_AMOUNT = 0.27;

    const FEEDBACK_AMOUNT = 0.12;


    /* ======================================================
       HYDRA INSTANCE
    ======================================================= */

    let hydra;


    try {

      hydra =
        new Hydra({

          canvas: canvas,

          detectAudio: false,

          enableStreamCapture: false,

          makeGlobal: true

        });

    }

    catch(error) {

      console.error(
        "Hydra failed to initialize:",
        error
      );

      statusText.textContent =
        "HYDRA FAILED TO LOAD";

    }


    /* ======================================================
       RESIZE
    ======================================================= */

    function resizeHydra() {

      if (
        typeof setResolution !==
        "function"
      ) {

        return;

      }


      const ratio =
        Math.min(
          window.devicePixelRatio || 1,
          1.5
        );


      setResolution(

        Math.floor(
          window.innerWidth *
          ratio
        ),

        Math.floor(
          window.innerHeight *
          ratio
        )

      );

    }


    window.addEventListener(
      "resize",
      resizeHydra
    );


    setTimeout(
      resizeHydra,
      200
    );


    /* ======================================================
       START FOOTAGE
    ======================================================= */

    async function startFootage() {

      try {

        footage.muted = true;

        footage.loop = true;


        await footage.play();


        console.log(
          "Footage playing:",
          footage.videoWidth,
          footage.videoHeight
        );


        statusText.textContent =
          "FOOTAGE READY";


        /*
          s0 = DSC_3062.mp4
        */

        s0.init({
          src: footage
        });


        /*
          Before webcam is enabled,
          s1 also uses footage.

          Once camera starts,
          s1 becomes webcam.
        */

        s1.init({
          src: footage
        });


        /*
          s2 = motion-map canvas.
        */

        s2.init({
          src: motionCanvas
        });


        if (!hydraStarted) {

          startHydraPatch();

          hydraStarted = true;

        }

      }

      catch(error) {

        console.error(
          "Footage playback failed:",
          error
        );


        statusText.textContent =
          "CLICK ENABLE CAMERA + SOUND";

      }

    }


    /* ======================================================
       VIDEO EVENTS
    ======================================================= */

    footage.addEventListener(
      "loadeddata",
      () => {

        startFootage();

      },
      {
        once: true
      }
    );


    footage.addEventListener(
      "canplay",
      () => {

        if (!hydraStarted) {

          startFootage();

        }

      },
      {
        once: true
      }
    );


    footage.addEventListener(
      "error",
      event => {

        console.error(
          "VIDEO ERROR",
          event
        );


        statusText.textContent =
          "DSC_3062.mp4 NOT LOADING";

      }
    );


    if (
      footage.readyState >= 2
    ) {

      startFootage();

    }


    /* ======================================================
       MOUSE
    ======================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;


        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          previousMouseX;


        const dy =
          y -
          previousMouseY;


        const speed =
          Math.hypot(
            dx,
            dy
          );


        mouseEnergy =
          Math.min(
            1,
            mouseEnergy +
            speed * 9
          );


        mouseX = x;

        mouseY = y;


        previousMouseX = x;

        previousMouseY = y;

      }
    );



    /* ======================================================
       KEYBOARD INTERACTIONS

       1 = horizontal burst
       2 = temporal smear
       3 = chromatic flash
       4 = fold / wave displacement
       SPACE = combined impact
    ======================================================= */

    window.addEventListener(
      "keydown",
      event => {

        if (event.repeat) {
          return;
        }

        if (event.code === "Digit1") {
          keyBurst = 1;
          statusText.textContent = "KEY 1 — BURST";
        }

        if (event.code === "Digit2") {
          keySmear = 1;
          statusText.textContent = "KEY 2 — SMEAR";
        }

        if (event.code === "Digit3") {
          keyFlash = 1;
          statusText.textContent = "KEY 3 — COLOR FLASH";
        }

        if (event.code === "Digit4") {
          keyFold = 1;
          statusText.textContent = "KEY 4 — FOLD";
        }

        if (event.code === "Space") {
          event.preventDefault();
          keyBurst = 1;
          keySmear = 1;
          keyFlash = 1;
          keyFold = 1;
          keyColor = 1;
          statusText.textContent = "SPACE — FULL IMPACT";
        }

      }
    );


    /* ======================================================
       ENABLE CAMERA + MICROPHONE
    ======================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        /*
          Also make sure footage is playing.
        */

        try {

          await footage.play();

        }

        catch(error) {

          console.log(
            "Footage interaction playback:",
            error
          );

        }


        if (cameraActive) {

          return;

        }


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          startButton.textContent =
            "CAMERA NOT SUPPORTED";

          return;

        }


        try {

          statusText.textContent =
            "REQUESTING CAMERA...";


          const stream =
            await navigator.mediaDevices
              .getUserMedia({

                video: {

                  facingMode: "user",

                  width: {
                    ideal: 1280
                  },

                  height: {
                    ideal: 720
                  }

                },

                audio: {

                  echoCancellation: false,

                  noiseSuppression: false,

                  autoGainControl: true

                }

              });


          webcam.srcObject =
            stream;


          await webcam.play();


          /*
            s1 now becomes webcam.
          */

          s1.init({
            src: webcam
          });


          cameraActive = true;


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );


          statusText.textContent =
            "MOVE / SPEAK / INTERACT";


          /*
            AUDIO
          */

          try {

            const AudioContext =
              window.AudioContext ||
              window.webkitAudioContext;


            const audioContext =
              new AudioContext();


            await audioContext.resume();


            const microphone =
              audioContext
                .createMediaStreamSource(
                  stream
                );


            analyser =
              audioContext
                .createAnalyser();


            analyser.fftSize =
              512;


            analyser.smoothingTimeConstant =
              0.15;


            microphone.connect(
              analyser
            );


            audioData =
              new Uint8Array(
                analyser.fftSize
              );

          }

          catch(audioError) {

            console.log(
              "Audio unavailable:",
              audioError
            );

          }


          previousFrame = null;


          requestAnimationFrame(
            updateMotion
          );

        }

        catch(error) {

          console.error(
            "Camera / microphone error:",
            error
          );


          startButton.textContent =
            "CAMERA PERMISSION FAILED";


          statusText.textContent =
            "CHECK CAMERA PERMISSION";

        }

      }
    );


    /* ======================================================
       AUDIO ANALYSIS
    ======================================================= */

    function updateAudio() {

      if (
        analyser &&
        audioData
      ) {

        analyser.getByteTimeDomainData(
          audioData
        );


        let sum = 0;


        for (
          let i = 0;
          i < audioData.length;
          i++
        ) {

          const sample =
            (
              audioData[i] -
              128
            ) / 128;


          sum +=
            sample *
            sample;

        }


        const rms =
          Math.sqrt(
            sum /
            audioData.length
          );


        const target =
          Math.min(

            1,

            rms *
            AUDIO_SENSITIVITY

          );


        audioLevel =
          audioLevel * 0.65 +
          target * 0.35;


        audioPeak =
          Math.max(
            target,
            audioPeak * 0.84
          );

      }

      else {

        audioLevel *= 0.95;

        audioPeak *= 0.90;

      }


      mouseEnergy *= 0.91;

      keyBurst *= 0.91;
      keySmear *= 0.94;
      keyFlash *= 0.88;
      keyFold *= 0.92;
      keyColor *= 0.90;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* ======================================================
       WEBCAM MOTION DETECTION
    ======================================================= */

    function updateMotion() {

      if (!cameraActive) {

        return;

      }


      if (
        webcam.readyState < 2
      ) {

        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      const width =
        analysisCanvas.width;


      const height =
        analysisCanvas.height;


      /*
        Mirror webcam before analysis.
      */

      analysisContext.save();


      analysisContext.clearRect(
        0,
        0,
        width,
        height
      );


      analysisContext.translate(
        width,
        0
      );


      analysisContext.scale(
        -1,
        1
      );


      analysisContext.drawImage(
        webcam,
        0,
        0,
        width,
        height
      );


      analysisContext.restore();


      let frame;


      try {

        frame =
          analysisContext
            .getImageData(
              0,
              0,
              width,
              height
            );

      }

      catch(error) {

        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      if (!previousFrame) {

        previousFrame =
          new Uint8ClampedArray(
            frame.data
          );


        requestAnimationFrame(
          updateMotion
        );


        return;

      }


      const output =
        motionContext
          .createImageData(
            width,
            height
          );


      let totalMovement = 0;


      for (
        let i = 0;
        i < frame.data.length;
        i += 4
      ) {

        const current =
          (
            frame.data[i] +
            frame.data[i + 1] +
            frame.data[i + 2]
          ) / 3;


        const old =
          (
            previousFrame[i] +
            previousFrame[i + 1] +
            previousFrame[i + 2]
          ) / 3;


        let difference =
          Math.abs(
            current -
            old
          );


        /*
          Suppress normal webcam sensor noise.
        */

        difference =
          Math.max(
            0,
            difference - 10
          );


        difference =
          Math.min(
            255,
            difference *
            MOTION_GAIN
          );


        /*
          Higher contrast movement map.
        */

        const normalized =
          difference /
          255;


        const shaped =
          Math.pow(
            normalized,
            0.65
          );


        const value =
          Math.floor(
            shaped *
            255
          );


        output.data[i] =
          value;


        output.data[i + 1] =
          value;


        output.data[i + 2] =
          value;


        output.data[i + 3] =
          255;


        totalMovement +=
          value;

      }


      motionContext.putImageData(
        output,
        0,
        0
      );


      const average =
        totalMovement /
        (
          width *
          height *
          255
        );


      const measured =
        Math.min(
          1,
          average * 8
        );


      motionLevel =
        motionLevel * 0.72 +
        measured * 0.28;


      motionPeak =
        Math.max(
          measured,
          motionPeak * 0.84
        );


      previousFrame.set(
        frame.data
      );


      requestAnimationFrame(
        updateMotion
      );

    }


    /* ======================================================
       HYDRA PATCH
    ======================================================= */




    function startHydraPatch() {

      try {

        /*
          ----------------------------------------------------
          o1 = AGGRESSIVE ORGANIC MOTION MAP

          Camera motion becomes a torn, unstable deformation field.
          Still no square/checkerboard geometry.
          ----------------------------------------------------
        */

        src(s2)

          .contrast(5.4)

          .posterize(11, 0.72)

          .scale(
            () =>
              1.015 +
              motionLevel * 0.05 +
              keyFold * 0.05
          )

          .rotate(
            () =>
              Math.sin(time * 0.22) *
              (
                0.018 +
                motionPeak * 0.07 +
                keyFold * 0.09
              )
          )

          .scrollX(
            () =>
              Math.sin(time * 0.56) *
              (
                0.014 +
                motionPeak * 0.05
              )
          )

          .scrollY(
            () =>
              Math.cos(time * 0.41) *
              (
                0.010 +
                motionPeak * 0.035
              )
          )

          .modulate(
            osc(3.2, 0.022, 0)
              .rotate(0.24)
              .scrollX(() => Math.sin(time * 0.31) * 0.07),
            () =>
              0.028 +
              motionPeak * 0.11 +
              keyFold * 0.15
          )

          .out(o1);



        /*
          ----------------------------------------------------
          o2 = MULTI-SCALE IRREGULAR TEARING

          Thin + medium horizontal tears overlap at different rates.
          ----------------------------------------------------
        */

        osc(
          18,
          0.028,
          0
        )

          .rotate(Math.PI / 2)

          .thresh(
            0.66,
            0.028
          )

          .scrollY(
            () =>
              Math.sin(time * 1.17) * 0.18 +
              Math.sin(time * 0.27) * 0.07 +
              keyBurst * 0.13
          )

          .modulate(
            osc(4.3, 0.019, 0)
              .rotate(0.16)
              .scrollX(() => Math.sin(time * 0.49) * 0.08),
            () =>
              0.06 +
              motionPeak * 0.08 +
              keyBurst * 0.16
          )

          .out(o2);



        /*
          ----------------------------------------------------
          MAIN FOOTAGE

          Brighter, readable, but visibly glitched at all times.
          ----------------------------------------------------
        */

        src(s0)

          .scale(1.006)

          .brightness(
            () =>
              0.13 +
              audioLevel * 0.04
          )

          .saturate(
            () =>
              1.42 +
              audioLevel * 0.80 +
              keyColor * 1.0
          )

          .contrast(
            () =>
              1.11 +
              audioPeak * 0.16 +
              keyFlash * 0.20
          )


          /*
            CAMERA MOTION STRONGLY DEFORMS FOOTAGE
          */

          .modulate(

            src(o1),

            () => {

              if (!cameraActive) {
                return 0.025;
              }

              return (
                0.035 +
                motionLevel * BODY_GLITCH +
                motionPeak * 0.31 +
                audioPeak * 0.08 +
                keyFold * 0.28
              );

            }

          )


          /*
            LARGE POSITIVE TEAR
          */

          .blend(

            src(s0)

              .brightness(0.10)

              .scrollX(
                () =>
                  0.010 +
                  motionPeak * 0.105 +
                  audioPeak * 0.045 +
                  keyBurst * 0.24
              )

              .scrollY(
                () =>
                  Math.sin(time * 0.51) *
                  (
                    0.006 +
                    motionPeak * 0.018 +
                    keyBurst * 0.035
                  )
              )

              .mask(src(o2)),

            () =>
              0.10 +
              motionPeak * 0.36 +
              audioPeak * 0.14 +
              keyBurst * 0.42

          )


          /*
            LARGE NEGATIVE TEAR
          */

          .blend(

            src(s0)

              .brightness(0.10)

              .scrollX(
                () =>
                  -0.010 -
                  motionPeak * 0.09 -
                  audioPeak * 0.04 -
                  keyBurst * 0.19
              )

              .scrollY(
                () =>
                  Math.cos(time * 0.38) *
                  (
                    0.005 +
                    motionPeak * 0.014
                  )
              )

              .mask(
                src(o2)
                  .invert()
                  .scrollY(0.043)
              ),

            () =>
              0.085 +
              motionPeak * 0.31 +
              audioPeak * 0.10 +
              keyBurst * 0.31

          )


          /*
            MAGENTA / HOT RED SPLIT
          */

          .add(

            src(s0)

              .scrollX(
                () =>
                  0.018 +
                  motionPeak * 0.075 +
                  audioPeak * 0.045 +
                  keyFlash * 0.10
              )

              .color(
                1.95,
                0.0,
                0.92
              )

              .saturate(2.8)

              .contrast(1.72)

              .mask(
                src(o2)
                  .scrollY(0.014)
              ),

            () =>
              0.10 +
              motionPeak * 0.28 +
              audioPeak * 0.16 +
              keyFlash * 0.38

          )


          /*
            CYAN / ELECTRIC BLUE SPLIT
          */

          .add(

            src(s0)

              .scrollX(
                () =>
                  -0.020 -
                  motionPeak * 0.070 -
                  audioPeak * 0.042 -
                  keyFlash * 0.095
              )

              .color(
                0.0,
                1.55,
                2.10
              )

              .saturate(2.7)

              .contrast(1.75)

              .mask(
                src(o2)
                  .invert()
                  .scrollY(-0.026)
              ),

            () =>
              0.095 +
              motionPeak * 0.27 +
              audioPeak * 0.15 +
              keyFlash * 0.36

          )


          /*
            ACID GREEN FLASHES
          */

          .add(

            src(s0)

              .scrollX(
                () =>
                  Math.sin(time * 2.1) *
                  (
                    0.010 +
                    motionPeak * 0.032 +
                    keyColor * 0.055
                  )
              )

              .color(
                0.38,
                1.90,
                0.0
              )

              .saturate(2.8)

              .contrast(1.76)

              .mask(
                src(o2)
                  .scrollY(0.078)
              ),

            () =>
              0.035 +
              motionPeak * 0.12 +
              audioPeak * 0.07 +
              keyColor * 0.25

          )


          /*
            WEBCAM + FOOTAGE FUSION

            Stronger overlap. Motion in camera visibly drags
            both camera and prerecorded footage into each other.
          */

          .blend(

            src(s1)

              .brightness(0.11)

              .saturate(
                () =>
                  1.55 +
                  audioLevel * 0.9 +
                  keyColor * 0.9
              )

              .contrast(1.48)

              .colorama(
                () =>
                  0.012 +
                  motionPeak * 0.03 +
                  audioPeak * 0.03 +
                  keyFlash * 0.06
              )

              .modulate(
                src(o1),
                () =>
                  0.035 +
                  motionPeak * 0.18 +
                  keyFold * 0.20
              )

              .mask(
                src(o1)
                  .contrast(3.0)
              )

              .scrollX(
                () =>
                  Math.sin(time * 1.92) *
                  (
                    motionPeak * 0.075 +
                    keySmear * 0.085
                  )
              )

              .scrollY(
                () =>
                  Math.cos(time * 1.18) *
                  (
                    motionPeak * 0.025 +
                    keySmear * 0.035
                  )
              ),

            () => {

              if (!cameraActive) {
                return 0;
              }

              return (
                WEBCAM_AMOUNT +
                motionLevel * 0.40 +
                motionPeak * 0.18 +
                keySmear * 0.22
              );

            }

          )


          /*
            STRONGER DATAMOSH / TEMPORAL SMEAR
          */

          .blend(

            src(o0)

              .scale(
                () =>
                  1.0015 +
                  motionLevel * 0.010 +
                  keySmear * 0.030
              )

              .scrollX(
                () =>
                  Math.sin(time * 0.61) *
                  (
                    motionLevel * 0.045 +
                    keySmear * 0.12
                  )
              )

              .scrollY(
                () =>
                  Math.cos(time * 0.42) *
                  (
                    motionLevel * 0.014 +
                    keySmear * 0.030
                  )
              )

              .colorama(
                () =>
                  0.004 +
                  motionPeak * 0.012 +
                  keySmear * 0.045
              ),

            () =>
              FEEDBACK_AMOUNT +
              motionLevel * 0.19 +
              audioPeak * 0.07 +
              keySmear * 0.38

          )


          /*
            EXTRA NON-SQUARE WAVE BREAK
          */

          .modulate(
            osc(
              4.1,
              0.023,
              0
            )
              .rotate(0.41)
              .scrollY(() => Math.sin(time * 0.56) * 0.11),
            () =>
              motionPeak * 0.045 +
              audioPeak * 0.018 +
              keyFold * 0.19
          )

          .out(o0);



        /*
          ----------------------------------------------------
          o3 = IRREGULAR MOUSE FIELD

          Soft circular zone broken by thin moving bands.
          ----------------------------------------------------
        */

        shape(
          96,
          () =>
            0.032 +
            mouseEnergy * 0.060,
          0.46
        )

          .scrollX(
            () =>
              mouseX - 0.5
          )

          .scrollY(
            () =>
              0.5 - mouseY
          )

          .modulate(
            osc(3.6, 0.024, 0)
              .rotate(0.31)
              .scrollX(() => Math.sin(time * 0.53) * 0.06),
            () =>
              0.035 +
              mouseEnergy * 0.085
          )

          .mult(
            osc(
              23,
              0.038,
              0
            )
              .rotate(Math.PI / 2)
              .thresh(
                0.50,
                0.12
              )
              .scrollY(
                () =>
                  Math.sin(time * 1.44) * 0.12
              )
          )

          .out(o3);



        /*
          ----------------------------------------------------
          FINAL OUTPUT
          ----------------------------------------------------
        */

        src(o0)

          .blend(

            src(o0)

              .scrollX(
                () =>
                  mouseEnergy *
                  (
                    0.038 +
                    Math.sin(time * 5.1) * 0.028
                  )
              )

              .scrollY(
                () =>
                  mouseEnergy *
                  Math.sin(time * 2.7) *
                  0.010
              )

              .colorama(
                () =>
                  mouseEnergy * 0.032
              )

              .mask(src(o3)),

            () =>
              mouseEnergy * 0.44

          )

          .brightness(
            () =>
              keyFlash * 0.07
          )

          .out(o3);


        render(o3);


        statusText.textContent =
          "MOVE / SPEAK / KEYS 1 2 3 4 SPACE";

      }

      catch(error) {

        console.error(
          "Hydra patch error:",
          error
        );

        try {

          src(s0)
            .brightness(0.13)
            .out(o0);

          render(o0);

          statusText.textContent =
            "FOOTAGE FALLBACK MODE";

        }

        catch(fallbackError) {

          console.error(
            "Hydra fallback failed:",
            fallbackError
          );

          statusText.textContent =
            "HYDRA ERROR";

        }

      }

    }


    /* ======================================================
       SAFARI AUTOPLAY FALLBACK
    ======================================================= */

    document.addEventListener(
      "click",
      async () => {

        if (
          footage.paused
        ) {

          try {

            await footage.play();

          }

          catch(error) {

            console.log(
              "Safari playback:",
              error
            );

          }

        }

      },
      {
        once: true
      }
    );


  </script>
