<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
    }

    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #footage,
    #webcam {
      position: fixed;
      top: 0;
      left: 0;

      width: 2px;
      height: 2px;

      opacity: 0.001;

      pointer-events: none;
    }

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 100;

      padding: 9px 14px;

      border: 1px solid rgba(255,255,255,0.75);

      background: rgba(0,0,0,0.42);

      color: white;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      letter-spacing: 1.5px;

      cursor: pointer;
    }

    #startButton.active {
      opacity: 0.18;
    }

    #startButton:hover {
      opacity: 1;
    }

  </style>
</head>


<body>


  <!-- YOUR FOOTAGE -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
  >
    <source
      src="./footage.mp4"
      type="video/mp4"
    >
  </video>


  <!-- LIVE WEBCAM -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- CAMERA + MICROPHONE -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- HYDRA OUTPUT -->

  <canvas id="hydraCanvas"></canvas>


  <!-- HYDRA -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* =========================================================
       HTML ELEMENTS
    ========================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       INTERACTION VALUES
    ========================================================= */

    let audioLevel = 0;

    let audioPeak = 0;

    let mouseX = 0.5;

    let mouseY = 0.5;

    let mouseEnergy = 0;

    let lastMouseX = 0.5;

    let lastMouseY = 0.5;


    /* =========================================================
       AUDIO
    ========================================================= */

    let analyser = null;

    let audioData = null;


    /* =========================================================
       STATES
    ========================================================= */

    let hydraPatchStarted = false;

    let cameraActive = false;


    /* =========================================================
       VISUAL SETTINGS
    ========================================================= */

    const AUDIO_SENSITIVITY = 18;

    const CAMERA_PRESENCE = 0.52;

    const CAMERA_WARP = 0.16;

    const FEEDBACK_AMOUNT = 0.72;

    const COLOR_AMOUNT = 0.018;

    const MOUSE_EFFECT = 0.045;


    /* =========================================================
       HYDRA
    ========================================================= */

    const hydra = new Hydra({

      canvas: canvas,

      detectAudio: false,

      enableStreamCapture: false,

      makeGlobal: true

    });


    /* =========================================================
       RESIZE
    ========================================================= */

    function resizeHydra() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

      if (
        typeof setResolution === "function"
      ) {

        setResolution(
          window.innerWidth,
          window.innerHeight
        );

      }

    }


    resizeHydra();


    window.addEventListener(
      "resize",
      resizeHydra
    );


    /* =========================================================
       START FOOTAGE
    ========================================================= */

    async function initializeFootage() {

      try {

        footage.muted = true;

        footage.loop = true;

        await footage.play();

      }

      catch(error) {

        console.log(
          "Footage autoplay waiting for interaction:",
          error
        );

      }


      /*
        s0 = background footage
      */

      s0.init({
        src: footage
      });


      /*
        IMPORTANT

        Before webcam is active,
        use the footage itself as s1.

        This prevents Hydra from breaking
        because s1 has no source.
      */

      s1.init({
        src: footage
      });


      if (!hydraPatchStarted) {

        startHydraPatch();

        hydraPatchStarted = true;

      }

    }


    footage.addEventListener(
      "loadeddata",
      initializeFootage,
      { once: true }
    );


    /*
      In case video is already cached
      before the event listener is attached.
    */

    if (footage.readyState >= 2) {

      initializeFootage();

    }


    /* =========================================================
       MOUSE
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;


        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          lastMouseX;


        const dy =
          y -
          lastMouseY;


        mouseEnergy =
          Math.min(
            1,
            Math.hypot(
              dx,
              dy
            ) * 18
          );


        mouseX = x;

        mouseY = y;


        lastMouseX = x;

        lastMouseY = y;

      }
    );


    /* =========================================================
       CAMERA + MICROPHONE
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        if (cameraActive) {
          return;
        }


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }

            });


          /* =====================================================
             WEBCAM
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          /*
            s1 changes from footage fallback
            to LIVE CAMERA
          */

          s1.init({
            src: webcam
          });


          cameraActive = true;


          /* =====================================================
             MICROPHONE
          ===================================================== */

          try {

            const AudioContext =
              window.AudioContext ||
              window.webkitAudioContext;


            const audioContext =
              new AudioContext();


            await audioContext.resume();


            const microphone =
              audioContext.createMediaStreamSource(
                stream
              );


            analyser =
              audioContext.createAnalyser();


            analyser.fftSize =
              512;


            analyser.smoothingTimeConstant =
              0.12;


            microphone.connect(
              analyser
            );


            audioData =
              new Uint8Array(
                analyser.fftSize
              );

          }

          catch(audioError) {

            console.log(
              "Microphone analyser failed:",
              audioError
            );

          }


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }


        catch(error) {

          console.error(
            "Camera / microphone error:",
            error
          );


          /*
            IMPORTANT:
            Artwork continues even if camera fails.
          */

          startButton.textContent =
            "CAMERA / SOUND FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *= 0.86;

        audioPeak *= 0.80;

        mouseEnergy *= 0.88;


        requestAnimationFrame(
          updateAudio
        );


        return;

      }


      analyser.getByteTimeDomainData(
        audioData
      );


      let sum = 0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        const value =
          (
            audioData[i] -
            128
          ) / 128;


        sum +=
          value *
          value;

      }


      const rms =
        Math.sqrt(
          sum /
          audioData.length
        );


      const target =
        Math.min(
          1,
          rms *
          AUDIO_SENSITIVITY
        );


      audioLevel =
        audioLevel *
        0.26 +
        target *
        0.74;


      audioPeak =
        Math.max(
          target,
          audioPeak *
          0.76
        );


      mouseEnergy *=
        0.88;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       MAIN HYDRA PATCH
    ========================================================= */

    function startHydraPatch() {


      /* =====================================================
         CAMERA / GHOST SOURCE
      ===================================================== */

      src(s1)

        .scale(
          () =>
            1.015 +
            audioLevel * 0.035
        )

        .modulate(

          noise(
            2.2,
            0.045
          )

            .rotate(
              () =>
                time * 0.025
            )

            .scale(
              1.25
            ),

          () =>
            0.055 +
            audioLevel * 0.17
        )

        .modulateHue(

          noise(
            1.6,
            0.025
          )

            .colorama(
              0.3
            ),

          () =>
            0.8 +
            audioLevel * 2.8
        )

        .colorama(

          () =>
            0.012 +
            audioLevel * 0.08
        )

        .saturate(

          () =>
            3.8 +
            audioLevel * 5
        )

        .contrast(

          () =>
            1.15 +
            audioLevel * 0.7
        )

        .posterize(
          12,
          0.75
        )


        /* ===================================================
           CAMERA FEEDBACK
        =================================================== */

        .blend(

          src(o1)

            .scale(

              () =>
                1.006 +
                audioLevel * 0.018
            )

            .rotate(

              () =>
                Math.sin(time * 0.12) *
                0.006
            )

            .scrollX(

              () =>
                Math.sin(time * 0.21) *
                0.004
            )

            .scrollY(

              () =>
                Math.cos(time * 0.17) *
                0.004
            )

            .modulate(

              noise(
                1.4,
                0.02
              ),

              () =>
                0.015 +
                audioPeak * 0.065
            ),

          () =>
            0.52 +
            audioLevel * 0.22
        )

        .out(o1);



      /* =====================================================
         FOOTAGE BASE
      ===================================================== */

      src(s0)

        .saturate(
          2.4
        )

        .contrast(
          1.12
        )

        .colorama(
          0.006
        )


        /* ===================================================
           CAMERA WARPS FOOTAGE
        =================================================== */

        .modulate(

          src(o1)

            .saturate(
              0
            )

            .contrast(
              1.65
            ),

          () =>
            CAMERA_WARP +
            audioLevel * 0.22
        )


        /* ===================================================
           ORGANIC DISTORTION
        =================================================== */

        .modulate(

          noise(

            2.1,

            () =>
              0.018 +
              audioLevel * 0.05
          )

            .scale(
              1.5
            )

            .rotate(
              () =>
                time * 0.015
            ),

          () =>
            0.018 +
            audioLevel * 0.075
        )


        /* ===================================================
           CAMERA + FOOTAGE MERGE
        =================================================== */

        .blend(

          src(o1)

            .colorama(

              () =>
                0.02 +
                Math.sin(
                  time * 0.13
                ) *
                0.015
            )

            .saturate(

              () =>
                4 +
                audioLevel * 5
            )

            .modulate(

              src(s0)

                .saturate(
                  0
                )

                .contrast(
                  1.4
                ),

              0.05
            ),

          () => {

            /*
              Before webcam activation,
              keep ghost contribution lower.

              When webcam is active,
              merge it strongly with footage.
            */

            if (cameraActive) {

              return (
                CAMERA_PRESENCE +
                audioLevel * 0.18
              );

            }

            return 0.12;

          }

        )


        /* ===================================================
           FULL-SCENE FEEDBACK
        =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.003 +
                audioLevel * 0.014
            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.08
                ) *
                0.004
            )

            .modulate(

              noise(
                1.3,
                0.015
              ),

              () =>
                0.012 +
                audioLevel * 0.07
            )

            .colorama(

              () =>
                COLOR_AMOUNT +
                audioLevel * 0.04
            )

            .saturate(

              () =>
                1.8 +
                audioLevel * 3.2
            ),

          () =>
            FEEDBACK_AMOUNT +
            audioLevel * 0.12
        )


        /* ===================================================
           RED CHROMATIC BLEED
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                0.002 +
                audioPeak * 0.018
            )

            .color(
              1.35,
              0.08,
              0.25
            ),

          () =>
            0.08 +
            audioPeak * 0.16
        )


        /* ===================================================
           CYAN CHROMATIC BLEED
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                -0.003 -
                audioPeak * 0.015
            )

            .color(
              0.05,
              0.9,
              1.4
            ),

          () =>
            0.07 +
            audioPeak * 0.15
        )


        /* ===================================================
           PSYCHEDELIC COLOR
        =================================================== */

        .colorama(

          () =>
            0.008 +
            audioLevel * 0.045 +
            Math.sin(
              time * 0.1
            ) *
            0.006
        )

        .saturate(

          () =>
            2.8 +
            audioLevel * 4.5
        )

        .contrast(

          () =>
            1.08 +
            audioPeak * 0.3
        )

        .brightness(

          () =>
            0.02 +
            audioPeak * 0.08
        )

        .out(o0);



      /* =====================================================
         LOCAL MOUSE DISTURBANCE
      ===================================================== */

      noise(
        6,
        0.12
      )

        .mask(

          shape(
            80,

            () =>
              0.045 +
              mouseEnergy *
              MOUSE_EFFECT,

            0.25
          )

            .scrollX(

              () =>
                mouseX -
                0.5
            )

            .scrollY(

              () =>
                mouseY -
                0.5
            )

        )

        .contrast(
          2
        )

        .out(o2);



      /* =====================================================
         FINAL MOUSE MODULATION
      ===================================================== */

      src(o0)

        .modulate(

          src(o2),

          () =>
            mouseEnergy *
            0.09
        )

        .out(o3);



      /* =====================================================
         FINAL OUTPUT
      ===================================================== */

      render(o3);

    }


    /* =========================================================
       SAFARI / MOBILE FALLBACK

       Clicking anywhere can help autoplay footage if browser
       initially blocked it.
    ========================================================= */

    document.addEventListener(
      "click",
      async () => {

        if (footage.paused) {

          try {

            await footage.play();

          }

          catch(error) {

            console.log(
              "Footage play failed:",
              error
            );

          }

        }

      },
      { once: true }
    );


  </script>

</body>

</html>
