<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >
    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    />
  </video>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // این canvas مخفی فقط برای گرفتن frame ویدیو استفاده می‌شود
    const buffer = document.createElement("canvas");
    const bctx = buffer.getContext("2d");

    let lastX = 0;
    let lastY = 0;

    document.addEventListener("mousemove", (e) => {
      if (video.readyState < 2) return;

      const x = e.clientX;
      const y = e.clientY;

      const speed = Math.hypot(x - lastX, y - lastY);

      lastX = x;
      lastY = y;

      createGlitch(x, y, speed);
    });

    function createGlitch(x, y, speed) {
      buffer.width = canvas.width;
      buffer.height = canvas.height;

      // frame فعلی ویدیو را داخل buffer می‌کشیم
      bctx.drawImage(
        video,
        0,
        0,
        buffer.width,
        buffer.height
      );

      const size = Math.min(
        260,
        Math.max(80, 90 + speed * 2)
      );

      const slices = 10;

      for (let i = 0; i < slices; i++) {
        const sliceHeight = size / slices;

        const sx = x - size / 2;
        const sy = y - size / 2 + i * sliceHeight;

        const shift =
          (Math.random() - 0.5) *
          (20 + speed * 2);

        const redShift = shift + Math.random() * 15;
        const blueShift = shift - Math.random() * 15;

        ctx.globalAlpha = 0.45;

        // red-ish displacement
        ctx.drawImage(
          buffer,
          sx,
          sy,
          size,
          sliceHeight,
          sx + redShift,
          sy,
          size,
          sliceHeight
        );

        // second displaced layer
        ctx.globalAlpha = 0.3;

        ctx.drawImage(
          buffer,
          sx,
          sy,
          size,
          sliceHeight,
          sx + blueShift,
          sy + Math.random() * 5,
          size,
          sliceHeight
        );

        // random horizontal cut
        if (Math.random() > 0.5) {
          ctx.globalAlpha = 0.7;

          ctx.drawImage(
            buffer,
            sx,
            sy,
            size,
            sliceHeight,
            sx + shift * 2,
            sy,
            size,
            sliceHeight
          );
        }
      }

      ctx.globalAlpha = 1;
    }
  </script>

</body>
</html>
