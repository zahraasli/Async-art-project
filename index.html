<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    body {
      cursor: crosshair;
    }

    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }

    /*
      Hidden media sources.
      They still feed Hydra but are not shown directly.
    */
    #footage,
    #webcam,
    #motionCanvas,
    #analysisCanvas {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 160px;
      height: 90px;
      opacity: 0;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1000;

      padding: 10px 15px;

      border: 1px solid rgba(255,255,255,0.65);
      background: rgba(0,0,0,0.45);
      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.6px;

      cursor: pointer;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        opacity 0.25s ease,
        background 0.25s ease;
    }

    #startButton:hover {
      background: rgba(255,255,255,0.10);
    }

    #startButton.active {
      opacity: 0.18;
    }

    #startButton.active:hover {
      opacity: 1;
    }

    #status {
      position: fixed;
      left: 18px;
      bottom: 16px;
      z-index: 100;

      color: rgba(255,255,255,0.45);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 1.4px;

      pointer-events: none;
      user-select: none;
    }
  </style>
</head>


<body>

  <!-- =========================================================
       YOUR VIDEO FOOTAGE
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="./DSC_3062.mp4"
      type="video/mp4"
    >
  </video>


  <!-- =========================================================
       WEBCAM
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       MOTION ANALYSIS CANVASES
  ========================================================== -->

  <canvas
    id="analysisCanvas"
    width="160"
    height="90"
  ></canvas>

  <canvas
    id="motionCanvas"
    width="160"
    height="90"
  ></canvas>


  <!-- =========================================================
       CONTROLS
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>

  <div id="status">
    FOOTAGE MODE
  </div>


  <!-- =========================================================
       HYDRA OUTPUT
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       HYDRA LIBRARY
  ========================================================== -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const analysisCanvas =
      document.getElementById("analysisCanvas");

    const motionCanvas =
      document.getElementById("motionCanvas");

    const analysisContext =
      analysisCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );

    const motionContext =
      motionCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );

    const startButton =
      document.getElementById("startButton");

    const statusText =
      document.getElementById("status");


    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let cameraActive = false;
    let hydraStarted = false;

    let audioLevel = 0;
    let audioPeak = 0;

    let motionLevel = 0;
    let motionPeak = 0;

    let mouseX = 0.5;
    let mouseY = 0.5;

    let previousMouseX = 0.5;
    let previousMouseY = 0.5;

    let mouseEnergy = 0;

    let previousFrame = null;

    let analyser = null;
    let audioData = null;


    /* =========================================================
       PARAMETERS
    ========================================================= */

    /*
      Higher = microphone reacts more strongly.
    */
    const AUDIO_SENSITIVITY = 16;


    /*
      Motion difference amplification.
      Increase if body movement feels too weak.
    */
    const MOTION_GAIN = 7.5;


    /*
      Webcam itself stays subtle.

      Webcam is primarily used to disturb the footage,
      not to cover it.
    */
    const WEBCAM_VISIBILITY = 0.12;


    /*
      How strongly body movement distorts the footage.
    */
    const BODY_DISTORTION = 0.22;


    /*
      Feedback is intentionally moderate.
      This keeps the original footage visible.
    */
    const FEEDBACK_BASE = 0.11;


    /*
      Mouse effect remains local.
    */
    const MOUSE_DISTORTION = 0.20;


    /* =========================================================
       HYDRA
    ========================================================= */

    const hydra =
      new Hydra({

        canvas: canvas,

        detectAudio: false,

        enableStreamCapture: false,

        makeGlobal: true

      });


    /* =========================================================
       RESIZE
    ========================================================= */

    function resizeHydra() {

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          1.5
        );

      const width =
        Math.floor(
          window.innerWidth *
          pixelRatio
        );

      const height =
        Math.floor(
          window.innerHeight *
          pixelRatio
        );

      if (
        typeof setResolution ===
        "function"
      ) {

        setResolution(
          width,
          height
        );

      }

    }


    resizeHydra();


    window.addEventListener(
      "resize",
      resizeHydra
    );


    /* =========================================================
       FOOTAGE
    ========================================================= */

    async function initializeFootage() {

      try {

        footage.muted = true;
        footage.loop = true;

        await footage.play();

      }

      catch(error) {

        console.log(
          "Waiting for user interaction before video playback.",
          error
        );

      }


      /*
        s0 = prerecorded footage
      */

      s0.init({
        src: footage
      });


      /*
        Before webcam permission,
        s1 temporarily receives the footage.
      */

      s1.init({
        src: footage
      });


      /*
        s2 = live motion map canvas
      */

      s2.init({
        src: motionCanvas
      });


      if (!hydraStarted) {

        createHydraPatch();

        hydraStarted = true;

      }

    }


    footage.addEventListener(
      "loadeddata",
      initializeFootage,
      {
        once: true
      }
    );


    if (
      footage.readyState >= 2
    ) {

      initializeFootage();

    }


    footage.addEventListener(
      "error",
      () => {

        console.error(
          "DSC_3062.mp4 could not be loaded."
        );

        startButton.textContent =
          "FOOTAGE NOT FOUND";

        statusText.textContent =
          "CHECK DSC_3062.mp4";

      }
    );


    /* =========================================================
       MOUSE TRACKING
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;

        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          previousMouseX;

        const dy =
          y -
          previousMouseY;


        const velocity =
          Math.hypot(
            dx,
            dy
          );


        /*
          Fast mouse movement creates energy.
        */

        mouseEnergy =
          Math.min(
            1,
            mouseEnergy +
            velocity * 7
          );


        mouseX = x;
        mouseY = y;

        previousMouseX = x;
        previousMouseY = y;

      }
    );


    /* =========================================================
       CAMERA + MICROPHONE
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        if (cameraActive) {

          return;

        }


        try {

          await footage.play();

        }

        catch(error) {

          console.log(
            "Footage play error:",
            error
          );

        }


        try {

          const stream =
            await navigator.mediaDevices
              .getUserMedia({

                video: {

                  facingMode: "user",

                  width: {
                    ideal: 1280
                  },

                  height: {
                    ideal: 720
                  }

                },

                audio: {

                  echoCancellation: false,

                  noiseSuppression: false,

                  autoGainControl: true

                }

              });


          webcam.srcObject =
            stream;


          await webcam.play();


          /*
            s1 = live webcam
          */

          s1.init({
            src: webcam
          });


          cameraActive = true;


          /*
            AUDIO
          */

          try {

            const AudioContext =
              window.AudioContext ||
              window.webkitAudioContext;


            const audioContext =
              new AudioContext();


            await audioContext.resume();


            const microphone =
              audioContext
                .createMediaStreamSource(
                  stream
                );


            analyser =
              audioContext
                .createAnalyser();


            analyser.fftSize =
              512;


            analyser.smoothingTimeConstant =
              0.18;


            microphone.connect(
              analyser
            );


            audioData =
              new Uint8Array(
                analyser.fftSize
              );

          }

          catch(audioError) {

            console.log(
              "Audio analyser failed:",
              audioError
            );

          }


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );


          statusText.textContent =
            "BODY / SOUND / MOUSE ACTIVE";


          /*
            Start motion detection only
            after webcam permission.
          */

          requestAnimationFrame(
            updateMotion
          );

        }

        catch(error) {

          console.error(
            "Camera / microphone failed:",
            error
          );


          startButton.textContent =
            "CAMERA / SOUND FAILED";


          statusText.textContent =
            "PERMISSION REQUIRED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
    ========================================================= */

    function updateAudio() {

      if (
        analyser &&
        audioData
      ) {

        analyser.getByteTimeDomainData(
          audioData
        );


        let sum = 0;


        for (
          let i = 0;
          i < audioData.length;
          i++
        ) {

          const sample =
            (
              audioData[i] -
              128
            ) / 128;


          sum +=
            sample *
            sample;

        }


        const rms =
          Math.sqrt(
            sum /
            audioData.length
          );


        const target =
          Math.min(
            1,
            rms *
            AUDIO_SENSITIVITY
          );


        /*
          Responsive attack,
          slower release.
        */

        audioLevel =
          audioLevel * 0.68 +
          target * 0.32;


        audioPeak =
          Math.max(
            target,
            audioPeak * 0.86
          );

      }

      else {

        audioLevel *= 0.94;
        audioPeak *= 0.90;

      }


      mouseEnergy *= 0.91;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       MOTION DETECTION

       This is important.

       Instead of simply displaying the webcam,
       we compare consecutive webcam frames.

       Bright pixels in motionCanvas mean:
       "something moved here."

       Hydra then uses that image as a displacement map.
    ========================================================= */

    function updateMotion() {

      if (
        !cameraActive ||
        webcam.readyState < 2
      ) {

        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      const width =
        analysisCanvas.width;

      const height =
        analysisCanvas.height;


      /*
        Mirror webcam.

        This makes interaction feel natural:
        move right -> effect moves right.
      */

      analysisContext.save();

      analysisContext.clearRect(
        0,
        0,
        width,
        height
      );

      analysisContext.translate(
        width,
        0
      );

      analysisContext.scale(
        -1,
        1
      );

      analysisContext.drawImage(
        webcam,
        0,
        0,
        width,
        height
      );

      analysisContext.restore();


      let currentFrame;


      try {

        currentFrame =
          analysisContext.getImageData(
            0,
            0,
            width,
            height
          );

      }

      catch(error) {

        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      if (!previousFrame) {

        previousFrame =
          new Uint8ClampedArray(
            currentFrame.data
          );


        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      const output =
        motionContext.createImageData(
          width,
          height
        );


      let totalMotion = 0;


      for (
        let i = 0;
        i < currentFrame.data.length;
        i += 4
      ) {

        const r1 =
          currentFrame.data[i];

        const g1 =
          currentFrame.data[i + 1];

        const b1 =
          currentFrame.data[i + 2];


        const r0 =
          previousFrame[i];

        const g0 =
          previousFrame[i + 1];

        const b0 =
          previousFrame[i + 2];


        const currentBrightness =
          (
            r1 +
            g1 +
            b1
          ) / 3;


        const previousBrightness =
          (
            r0 +
            g0 +
            b0
          ) / 3;


        /*
          Difference between frames.
        */

        let difference =
          Math.abs(
            currentBrightness -
            previousBrightness
          );


        /*
          Ignore tiny camera noise.
        */

        difference =
          Math.max(
            0,
            difference - 8
          );


        /*
          Amplify real movement.
        */

        difference =
          Math.min(
            255,
            difference *
            MOTION_GAIN
          );


        /*
          Nonlinear response.

          Strong movement becomes dramatically brighter.
        */

        const normalized =
          difference / 255;


        const shaped =
          Math.pow(
            normalized,
            0.72
          );


        const value =
          Math.floor(
            shaped *
            255
          );


        output.data[i] =
          value;

        output.data[i + 1] =
          value;

        output.data[i + 2] =
          value;

        output.data[i + 3] =
          255;


        totalMotion +=
          value;

      }


      motionContext.putImageData(
        output,
        0,
        0
      );


      /*
        Calculate overall amount of motion.
      */

      const pixels =
        width *
        height;


      const measuredMotion =
        Math.min(
          1,
          (
            totalMotion /
            pixels /
            255
          ) * 6
        );


      motionLevel =
        motionLevel * 0.70 +
        measuredMotion * 0.30;


      motionPeak =
        Math.max(
          measuredMotion,
          motionPeak * 0.87
        );


      previousFrame.set(
        currentFrame.data
      );


      requestAnimationFrame(
        updateMotion
      );

    }


    /* =========================================================
       HYDRA PATCH
    ========================================================= */

    function createHydraPatch() {


      /* =====================================================
         1. MOTION TEXTURE

         Webcam movement becomes an unstable,
         organic displacement texture.

         o1 contains this texture.
      ===================================================== */

      src(s2)

        .contrast(
          3.6
        )

        .posterize(
          7,
          0.72
        )

        .modulate(

          noise(
            3.4,
            0.08
          )

            .rotate(
              () =>
                time * 0.035
            ),

          () =>
            0.03 +
            motionLevel * 0.20

        )

        .modulate(

          noise(
            9,
            0.16
          ),

          () =>
            motionPeak * 0.10 +
            audioPeak * 0.05

        )

        .scale(

          () =>
            1.02 +
            motionLevel * 0.06

        )

        .out(o1);



      /* =====================================================
         2. PRIMARY IMAGE

         DSC_3062.mp4 remains recognizable.
      ===================================================== */

      src(s0)

        .saturate(

          () =>
            1.10 +
            audioLevel * 0.50

        )

        .contrast(

          () =>
            1.03 +
            audioPeak * 0.10

        )


        /* ===================================================
           ORGANIC BASE DRIFT

           Very subtle.
           Prevents the image from feeling static.
        =================================================== */

        .modulate(

          noise(
            2.1,
            0.025
          )

            .rotate(
              () =>
                Math.sin(
                  time * 0.07
                ) * 0.08
            ),

          () =>
            0.003 +
            audioLevel * 0.012

        )


        /* ===================================================
           BODY MOVEMENT -> FOOTAGE DEFORMATION

           This is the central interaction.
        =================================================== */

        .modulate(

          src(o1)

            .scale(
              1.04
            )

            .scrollX(

              () =>
                Math.sin(
                  time * 0.13
                ) * 0.01

            ),

          () => {

            if (!cameraActive) {

              return 0;

            }


            return (

              0.012 +

              motionLevel *
              BODY_DISTORTION +

              motionPeak *
              0.17 +

              audioLevel *
              0.035

            );

          }

        )


        /* ===================================================
           SECOND BODY DISPLACEMENT

           Different spatial frequency.
           Prevents rectangular / uniform glitch.
        =================================================== */

        .modulate(

          src(o1)

            .rotate(

              () =>
                Math.sin(
                  time * 0.19
                ) *
                0.035

            )

            .scale(
              1.25
            ),

          () =>
            cameraActive
              ?
              motionPeak * 0.085
              :
              0

        )


        /* ===================================================
           WEBCAM GHOST

           Webcam is visible only faintly.

           It creates a sense of the body entering
           the pre-recorded footage rather than
           simply appearing on top of it.
        =================================================== */

        .blend(

          src(s1)

            .scale(
              -1,
              1
            )

            .saturate(
              0.75
            )

            .contrast(
              1.25
            )

            .modulate(

              src(o1),

              () =>
                0.015 +
                motionPeak * 0.08

            )

            .colorama(

              () =>
                0.001 +
                audioLevel * 0.008

            ),

          () => {

            if (!cameraActive) {

              return 0;

            }


            return (

              WEBCAM_VISIBILITY +

              motionLevel *
              0.08

            );

          }

        )


        /* ===================================================
           TEMPORAL FEEDBACK

           Moderate feedback.

           Only becomes aggressive when
           movement or sound increases.
        =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.0015 +
                motionLevel * 0.008 +
                audioLevel * 0.005

            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.11
                ) *
                (
                  0.001 +
                  motionLevel * 0.006
                )

            )

            .modulate(

              noise(
                2.3,
                0.035
              ),

              () =>
                motionLevel * 0.035 +
                audioLevel * 0.018

            ),

          () =>
            FEEDBACK_BASE +
            motionLevel * 0.17 +
            audioPeak * 0.06

        )


        /* ===================================================
           CHROMATIC RED TEAR

           Appears mostly during peaks.
        =================================================== */

        .add(

          src(s0)

            .scrollX(

              () =>
                motionPeak * 0.012 +
                audioPeak * 0.006

            )

            .modulate(

              src(o1),

              () =>
                motionPeak * 0.04

            )

            .color(
              1.20,
              0.03,
              0.05
            ),

          () =>
            motionPeak * 0.075 +
            audioPeak * 0.025

        )


        /* ===================================================
           CHROMATIC CYAN TEAR
        =================================================== */

        .add(

          src(s0)

            .scrollX(

              () =>
                -motionPeak * 0.010 -
                audioPeak * 0.005

            )

            .modulate(

              src(o1),

              () =>
                motionPeak * 0.035

            )

            .color(
              0.02,
              0.72,
              1.15
            ),

          () =>
            motionPeak * 0.065 +
            audioPeak * 0.022

        )


        /* ===================================================
           CONTROLLED COLOR INSTABILITY
        =================================================== */

        .colorama(

          () =>
            0.001 +
            motionPeak * 0.012 +
            audioPeak * 0.010

        )

        .saturate(

          () =>
            1.04 +
            motionLevel * 0.70 +
            audioLevel * 0.60

        )

        .contrast(

          () =>
            1.01 +
            motionPeak * 0.12

        )

        .out(o0);



      /* =====================================================
         3. LOCAL MOUSE MASK

         Small irregular region around cursor.
      ===================================================== */

      shape(

        70,

        () =>
          0.025 +
          mouseEnergy * 0.035,

        0.18

      )

        .scrollX(

          () =>
            mouseX -
            0.5

        )

        .scrollY(

          () =>
            0.5 -
            mouseY

        )

        .modulate(

          noise(
            5.5,
            0.18
          ),

          () =>
            0.06 +
            mouseEnergy * 0.12

        )

        .mult(

          noise(
            7.5,
            0.20
          )

            .contrast(
              2.5
            )

        )

        .out(o2);



      /* =====================================================
         4. FINAL LOCAL GLITCH

         Mouse only destabilizes the small mask region.
      ===================================================== */

      src(o0)

        .modulate(

          src(o2)

            .scrollX(

              () =>
                Math.sin(
                  time * 2.2
                ) *
                mouseEnergy *
                0.015

            ),

          () =>
            mouseEnergy *
            MOUSE_DISTORTION

        )

        .blend(

          src(o0)

            .scrollX(

              () =>
                (
                  Math.sin(
                    time * 8
                  ) *
                  0.012
                ) *
                mouseEnergy

            )

            .colorama(

              () =>
                mouseEnergy *
                0.035

            )

            .mask(
              src(o2)
            ),

          () =>
            mouseEnergy *
            0.18

        )

        .out(o3);



      /* =====================================================
         OUTPUT
      ===================================================== */

      render(o3);

    }


    /* =========================================================
       SAFARI / AUTOPLAY FALLBACK
    ========================================================= */

    document.addEventListener(
      "click",
      async () => {

        if (
          footage.paused
        ) {

          try {

            await footage.play();

          }

          catch(error) {

            console.log(
              error
            );

          }

        }

      },
      {
        once: true
      }
    );


  </script>

</body>

</html>
