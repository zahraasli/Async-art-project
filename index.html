<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
    }

    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #footage,
    #webcam {
      position: fixed;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      opacity: 0.001;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;

      padding: 9px 14px;

      border: 1px solid rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.42);
      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;

      cursor: pointer;
    }

    #startButton.active {
      opacity: 0.18;
    }

    #startButton:hover {
      opacity: 1;
    }
  </style>
</head>


<body>

  <!-- =========================================================
       YOUR FOOTAGE
       The file footage.mp4 must be next to index.html
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="./footage.mp4"
      type="video/mp4"
    >
  </video>


  <!-- =========================================================
       LIVE WEBCAM
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       CAMERA + SOUND BUTTON
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       HYDRA OUTPUT
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       HYDRA LIBRARY
  ========================================================== -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       INTERACTION
    ========================================================= */

    let audioLevel = 0;
    let audioPeak = 0;

    let mouseX = 0.5;
    let mouseY = 0.5;

    let mouseEnergy = 0;

    let lastMouseX = 0.5;
    let lastMouseY = 0.5;


    /* =========================================================
       AUDIO
    ========================================================= */

    let analyser = null;
    let audioData = null;


    /* =========================================================
       STATE
    ========================================================= */

    let cameraActive = false;
    let hydraStarted = false;


    /* =========================================================
       VISUAL SETTINGS

       Camera presence is intentionally LOW.
       Camera distortion is intentionally HIGH.
    ========================================================= */

    const AUDIO_SENSITIVITY = 20;

    const CAMERA_PRESENCE = 0.16;

    const CAMERA_WARP = 0.32;

    const FEEDBACK_AMOUNT = 0.76;

    const COLOR_AMOUNT = 0.022;

    const MOUSE_EFFECT = 0.045;


    /* =========================================================
       HYDRA ENGINE
    ========================================================= */

    const hydra = new Hydra({

      canvas: canvas,

      detectAudio: false,

      enableStreamCapture: false,

      makeGlobal: true

    });


    /* =========================================================
       RESOLUTION
    ========================================================= */

    function resizeHydra() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;


      if (
        typeof setResolution === "function"
      ) {

        setResolution(
          window.innerWidth,
          window.innerHeight
        );

      }

    }


    resizeHydra();


    window.addEventListener(
      "resize",
      resizeHydra
    );


    /* =========================================================
       INITIALIZE YOUR FOOTAGE
    ========================================================= */

    async function initializeFootage() {

      try {

        footage.muted = true;
        footage.loop = true;

        await footage.play();

      }

      catch(error) {

        console.log(
          "Autoplay waiting for user interaction.",
          error
        );

      }


      /* footage becomes Hydra source 0 */

      s0.init({
        src: footage
      });


      /*
        Before webcam starts,
        use footage as temporary s1.
      */

      s1.init({
        src: footage
      });


      if (!hydraStarted) {

        startHydraPatch();

        hydraStarted = true;

      }

    }


    footage.addEventListener(
      "loadeddata",
      initializeFootage,
      { once: true }
    );


    if (footage.readyState >= 2) {

      initializeFootage();

    }


    /* =========================================================
       VIDEO ERROR DEBUGGING
    ========================================================= */

    footage.addEventListener(
      "error",
      () => {

        console.error(
          "Could not load ./footage.mp4"
        );

        startButton.textContent =
          "FOOTAGE NOT FOUND";

      }
    );


    /* =========================================================
       MOUSE TRACKING
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;


        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          lastMouseX;


        const dy =
          y -
          lastMouseY;


        mouseEnergy =
          Math.min(
            1,
            Math.hypot(
              dx,
              dy
            ) * 18
          );


        mouseX = x;
        mouseY = y;

        lastMouseX = x;
        lastMouseY = y;

      }
    );


    /* =========================================================
       CAMERA + MICROPHONE
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        if (cameraActive) {
          return;
        }


        /*
          Also try to start footage again.
          Useful for Safari.
        */

        try {

          await footage.play();

        }

        catch(error) {

          console.log(error);

        }


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }

            });


          /* =====================================================
             WEBCAM
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          /*
            Replace temporary s1 with live webcam.
          */

          s1.init({
            src: webcam
          });


          cameraActive = true;


          /* =====================================================
             MICROPHONE
          ===================================================== */

          try {

            const AudioContext =
              window.AudioContext ||
              window.webkitAudioContext;


            const audioContext =
              new AudioContext();


            await audioContext.resume();


            const microphone =
              audioContext.createMediaStreamSource(
                stream
              );


            analyser =
              audioContext.createAnalyser();


            analyser.fftSize =
              512;


            analyser.smoothingTimeConstant =
              0.10;


            microphone.connect(
              analyser
            );


            audioData =
              new Uint8Array(
                analyser.fftSize
              );

          }

          catch(audioError) {

            console.log(
              "Audio analyser error:",
              audioError
            );

          }


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }

        catch(error) {

          console.error(
            "Camera error:",
            error
          );


          startButton.textContent =
            "CAMERA / SOUND FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *= 0.86;
        audioPeak *= 0.80;

        mouseEnergy *= 0.88;


        requestAnimationFrame(
          updateAudio
        );


        return;

      }


      analyser.getByteTimeDomainData(
        audioData
      );


      let sum = 0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        const value =
          (
            audioData[i] -
            128
          ) / 128;


        sum +=
          value *
          value;

      }


      const rms =
        Math.sqrt(
          sum /
          audioData.length
        );


      const target =
        Math.min(
          1,
          rms *
          AUDIO_SENSITIVITY
        );


      audioLevel =
        audioLevel *
        0.24 +
        target *
        0.76;


      audioPeak =
        Math.max(
          target,
          audioPeak *
          0.74
        );


      mouseEnergy *=
        0.88;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       HYDRA PATCH
    ========================================================= */

    function startHydraPatch() {


      /* =====================================================
         DISTORTED CAMERA GHOST

         IMPORTANT:
         Webcam is deliberately destroyed here before
         being mixed into the footage.
      ===================================================== */

      src(s1)

        .scale(
          () =>
            1.04 +
            audioLevel * 0.06
        )


        /* large organic deformation */

        .modulate(

          noise(
            1.7,
            0.055
          )

            .rotate(
              () =>
                time * 0.035
            )

            .scale(
              1.8
            ),

          () =>
            0.12 +
            audioLevel * 0.28
        )


        /* second irregular deformation */

        .modulate(

          noise(
            4.2,
            0.09
          )

            .rotate(
              () =>
                -time * 0.025
            ),

          () =>
            0.055 +
            audioPeak * 0.18
        )


        /* color displacement */

        .modulateHue(

          noise(
            2.2,
            0.04
          )

            .colorama(
              0.7
            ),

          () =>
            1.4 +
            audioLevel * 3.5
        )


        .colorama(

          () =>
            0.025 +
            audioLevel * 0.11
        )


        .saturate(

          () =>
            5.2 +
            audioLevel * 6
        )


        .contrast(

          () =>
            1.35 +
            audioLevel * 0.8
        )


        .posterize(
          9,
          0.65
        )


        /* ===================================================
           CAMERA SMEAR / MEMORY
        =================================================== */

        .blend(

          src(o1)

            .scale(

              () =>
                1.012 +
                audioLevel * 0.025
            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.15
                ) *
                0.012
            )

            .scrollX(

              () =>
                Math.sin(
                  time * 0.27
                ) *
                0.012
            )

            .scrollY(

              () =>
                Math.cos(
                  time * 0.19
                ) *
                0.009
            )

            .modulate(

              noise(
                2,
                0.035
              ),

              () =>
                0.035 +
                audioPeak * 0.12
            ),

          () =>
            0.68 +
            audioLevel * 0.15
        )


        .out(o1);



      /* =====================================================
         YOUR FOOTAGE
         THIS IS THE MAIN IMAGE
      ===================================================== */

      src(s0)


        .saturate(
          2.7
        )


        .contrast(
          1.15
        )


        .colorama(
          0.008
        )


        /* ===================================================
           CAMERA DISTORTS FOOTAGE

           Camera acts more like a FORCE than a visible layer.
        =================================================== */

        .modulate(

          src(o1)

            .saturate(
              0
            )

            .contrast(
              2.1
            )

            .posterize(
              7,
              0.6
            ),

          () => {

            if (cameraActive) {

              return (
                CAMERA_WARP +
                audioLevel * 0.32
              );

            }

            return 0.035;

          }

        )


        /* ===================================================
           IRREGULAR LIQUID GLITCH
        =================================================== */

        .modulate(

          noise(

            2.3,

            () =>
              0.025 +
              audioLevel * 0.075
          )

            .scale(
              1.7
            )

            .rotate(
              () =>
                time * 0.02
            ),

          () =>
            0.035 +
            audioLevel * 0.12
        )


        /* ===================================================
           CAMERA GHOST

           Very low visibility.
           Most of camera influence comes from modulation above.
        =================================================== */

        .blend(

          src(o1)

            .colorama(

              () =>
                0.035 +
                Math.sin(
                  time * 0.17
                ) *
                0.02
            )

            .saturate(

              () =>
                5 +
                audioLevel * 6
            )

            .contrast(
              1.5
            ),

          () => {

            if (cameraActive) {

              return (
                CAMERA_PRESENCE +
                audioLevel * 0.06
              );

            }

            return 0.04;

          }

        )


        /* ===================================================
           TEMPORAL FEEDBACK
        =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.006 +
                audioLevel * 0.022
            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.1
                ) *
                0.008
            )

            .scrollX(

              () =>
                Math.sin(
                  time * 0.13
                ) *
                0.005
            )

            .modulate(

              noise(
                1.5,
                0.025
              ),

              () =>
                0.022 +
                audioLevel * 0.11
            )

            .colorama(

              () =>
                COLOR_AMOUNT +
                audioLevel * 0.055
            )

            .saturate(

              () =>
                2.2 +
                audioLevel * 4
            ),

          () =>
            FEEDBACK_AMOUNT +
            audioLevel * 0.10
        )


        /* ===================================================
           RED COLOR BLEED
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                0.004 +
                audioPeak * 0.025
            )

            .scrollY(

              () =>
                audioPeak * 0.006
            )

            .color(
              1.5,
              0.04,
              0.16
            ),

          () =>
            0.09 +
            audioPeak * 0.19
        )


        /* ===================================================
           CYAN / BLUE COLOR BLEED
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                -0.005 -
                audioPeak * 0.022
            )

            .scrollY(

              () =>
                -audioPeak * 0.005
            )

            .color(
              0.03,
              1.0,
              1.55
            ),

          () =>
            0.08 +
            audioPeak * 0.18
        )


        /* ===================================================
           COLOR OVERDRIVE
        =================================================== */

        .colorama(

          () =>
            0.012 +
            audioLevel * 0.06 +
            Math.sin(
              time * 0.12
            ) *
            0.008
        )


        .saturate(

          () =>
            3.2 +
            audioLevel * 5
        )


        .contrast(

          () =>
            1.10 +
            audioPeak * 0.38
        )


        .brightness(

          () =>
            0.015 +
            audioPeak * 0.09
        )


        .out(o0);



      /* =====================================================
         SMALL LOCAL MOUSE DISTURBANCE
      ===================================================== */

      noise(
        7,
        0.15
      )

        .mask(

          shape(

            90,

            () =>
              0.038 +
              mouseEnergy *
              MOUSE_EFFECT,

            0.22
          )

            .scrollX(

              () =>
                mouseX -
                0.5
            )

            .scrollY(

              () =>
                mouseY -
                0.5
            )

        )


        .contrast(
          2.4
        )


        .out(o2);



      /* =====================================================
         MOUSE ONLY AFFECTS SMALL AREA
      ===================================================== */

      src(o0)

        .modulate(

          src(o2),

          () =>
            mouseEnergy *
            0.11
        )

        .out(o3);



      /* =====================================================
         FINAL OUTPUT
      ===================================================== */

      render(o3);

    }


    /* =========================================================
       SAFARI AUTOPLAY FALLBACK
    ========================================================= */

    document.addEventListener(
      "click",
      async () => {

        if (footage.paused) {

          try {

            await footage.play();

          }

          catch(error) {

            console.log(error);

          }

        }

      },
      { once: true }
    );


  </script>

</body>

</html>
