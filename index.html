<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hydra Test</title>

  <style>

    /* =========================================================
       PAGE SETUP
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }


    /* =========================================================
       HYDRA CANVAS
    ========================================================= */

    #hydraCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

  </style>

</head>


<body>

  <!-- =========================================================
       HYDRA OUTPUT
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       HYDRA-SYNTH LIBRARY
       Official webpage bundle
  ========================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>


  <script>

    /* =========================================================
       HYDRA STARTUP
    ========================================================= */

    const canvas =
      document.getElementById("hydraCanvas");


    const hydra =
      new Hydra({

        canvas: canvas,

        detectAudio: false,

        makeGlobal: true

      });


    /* =========================================================
       HYDRA TEST VISUAL
       If Hydra works, you MUST see moving colors
    ========================================================= */

    osc(
      8,
      0.1,
      1.2
    )

      .colorama(
        0.25
      )

      .out();


    /* =========================================================
       DEBUG MESSAGE
    ========================================================= */

    console.log(
      "HYDRA TEST:",
      typeof Hydra,
      typeof osc
    );

  </script>

</body>

</html>
