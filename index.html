<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Async Art Project</title>


  <style>

    /* =========================================================
       PAGE RESET
       Removes default browser spacing
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================================
       PAGE BACKGROUND
       Background behind all video layers
    ========================================================= */

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000000;

      cursor: crosshair;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================================================
       MAIN FOOTAGE
       This is the dominant background video
    ========================================================= */

    #footage {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* =========================================================
       WEBCAM OVERLAY
       Live webcam appears ON TOP of the main footage
    ========================================================= */

    #webcam {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 2;

      opacity: 0;

      mix-blend-mode: screen;

      pointer-events: none;

      transition: opacity 1.2s ease;
    }


    /* =========================================================
       ACTIVE WEBCAM
       Controls how visible the webcam is over the footage
    ========================================================= */

    #webcam.active {

      opacity: 0.42;

    }


    /* =========================================================
       GLITCH CANVAS
       All interactive glitch fragments are drawn here
    ========================================================= */

    #glitchCanvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 3;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA / MICROPHONE BUTTON
       Activates webcam and microphone
    ========================================================= */

    #startButton {
      position: fixed;

      top: 20px;
      left: 20px;

      z-index: 10;

      padding: 10px 15px;

      border: 1px solid rgba(255,255,255,0.85);

      background: rgba(0,0,0,0.55);

      color: white;

      font-size: 11px;

      letter-spacing: 1.5px;

      cursor: pointer;

      backdrop-filter: blur(4px);
    }


    /* =========================================================
       BUTTON HOVER
    ========================================================= */

    #startButton:hover {

      background: white;

      color: black;

    }


    /* =========================================================
       HIDE ACTIVE BUTTON
       Remove this section if you want the button to stay visible
    ========================================================= */

    #startButton.active {

      opacity: 0.35;

    }

  </style>

</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this URL later with your own footage
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >

    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    />

  </video>


  <!-- =========================================================
       LIVE WEBCAM LAYER
       Webcam remains separate from the footage
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       CAMERA + AUDIO ACTIVATION
  ========================================================== -->

  <button id="startButton">

    ENABLE CAMERA + SOUND

  </button>


  <!-- =========================================================
       GLITCH EFFECT CANVAS
  ========================================================== -->

  <canvas id="glitchCanvas"></canvas>


  <script>


    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const canvas =
      document.getElementById("glitchCanvas");

    const ctx =
      canvas.getContext("2d");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       HIDDEN COMPOSITE BUFFER
       Combines footage + webcam before creating glitches
    ========================================================= */

    const buffer =
      document.createElement("canvas");

    const bctx =
      buffer.getContext("2d");


    /* =========================================================
       MOUSE POSITION
    ========================================================= */

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let previousX = mouseX;

    let previousY = mouseY;

    let mouseSpeed = 0;


    /* =========================================================
       AUDIO VALUES
       Audio level ranges approximately from 0 to 1
    ========================================================= */

    let audioLevel = 0;

    let analyser = null;

    let audioData = null;


    /* =========================================================
       GLITCH AREA SIZE
       Smaller values keep distortion close to the cursor
    ========================================================= */

    const MIN_GLITCH_RADIUS = 45;

    const MAX_GLITCH_RADIUS = 125;


    /* =========================================================
       GLITCH DENSITY
       Controls the amount of tiny fragments
    ========================================================= */

    const BASE_FRAGMENT_COUNT = 8;

    const MAX_FRAGMENT_COUNT = 45;


    /* =========================================================
       SHARP GLITCH COLORS
       Bright digital colors used in random fragments
    ========================================================= */

    const glitchColors = [

      "#ff003c",

      "#ff1744",

      "#ff5e00",

      "#ffe600",

      "#baff00",

      "#00ff66",

      "#00fff0",

      "#00b7ff",

      "#004cff",

      "#6a00ff",

      "#b000ff",

      "#ff00d4",

      "#ff0077"

    ];


    /* =========================================================
       CANVAS RESIZE
       Keeps internal canvas resolution matched to the window
    ========================================================= */

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

      buffer.width =
        window.innerWidth;

      buffer.height =
        window.innerHeight;

    }


    resizeCanvas();


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
       Requests both video and audio permission
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: true

            });


          /* =====================================================
             WEBCAM STREAM
             Places webcam over the existing footage
          ===================================================== */

          webcam.srcObject =
            stream;

          webcam.classList.add(
            "active"
          );

          await webcam.play();


          /* =====================================================
             AUDIO ANALYSIS
             Uses microphone volume to control glitch behavior
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          const source =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize = 256;

          analyser.smoothingTimeConstant =
            0.65;


          source.connect(
            analyser
          );


          audioData =
            new Uint8Array(
              analyser.frequencyBinCount
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }

        catch (error) {

          console.error(
            "Camera or microphone access failed:",
            error
          );


          startButton.textContent =
            "ACCESS FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO LEVEL DETECTION
       Converts microphone input into a normalized value
    ========================================================= */

    function updateAudioLevel() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *= 0.92;

        return;

      }


      analyser.getByteFrequencyData(
        audioData
      );


      let total = 0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        total +=
          audioData[i];

      }


      const average =
        total /
        audioData.length;


      const rawLevel =
        average / 255;


      /* Increase microphone sensitivity */

      const amplifiedLevel =
        Math.min(
          1,
          rawLevel * 4.5
        );


      /* Smooth audio movement */

      audioLevel =
        audioLevel * 0.68 +
        amplifiedLevel * 0.32;

    }


    /* =========================================================
       MOUSE TRACKING
       Mouse affects only a small local area
    ========================================================= */

    window.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;


        const dx =
          mouseX -
          previousX;

        const dy =
          mouseY -
          previousY;


        mouseSpeed =
          Math.hypot(
            dx,
            dy
          );


        previousX =
          mouseX;

        previousY =
          mouseY;


        createMouseGlitch();

      }
    );


    /* =========================================================
       COMPOSITE FRAME
       Captures footage first and webcam second
    ========================================================= */

    function captureCompositeFrame() {

      bctx.clearRect(
        0,
        0,
        buffer.width,
        buffer.height
      );


      /* MAIN FOOTAGE */

      if (
        footage.readyState >= 2
      ) {

        bctx.globalAlpha = 1;

        bctx.globalCompositeOperation =
          "source-over";


        bctx.drawImage(
          footage,
          0,
          0,
          buffer.width,
          buffer.height
        );

      }


      /* WEBCAM OVERLAY */

      if (
        webcam.readyState >= 2 &&
        webcam.classList.contains(
          "active"
        )
      ) {

        bctx.globalAlpha =
          0.42;

        bctx.globalCompositeOperation =
          "screen";


        bctx.drawImage(
          webcam,
          0,
          0,
          buffer.width,
          buffer.height
        );

      }


      bctx.globalAlpha = 1;

      bctx.globalCompositeOperation =
        "source-over";

    }


    /* =========================================================
       RANDOM VALUE HELPER
    ========================================================= */

    function random(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (max - min)
      );

    }


    /* =========================================================
       RANDOM COLOR HELPER
    ========================================================= */

    function randomColor() {

      return glitchColors[
        Math.floor(
          Math.random() *
          glitchColors.length
        )
      ];

    }


    /* =========================================================
       LOCAL MOUSE GLITCH
       Creates small irregular distortion around the cursor
    ========================================================= */

    function createMouseGlitch() {

      if (
        footage.readyState < 2
      ) {
        return;
      }


      captureCompositeFrame();


      const speedInfluence =
        Math.min(
          mouseSpeed,
          30
        );


      const radius =
        Math.min(
          MAX_GLITCH_RADIUS,

          MIN_GLITCH_RADIUS +
          speedInfluence * 1.5 +
          audioLevel * 35
        );


      const count =
        Math.floor(

          BASE_FRAGMENT_COUNT +

          Math.random() * 14 +

          audioLevel * 18

        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const chance =
          Math.random();


        if (
          chance < 0.34
        ) {

          microHorizontalGlitch(
            mouseX,
            mouseY,
            radius
          );

        }

        else if (
          chance < 0.60
        ) {

          microPixelGlitch(
            mouseX,
            mouseY,
            radius
          );

        }

        else if (
          chance < 0.78
        ) {

          microRGBGlitch(
            mouseX,
            mouseY,
            radius
          );

        }

        else if (
          chance < 0.92
        ) {

          microColorGlitch(
            mouseX,
            mouseY,
            radius
          );

        }

        else {

          microNoiseGlitch(
            mouseX,
            mouseY,
            radius
          );

        }

      }

    }


    /* =========================================================
       MICRO HORIZONTAL GLITCH
       Tiny horizontal fragments with irregular displacement
    ========================================================= */

    function microHorizontalGlitch(
      x,
      y,
      radius
    ) {

      const width =
        random(
          8,
          75
        );


      const height =
        random(
          1,
          5
        );


      const sourceX =
        x +
        random(
          -radius,
          radius
        );


      const sourceY =
        y +
        random(
          -radius,
          radius
        );


      const offset =
        random(
          -45,
          45
        ) *
        (
          0.7 +
          audioLevel * 2.5
        );


      ctx.globalAlpha =
        random(
          0.35,
          0.9
        );


      ctx.drawImage(

        buffer,

        sourceX,
        sourceY,

        width,
        height,

        sourceX + offset,

        sourceY +
        random(
          -5,
          5
        ),

        width *
        random(
          0.6,
          1.7
        ),

        height

      );


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       MICRO PIXEL GLITCH
       Very small rectangular fragments
    ========================================================= */

    function microPixelGlitch(
      x,
      y,
      radius
    ) {

      const width =
        random(
          2,
          22
        );


      const height =
        random(
          1,
          13
        );


      const sourceX =
        x +
        random(
          -radius,
          radius
        );


      const sourceY =
        y +
        random(
          -radius,
          radius
        );


      const offsetX =
        random(
          -32,
          32
        ) *
        (
          1 +
          audioLevel * 2
        );


      const offsetY =
        random(
          -15,
          15
        );


      ctx.globalAlpha =
        random(
          0.35,
          1
        );


      ctx.drawImage(

        buffer,

        sourceX,
        sourceY,

        width,
        height,

        sourceX +
        offsetX,

        sourceY +
        offsetY,

        width *
        random(
          0.5,
          2.4
        ),

        height *
        random(
          0.6,
          1.6
        )

      );


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       MICRO RGB SPLIT
       Small sharp red / cyan / magenta separations
    ========================================================= */

    function microRGBGlitch(
      x,
      y,
      radius
    ) {

      const width =
        random(
          5,
          45
        );


      const height =
        random(
          1,
          9
        );


      const sourceX =
        x +
        random(
          -radius,
          radius
        );


      const sourceY =
        y +
        random(
          -radius,
          radius
        );


      const shift =
        random(
          4,
          18
        ) *
        (
          1 +
          audioLevel * 2.5
        );


      ctx.globalCompositeOperation =
        "screen";


      /* RED */

      ctx.globalAlpha =
        random(
          0.45,
          0.9
        );


      ctx.filter =
        "sepia(1) saturate(18) hue-rotate(-35deg) contrast(3)";


      ctx.drawImage(

        buffer,

        sourceX,
        sourceY,

        width,
        height,

        sourceX +
        shift,

        sourceY,

        width,
        height

      );


      /* CYAN */

      ctx.globalAlpha =
        random(
          0.4,
          0.85
        );


      ctx.filter =
        "sepia(1) saturate(18) hue-rotate(145deg) contrast(3.4)";


      ctx.drawImage(

        buffer,

        sourceX,
        sourceY,

        width,
        height,

        sourceX -
        shift,

        sourceY +
        random(
          -2,
          2
        ),

        width,
        height

      );


      /* MAGENTA — RANDOM OCCURRENCE */

      if (
        Math.random() > 0.5
      ) {

        ctx.globalAlpha =
          random(
            0.35,
            0.75
          );


        ctx.filter =
          "sepia(1) saturate(20) hue-rotate(280deg) contrast(3.8)";


        ctx.drawImage(

          buffer,

          sourceX,
          sourceY,

          width,
          height,

          sourceX +
          random(
            -10,
            10
          ),

          sourceY +
          random(
            -4,
            4
          ),

          width,
          height

        );

      }


      ctx.filter =
        "none";


      ctx.globalCompositeOperation =
        "source-over";


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       MICRO SHARP COLOR GLITCH
       Tiny saturated color interruptions
    ========================================================= */

    function microColorGlitch(
      x,
      y,
      radius
    ) {

      const px =
        x +
        random(
          -radius,
          radius
        );


      const py =
        y +
        random(
          -radius,
          radius
        );


      const width =
        random(
          2,
          35
        );


      const height =
        random(
          1,
          8
        );


      ctx.fillStyle =
        randomColor();


      ctx.globalAlpha =
        random(
          0.25,
          0.85
        );


      ctx.fillRect(

        px,

        py,

        width,

        height

      );


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       MICRO DIGITAL NOISE
       Tiny single-pixel and micro-block interruptions
    ========================================================= */

    function microNoiseGlitch(
      x,
      y,
      radius
    ) {

      const amount =
        Math.floor(
          random(
            3,
            12
          )
        );


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const px =
          x +
          random(
            -radius,
            radius
          );


        const py =
          y +
          random(
            -radius,
            radius
          );


        const size =
          random(
            1,
            4
          );


        ctx.fillStyle =
          Math.random() > 0.35
            ? randomColor()
            : "#ffffff";


        ctx.globalAlpha =
          random(
            0.25,
            0.9
          );


        ctx.fillRect(

          px,

          py,

          size *
          random(
            1,
            5
          ),

          size

        );

      }


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       SOUND-REACTIVE RANDOM GLITCH
       Creates distortion in unpredictable screen locations
       even when the mouse is not moving
    ========================================================= */

    function createAudioGlitch() {

      if (
        footage.readyState < 2
      ) {
        return;
      }


      if (
        audioLevel < 0.045
      ) {
        return;
      }


      /* Higher sound = higher probability */

      const probability =
        0.08 +
        audioLevel * 0.72;


      if (
        Math.random() >
        probability
      ) {
        return;
      }


      captureCompositeFrame();


      const centerX =
        random(
          0,
          canvas.width
        );


      const centerY =
        random(
          0,
          canvas.height
        );


      const radius =
        random(
          20,
          65 +
          audioLevel * 80
        );


      const count =
        Math.floor(

          2 +

          Math.random() *
          (
            5 +
            audioLevel *
            MAX_FRAGMENT_COUNT
          )

        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const type =
          Math.random();


        if (
          type < 0.28
        ) {

          microHorizontalGlitch(
            centerX,
            centerY,
            radius
          );

        }

        else if (
          type < 0.52
        ) {

          microPixelGlitch(
            centerX,
            centerY,
            radius
          );

        }

        else if (
          type < 0.70
        ) {

          microRGBGlitch(
            centerX,
            centerY,
            radius
          );

        }

        else if (
          type < 0.88
        ) {

          microColorGlitch(
            centerX,
            centerY,
            radius
          );

        }

        else {

          microNoiseGlitch(
            centerX,
            centerY,
            radius
          );

        }

      }

    }


    /* =========================================================
       RARE GLITCH SPIKES
       Occasional sudden unpredictable digital ruptures
    ========================================================= */

    function randomSpike() {

      if (
        Math.random() > 0.018
      ) {
        return;
      }


      if (
        footage.readyState < 2
      ) {
        return;
      }


      captureCompositeFrame();


      const x =
        random(
          0,
          canvas.width
        );


      const y =
        random(
          0,
          canvas.height
        );


      const fragments =
        Math.floor(
          random(
            4,
            18
          )
        );


      for (
        let i = 0;
        i < fragments;
        i++
      ) {

        const width =
          random(
            4,
            90
          );


        const height =
          random(
            1,
            6
          );


        const sx =
          x +
          random(
            -80,
            80
          );


        const sy =
          y +
          random(
            -60,
            60
          );


        ctx.globalAlpha =
          random(
            0.35,
            0.95
          );


        ctx.drawImage(

          buffer,

          sx,
          sy,

          width,
          height,

          sx +
          random(
            -100,
            100
          ),

          sy +
          random(
            -8,
            8
          ),

          width *
          random(
            0.5,
            2
          ),

          height

        );


        if (
          Math.random() > 0.55
        ) {

          ctx.fillStyle =
            randomColor();


          ctx.globalAlpha =
            random(
              0.2,
              0.65
            );


          ctx.fillRect(

            sx +
            random(
              -30,
              30
            ),

            sy,

            random(
              2,
              30
            ),

            random(
              1,
              4
            )

          );

        }

      }


      ctx.globalAlpha = 1;

    }


    /* =========================================================
       GLITCH DECAY
       Slowly removes old glitch fragments from the screen
    ========================================================= */

    function fadeGlitchCanvas() {

      ctx.save();


      ctx.globalCompositeOperation =
        "destination-out";


      ctx.fillStyle =
        "rgba(0,0,0,0.12)";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.restore();

    }


    /* =========================================================
       MAIN ANIMATION LOOP
       Continuously reads audio and creates irregular distortion
    ========================================================= */

    function animate() {

      updateAudioLevel();


      fadeGlitchCanvas();


      createAudioGlitch();


      randomSpike();


      mouseSpeed *= 0.82;


      requestAnimationFrame(
        animate
      );

    }


    /* =========================================================
       START ANIMATION
    ========================================================= */

    animate();


  </script>

</body>

</html>
