<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async Art Project</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Base footage is ALWAYS visible behind Hydra.
       This prevents the page from ever collapsing to black. */
    #footage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      opacity: 1;
      filter: brightness(1.16) saturate(1.08) contrast(1.03);
      background: #000;
    }

    /* Hidden input sources */
    #webcam,
    #analysisCanvas,
    #motionCanvas {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 160px;
      height: 90px;
      opacity: 0;
      pointer-events: none;
    }

    /* Hydra is an effects layer OVER the always-visible footage.
       "screen" means black Hydra pixels do not hide the footage. */
    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: block;
      background: transparent;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,0.72);
      background: rgba(0,0,0,0.48);
      color: #fff;
      font-size: 10px;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    #startButton.active { opacity: 0.28; }
    #startButton.active:hover { opacity: 1; }

    #status {
      position: fixed;
      left: 18px;
      bottom: 16px;
      z-index: 20;
      color: rgba(255,255,255,0.62);
      font-size: 9px;
      letter-spacing: 1.3px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="footage" autoplay muted loop playsinline preload="auto">
    <source src="./DSC_3062.mp4" type="video/mp4">
  </video>

  <video id="webcam" autoplay muted playsinline></video>

  <canvas id="analysisCanvas" width="160" height="90"></canvas>
  <canvas id="motionCanvas" width="160" height="90"></canvas>

  <canvas id="hydraCanvas"></canvas>

  <button id="startButton">ENABLE CAMERA + SOUND</button>
  <div id="status">FOOTAGE LOADING... | KEYS: 1 2 3 4 SPACE</div>

  <script src="https://unpkg.com/hydra-synth"></script>

  <script>
    const footage = document.getElementById("footage");
    const webcam = document.getElementById("webcam");
    const analysisCanvas = document.getElementById("analysisCanvas");
    const motionCanvas = document.getElementById("motionCanvas");
    const analysisContext = analysisCanvas.getContext("2d", { willReadFrequently: true });
    const motionContext = motionCanvas.getContext("2d", { willReadFrequently: true });
    const hydraCanvas = document.getElementById("hydraCanvas");
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("status");

    let cameraActive = false;
    let hydraReady = false;

    let analyser = null;
    let audioData = null;
    let audioLevel = 0;
    let audioPeak = 0;

    let motionLevel = 0;
    let motionPeak = 0;
    let previousFrame = null;

    let mouseX = 0.5;
    let mouseY = 0.5;
    let lastMouseX = 0.5;
    let lastMouseY = 0.5;
    let mouseEnergy = 0;

    let keyBurst = 0;
    let keySmear = 0;
    let keyFlash = 0;
    let keyFold = 0;
    let keyColor = 0;

    const AUDIO_SENSITIVITY = 20;
    const MOTION_GAIN = 11;

    /* ---------------------------------------------------------
       HYDRA SETUP
    --------------------------------------------------------- */

    try {
      new Hydra({
        canvas: hydraCanvas,
        detectAudio: false,
        enableStreamCapture: false,
        makeGlobal: true
      });
      hydraReady = true;
    } catch (error) {
      console.error("Hydra init failed:", error);
      hydraReady = false;
      statusText.textContent = "FOOTAGE ONLY — HYDRA FAILED";
    }

    function resizeHydra() {
      if (typeof setResolution === "function") {
        const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
        setResolution(
          Math.floor(window.innerWidth * ratio),
          Math.floor(window.innerHeight * ratio)
        );
      }
    }

    window.addEventListener("resize", resizeHydra);
    setTimeout(resizeHydra, 150);

    /* ---------------------------------------------------------
       FOOTAGE
    --------------------------------------------------------- */

    async function playFootage() {
      try {
        footage.muted = true;
        footage.loop = true;
        await footage.play();
        statusText.textContent = "FOOTAGE READY | KEYS: 1 2 3 4 SPACE";

        if (hydraReady) {
          s0.init({ src: footage });
          s1.init({ src: footage });
          s2.init({ src: motionCanvas });
          startHydraPatch();
        }
      } catch (error) {
        console.log("Footage autoplay waiting for click:", error);
        statusText.textContent = "CLICK ENABLE CAMERA + SOUND";
      }
    }

    footage.addEventListener("loadeddata", playFootage, { once: true });
    footage.addEventListener("canplay", () => {
      if (footage.paused) playFootage();
    }, { once: true });

    footage.addEventListener("error", () => {
      statusText.textContent = "DSC_3062.mp4 NOT FOUND";
    });

    if (footage.readyState >= 2) playFootage();

    /* ---------------------------------------------------------
       MOUSE
    --------------------------------------------------------- */

    window.addEventListener("mousemove", (event) => {
      const x = event.clientX / window.innerWidth;
      const y = event.clientY / window.innerHeight;
      const dx = x - lastMouseX;
      const dy = y - lastMouseY;

      mouseEnergy = Math.min(1, mouseEnergy + Math.hypot(dx, dy) * 8);

      mouseX = x;
      mouseY = y;
      lastMouseX = x;
      lastMouseY = y;
    });

    /* ---------------------------------------------------------
       KEYBOARD
       1 = horizontal tear
       2 = smear
       3 = color burst
       4 = fold
       SPACE = all
    --------------------------------------------------------- */

    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;

      if (event.code === "Digit1") keyBurst = 1;
      if (event.code === "Digit2") keySmear = 1;
      if (event.code === "Digit3") keyFlash = 1;
      if (event.code === "Digit4") keyFold = 1;

      if (event.code === "Space") {
        event.preventDefault();
        keyBurst = 1;
        keySmear = 1;
        keyFlash = 1;
        keyFold = 1;
        keyColor = 1;
      }
    });

    /* ---------------------------------------------------------
       CAMERA + AUDIO
    --------------------------------------------------------- */

    startButton.addEventListener("click", async () => {
      try { await footage.play(); } catch (_) {}

      if (cameraActive) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        });

        webcam.srcObject = stream;
        await webcam.play();

        if (hydraReady) {
          s1.init({ src: webcam });
        }

        cameraActive = true;
        previousFrame = null;

        startButton.textContent = "CAMERA + SOUND ACTIVE";
        startButton.classList.add("active");
        statusText.textContent = "MOVE / SPEAK / KEYS 1 2 3 4 SPACE";

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const audioContext = new AudioContextClass();
          await audioContext.resume();

          const microphone = audioContext.createMediaStreamSource(stream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.15;
          microphone.connect(analyser);

          audioData = new Uint8Array(analyser.fftSize);
        } catch (audioError) {
          console.log("Audio analyser unavailable:", audioError);
        }

        requestAnimationFrame(updateMotion);

      } catch (error) {
        console.error(error);
        startButton.textContent = "CAMERA PERMISSION FAILED";
        statusText.textContent = "CHECK CAMERA PERMISSION";
      }
    });

    /* ---------------------------------------------------------
       AUDIO ANALYSIS
    --------------------------------------------------------- */

    function updateAudio() {
      if (analyser && audioData) {
        analyser.getByteTimeDomainData(audioData);

        let sum = 0;

        for (let i = 0; i < audioData.length; i++) {
          const sample = (audioData[i] - 128) / 128;
          sum += sample * sample;
        }

        const rms = Math.sqrt(sum / audioData.length);
        const target = Math.min(1, rms * AUDIO_SENSITIVITY);

        audioLevel = audioLevel * 0.67 + target * 0.33;
        audioPeak = Math.max(target, audioPeak * 0.84);
      } else {
        audioLevel *= 0.95;
        audioPeak *= 0.90;
      }

      mouseEnergy *= 0.91;

      keyBurst *= 0.91;
      keySmear *= 0.94;
      keyFlash *= 0.88;
      keyFold *= 0.92;
      keyColor *= 0.90;

      requestAnimationFrame(updateAudio);
    }

    updateAudio();

    /* ---------------------------------------------------------
       WEBCAM MOTION MAP
    --------------------------------------------------------- */

    function updateMotion() {
      if (!cameraActive) return;

      if (webcam.readyState < 2) {
        requestAnimationFrame(updateMotion);
        return;
      }

      const width = analysisCanvas.width;
      const height = analysisCanvas.height;

      analysisContext.save();
      analysisContext.clearRect(0, 0, width, height);
      analysisContext.translate(width, 0);
      analysisContext.scale(-1, 1);
      analysisContext.drawImage(webcam, 0, 0, width, height);
      analysisContext.restore();

      let frame;

      try {
        frame = analysisContext.getImageData(0, 0, width, height);
      } catch (_) {
        requestAnimationFrame(updateMotion);
        return;
      }

      if (!previousFrame) {
        previousFrame = new Uint8ClampedArray(frame.data);
        requestAnimationFrame(updateMotion);
        return;
      }

      const output = motionContext.createImageData(width, height);
      let total = 0;

      for (let i = 0; i < frame.data.length; i += 4) {
        const current = (
          frame.data[i] +
          frame.data[i + 1] +
          frame.data[i + 2]
        ) / 3;

        const previous = (
          previousFrame[i] +
          previousFrame[i + 1] +
          previousFrame[i + 2]
        ) / 3;

        let diff = Math.abs(current - previous);
        diff = Math.max(0, diff - 9);
        diff = Math.min(255, diff * MOTION_GAIN);

        const value = Math.floor(
          Math.pow(diff / 255, 0.67) * 255
        );

        output.data[i] = value;
        output.data[i + 1] = value;
        output.data[i + 2] = value;
        output.data[i + 3] = 255;

        total += value;
      }

      motionContext.putImageData(output, 0, 0);

      const measured = Math.min(
        1,
        (total / (width * height * 255)) * 8
      );

      motionLevel = motionLevel * 0.72 + measured * 0.28;
      motionPeak = Math.max(measured, motionPeak * 0.84);

      previousFrame.set(frame.data);

      requestAnimationFrame(updateMotion);
    }

    /* ---------------------------------------------------------
       HYDRA EFFECT LAYER

       IMPORTANT:
       The full video is NOT rendered by Hydra.
       Hydra only renders colored glitch fragments over the
       always-visible HTML video underneath.
    --------------------------------------------------------- */

    function startHydraPatch() {
      if (!hydraReady) return;

      try {

        /* Camera motion field */
        src(s2)
          .contrast(4.5)
          .posterize(9, 0.75)
          .rotate(
            () =>
              Math.sin(time * 0.18) *
              (0.01 + motionPeak * 0.04)
          )
          .scrollX(
            () =>
              Math.sin(time * 0.44) *
              (0.01 + motionPeak * 0.03)
          )
          .scrollY(
            () =>
              Math.cos(time * 0.31) *
              (0.008 + motionPeak * 0.02)
          )
          .out(o1);

        /* Irregular thin horizontal tear mask */
        osc(16, 0.026, 0)
          .rotate(Math.PI / 2)
          .thresh(0.69, 0.03)
          .scrollY(
            () =>
              Math.sin(time * 1.03) * 0.14 +
              Math.sin(time * 0.29) * 0.05 +
              keyBurst * 0.10
          )
          .modulate(
            osc(3.5, 0.016, 0)
              .rotate(0.15)
              .scrollX(() => Math.sin(time * 0.43) * 0.06),
            () =>
              0.04 +
              motionPeak * 0.06 +
              keyBurst * 0.10
          )
          .out(o2);

        /*
          Effects-only output.
          Black background is harmless because canvas uses
          mix-blend-mode: screen.
        */
        solid(0, 0, 0, 1)

          /* Magenta */
          .add(
            src(s0)
              .scrollX(
                () =>
                  0.015 +
                  motionPeak * 0.06 +
                  audioPeak * 0.035 +
                  keyFlash * 0.08
              )
              .color(1.9, 0.0, 0.9)
              .saturate(2.6)
              .contrast(1.55)
              .mask(src(o2).scrollY(0.015)),
            () =>
              0.06 +
              motionPeak * 0.16 +
              audioPeak * 0.08 +
              keyFlash * 0.22
          )

          /* Cyan */
          .add(
            src(s0)
              .scrollX(
                () =>
                  -0.016 -
                  motionPeak * 0.055 -
                  audioPeak * 0.03 -
                  keyFlash * 0.075
              )
              .color(0.0, 1.45, 1.95)
              .saturate(2.5)
              .contrast(1.56)
              .mask(src(o2).invert().scrollY(-0.022)),
            () =>
              0.055 +
              motionPeak * 0.15 +
              audioPeak * 0.075 +
              keyFlash * 0.21
          )

          /* Acid green */
          .add(
            src(s0)
              .scrollX(
                () =>
                  Math.sin(time * 1.9) *
                  (0.007 + motionPeak * 0.025 + keyColor * 0.04)
              )
              .color(0.3, 1.65, 0.0)
              .saturate(2.4)
              .contrast(1.5)
              .mask(src(o2).scrollY(0.071)),
            () =>
              0.018 +
              motionPeak * 0.06 +
              audioPeak * 0.03 +
              keyColor * 0.10
          )

          /* Webcam fragments */
          .add(
            src(s1)
              .brightness(0.05)
              .saturate(1.4)
              .contrast(1.35)
              .colorama(
                () =>
                  0.006 +
                  motionPeak * 0.015 +
                  audioPeak * 0.012 +
                  keyFlash * 0.025
              )
              .modulate(
                src(o1),
                () =>
                  0.025 +
                  motionPeak * 0.10 +
                  keyFold * 0.12
              )
              .mask(src(o1).contrast(2.5))
              .scrollX(
                () =>
                  Math.sin(time * 1.7) *
                  (motionPeak * 0.05 + keySmear * 0.06)
              ),
            () => {
              if (!cameraActive) return 0;
              return (
                0.18 +
                motionLevel * 0.25 +
                motionPeak * 0.08 +
                keySmear * 0.12
              );
            }
          )

          /* Key 2 smear */
          .add(
            src(s0)
              .scale(
                () =>
                  1.001 + keySmear * 0.02
              )
              .scrollX(
                () =>
                  Math.sin(time * 0.58) *
                  (keySmear * 0.08 + motionLevel * 0.02)
              )
              .colorama(
                () =>
                  keySmear * 0.025
              )
              .mask(src(o2).scrollY(0.1)),
            () =>
              0.015 +
              keySmear * 0.14 +
              motionLevel * 0.04
          )

          .out(o3);

        render(o3);

      } catch (error) {
        console.error("Hydra patch error:", error);

        /* Even if Hydra fails, the base HTML video remains visible. */
        try {
          solid(0, 0, 0, 1).out(o3);
          render(o3);
        } catch (_) {}
      }
    }

    /* Safari user-gesture fallback */
    document.addEventListener("click", async () => {
      if (footage.paused) {
        try { await footage.play(); } catch (_) {}
      }
    }, { once: true });

  </script>
</body>
</html>
