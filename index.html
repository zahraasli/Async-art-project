<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #glitchCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >
    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    />
  </video>

  <canvas id="glitchCanvas"></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("glitchCanvas");
    const ctx = canvas.getContext("2d");

    const buffer = document.createElement("canvas");
    const bctx = buffer.getContext("2d");

    let lastX = innerWidth / 2;
    let lastY = innerHeight / 2;

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      buffer.width = innerWidth;
      buffer.height = innerHeight;
    }

    resize();
    addEventListener("resize", resize);

    addEventListener("mousemove", (e) => {
      if (video.readyState < 2) return;

      const x = e.clientX;
      const y = e.clientY;

      const dx = x - lastX;
      const dy = y - lastY;
      const speed = Math.hypot(dx, dy);

      createGlitch(x, y, speed);

      lastX = x;
      lastY = y;
    });

    function createGlitch(x, y, speed) {
      bctx.clearRect(0, 0, buffer.width, buffer.height);
      bctx.drawImage(video, 0, 0, buffer.width, buffer.height);

      const radius = Math.min(
        520,
        Math.max(180, 220 + speed * 5)
      );

      // تعداد burst بیشتر
      const bursts = 6 + Math.floor(Math.random() * 8);

      for (let b = 0; b < bursts; b++) {

        const localX =
          x + (Math.random() - 0.5) * radius * 1.2;

        const localY =
          y + (Math.random() - 0.5) * radius * 1.2;

        horizontalTear(localX, localY, radius, speed);
        rgbSplit(localX, localY, radius, speed);
        pixelBlocks(localX, localY, radius, speed);
      }
    }

    function horizontalTear(x, y, radius, speed) {
      const slices = 20 + Math.floor(Math.random() * 35);

      for (let i = 0; i < slices; i++) {

        const h = 2 + Math.random() * 22;
        const w = radius * (0.4 + Math.random() * 1.4);

        const sx = x - w / 2;
        const sy =
          y -
          radius / 2 +
          Math.random() * radius;

        const shift =
          (Math.random() - 0.5) *
          (120 + speed * 8);

        ctx.globalAlpha =
          0.35 + Math.random() * 0.65;

        ctx.drawImage(
          buffer,
          sx,
          sy,
          w,
          h,

          sx + shift,
          sy + (Math.random() - 0.5) * 15,
          w,
          h
        );
      }

      ctx.globalAlpha = 1;
    }

    function rgbSplit(x, y, radius, speed) {
      const pieces = 12 + Math.floor(Math.random() * 18);

      for (let i = 0; i < pieces; i++) {

        const w = 30 + Math.random() * radius * 0.8;
        const h = 5 + Math.random() * 60;

        const sx =
          x -
          radius / 2 +
          Math.random() * radius;

        const sy =
          y -
          radius / 2 +
          Math.random() * radius;

        const shift =
          20 + Math.random() * (80 + speed * 5);

        // RED
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.8;
        ctx.filter =
          "sepia(1) saturate(8) hue-rotate(-35deg) contrast(2)";

        ctx.drawImage(
          buffer,
          sx,
          sy,
          w,
          h,
          sx + shift,
          sy,
          w,
          h
        );

        // CYAN / BLUE
        ctx.globalAlpha = 0.75;
        ctx.filter =
          "sepia(1) saturate(10) hue-rotate(150deg) contrast(2)";

        ctx.drawImage(
          buffer,
          sx,
          sy,
          w,
          h,
          sx - shift,
          sy + Math.random() * 8,
          w,
          h
        );

        // MAGENTA
        if (Math.random() > 0.4) {
          ctx.globalAlpha = 0.65;
          ctx.filter =
            "sepia(1) saturate(12) hue-rotate(280deg) contrast(2.3)";

          ctx.drawImage(
            buffer,
            sx,
            sy,
            w,
            h,
            sx + shift * 0.4,
            sy - Math.random() * 10,
            w,
            h
          );
        }
      }

      ctx.filter = "none";
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    function pixelBlocks(x, y, radius, speed) {
      const count =
        15 + Math.floor(Math.random() * 25);

      for (let i = 0; i < count; i++) {

        const w =
          10 + Math.random() * radius * 0.5;

        const h =
          3 + Math.random() * 45;

        const sx =
          x -
          radius / 2 +
          Math.random() * radius;

        const sy =
          y -
          radius / 2 +
          Math.random() * radius;

        const offset =
          (Math.random() - 0.5) *
          (180 + speed * 10);

        ctx.globalAlpha =
          0.45 + Math.random() * 0.55;

        ctx.drawImage(
          buffer,
          sx,
          sy,
          w,
          h,

          sx + offset,
          sy + (Math.random() - 0.5) * 30,
          w * (0.7 + Math.random() * 1.8),
          h
        );

        // occasional sharp color blocks
        if (Math.random() > 0.65) {

          const colors = [
            "#ff003c",
            "#00fff7",
            "#ff00d4",
            "#d7ff00",
            "#4d00ff"
          ];

          ctx.globalAlpha = 0.25 + Math.random() * 0.45;
          ctx.fillStyle =
            colors[Math.floor(Math.random() * colors.length)];

          ctx.fillRect(
            sx + offset,
            sy,
            w * Math.random(),
            h * (0.5 + Math.random() * 2)
          );
        }
      }

      ctx.globalAlpha = 1;
    }
  </script>

</body>
</html>
