<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      cursor: crosshair;
      font-family: Arial, Helvetica, sans-serif;
    }

    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      z-index: 1;
    }

    /*
      These media elements are sources for Hydra.
      They should not appear directly on the page.
    */

    #footage,
    #webcam,
    #analysisCanvas,
    #motionCanvas {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 160px;
      height: 90px;
      opacity: 0;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1000;

      padding: 10px 15px;

      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.52);
      color: white;

      font-size: 10px;
      letter-spacing: 1.5px;

      cursor: pointer;
    }

    #startButton:hover {
      background: rgba(255,255,255,0.12);
    }

    #startButton.active {
      opacity: 0.25;
    }

    #startButton.active:hover {
      opacity: 1;
    }

    #status {
      position: fixed;
      bottom: 16px;
      left: 18px;
      z-index: 1000;

      color: rgba(255,255,255,0.55);

      font-size: 9px;
      letter-spacing: 1.4px;

      pointer-events: none;
    }

  </style>
</head>


<body>


  <!-- ======================================================
       PRERECORDED FOOTAGE
  ======================================================= -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="./DSC_3062.mp4"
      type="video/mp4"
    >
  </video>


  <!-- ======================================================
       WEBCAM
  ======================================================= -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- ======================================================
       MOTION DETECTION
  ======================================================= -->

  <canvas
    id="analysisCanvas"
    width="160"
    height="90"
  ></canvas>

  <canvas
    id="motionCanvas"
    width="160"
    height="90"
  ></canvas>


  <!-- ======================================================
       HYDRA OUTPUT
  ======================================================= -->

  <canvas id="hydraCanvas"></canvas>


  <!-- ======================================================
       UI
  ======================================================= -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>

  <div id="status">
    LOADING FOOTAGE...
  </div>


  <!-- ======================================================
       HYDRA
  ======================================================= -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* ======================================================
       ELEMENTS
    ======================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const analysisCanvas =
      document.getElementById("analysisCanvas");

    const motionCanvas =
      document.getElementById("motionCanvas");

    const startButton =
      document.getElementById("startButton");

    const statusText =
      document.getElementById("status");


    const analysisContext =
      analysisCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    const motionContext =
      motionCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    /* ======================================================
       STATE
    ======================================================= */

    let cameraActive = false;

    let hydraStarted = false;

    let analyser = null;

    let audioData = null;

    let audioLevel = 0;

    let audioPeak = 0;

    let motionLevel = 0;

    let motionPeak = 0;

    let previousFrame = null;

    let mouseX = 0.5;

    let mouseY = 0.5;

    let previousMouseX = 0.5;

    let previousMouseY = 0.5;

    let mouseEnergy = 0;


    /* ======================================================
       SETTINGS
    ======================================================= */

    const AUDIO_SENSITIVITY = 18;

    const MOTION_GAIN = 8;

    const BODY_GLITCH = 0.42;

    const WEBCAM_AMOUNT = 0.18;

    const FEEDBACK_AMOUNT = 0.09;


    /* ======================================================
       HYDRA INSTANCE
    ======================================================= */

    let hydra;


    try {

      hydra =
        new Hydra({

          canvas: canvas,

          detectAudio: false,

          enableStreamCapture: false,

          makeGlobal: true

        });

    }

    catch(error) {

      console.error(
        "Hydra failed to initialize:",
        error
      );

      statusText.textContent =
        "HYDRA FAILED TO LOAD";

    }


    /* ======================================================
       RESIZE
    ======================================================= */

    function resizeHydra() {

      if (
        typeof setResolution !==
        "function"
      ) {

        return;

      }


      const ratio =
        Math.min(
          window.devicePixelRatio || 1,
          1.5
        );


      setResolution(

        Math.floor(
          window.innerWidth *
          ratio
        ),

        Math.floor(
          window.innerHeight *
          ratio
        )

      );

    }


    window.addEventListener(
      "resize",
      resizeHydra
    );


    setTimeout(
      resizeHydra,
      200
    );


    /* ======================================================
       START FOOTAGE
    ======================================================= */

    async function startFootage() {

      try {

        footage.muted = true;

        footage.loop = true;


        await footage.play();


        console.log(
          "Footage playing:",
          footage.videoWidth,
          footage.videoHeight
        );


        statusText.textContent =
          "FOOTAGE READY";


        /*
          s0 = DSC_3062.mp4
        */

        s0.init({
          src: footage
        });


        /*
          Before webcam is enabled,
          s1 also uses footage.

          Once camera starts,
          s1 becomes webcam.
        */

        s1.init({
          src: footage
        });


        /*
          s2 = motion-map canvas.
        */

        s2.init({
          src: motionCanvas
        });


        if (!hydraStarted) {

          startHydraPatch();

          hydraStarted = true;

        }

      }

      catch(error) {

        console.error(
          "Footage playback failed:",
          error
        );


        statusText.textContent =
          "CLICK ENABLE CAMERA + SOUND";

      }

    }


    /* ======================================================
       VIDEO EVENTS
    ======================================================= */

    footage.addEventListener(
      "loadeddata",
      () => {

        startFootage();

      },
      {
        once: true
      }
    );


    footage.addEventListener(
      "canplay",
      () => {

        if (!hydraStarted) {

          startFootage();

        }

      },
      {
        once: true
      }
    );


    footage.addEventListener(
      "error",
      event => {

        console.error(
          "VIDEO ERROR",
          event
        );


        statusText.textContent =
          "DSC_3062.mp4 NOT LOADING";

      }
    );


    if (
      footage.readyState >= 2
    ) {

      startFootage();

    }


    /* ======================================================
       MOUSE
    ======================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;


        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          previousMouseX;


        const dy =
          y -
          previousMouseY;


        const speed =
          Math.hypot(
            dx,
            dy
          );


        mouseEnergy =
          Math.min(
            1,
            mouseEnergy +
            speed * 9
          );


        mouseX = x;

        mouseY = y;


        previousMouseX = x;

        previousMouseY = y;

      }
    );


    /* ======================================================
       ENABLE CAMERA + MICROPHONE
    ======================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        /*
          Also make sure footage is playing.
        */

        try {

          await footage.play();

        }

        catch(error) {

          console.log(
            "Footage interaction playback:",
            error
          );

        }


        if (cameraActive) {

          return;

        }


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          startButton.textContent =
            "CAMERA NOT SUPPORTED";

          return;

        }


        try {

          statusText.textContent =
            "REQUESTING CAMERA...";


          const stream =
            await navigator.mediaDevices
              .getUserMedia({

                video: {

                  facingMode: "user",

                  width: {
                    ideal: 1280
                  },

                  height: {
                    ideal: 720
                  }

                },

                audio: {

                  echoCancellation: false,

                  noiseSuppression: false,

                  autoGainControl: true

                }

              });


          webcam.srcObject =
            stream;


          await webcam.play();


          /*
            s1 now becomes webcam.
          */

          s1.init({
            src: webcam
          });


          cameraActive = true;


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );


          statusText.textContent =
            "MOVE / SPEAK / INTERACT";


          /*
            AUDIO
          */

          try {

            const AudioContext =
              window.AudioContext ||
              window.webkitAudioContext;


            const audioContext =
              new AudioContext();


            await audioContext.resume();


            const microphone =
              audioContext
                .createMediaStreamSource(
                  stream
                );


            analyser =
              audioContext
                .createAnalyser();


            analyser.fftSize =
              512;


            analyser.smoothingTimeConstant =
              0.15;


            microphone.connect(
              analyser
            );


            audioData =
              new Uint8Array(
                analyser.fftSize
              );

          }

          catch(audioError) {

            console.log(
              "Audio unavailable:",
              audioError
            );

          }


          previousFrame = null;


          requestAnimationFrame(
            updateMotion
          );

        }

        catch(error) {

          console.error(
            "Camera / microphone error:",
            error
          );


          startButton.textContent =
            "CAMERA PERMISSION FAILED";


          statusText.textContent =
            "CHECK CAMERA PERMISSION";

        }

      }
    );


    /* ======================================================
       AUDIO ANALYSIS
    ======================================================= */

    function updateAudio() {

      if (
        analyser &&
        audioData
      ) {

        analyser.getByteTimeDomainData(
          audioData
        );


        let sum = 0;


        for (
          let i = 0;
          i < audioData.length;
          i++
        ) {

          const sample =
            (
              audioData[i] -
              128
            ) / 128;


          sum +=
            sample *
            sample;

        }


        const rms =
          Math.sqrt(
            sum /
            audioData.length
          );


        const target =
          Math.min(

            1,

            rms *
            AUDIO_SENSITIVITY

          );


        audioLevel =
          audioLevel * 0.65 +
          target * 0.35;


        audioPeak =
          Math.max(
            target,
            audioPeak * 0.84
          );

      }

      else {

        audioLevel *= 0.95;

        audioPeak *= 0.90;

      }


      mouseEnergy *= 0.91;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* ======================================================
       WEBCAM MOTION DETECTION
    ======================================================= */

    function updateMotion() {

      if (!cameraActive) {

        return;

      }


      if (
        webcam.readyState < 2
      ) {

        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      const width =
        analysisCanvas.width;


      const height =
        analysisCanvas.height;


      /*
        Mirror webcam before analysis.
      */

      analysisContext.save();


      analysisContext.clearRect(
        0,
        0,
        width,
        height
      );


      analysisContext.translate(
        width,
        0
      );


      analysisContext.scale(
        -1,
        1
      );


      analysisContext.drawImage(
        webcam,
        0,
        0,
        width,
        height
      );


      analysisContext.restore();


      let frame;


      try {

        frame =
          analysisContext
            .getImageData(
              0,
              0,
              width,
              height
            );

      }

      catch(error) {

        requestAnimationFrame(
          updateMotion
        );

        return;

      }


      if (!previousFrame) {

        previousFrame =
          new Uint8ClampedArray(
            frame.data
          );


        requestAnimationFrame(
          updateMotion
        );


        return;

      }


      const output =
        motionContext
          .createImageData(
            width,
            height
          );


      let totalMovement = 0;


      for (
        let i = 0;
        i < frame.data.length;
        i += 4
      ) {

        const current =
          (
            frame.data[i] +
            frame.data[i + 1] +
            frame.data[i + 2]
          ) / 3;


        const old =
          (
            previousFrame[i] +
            previousFrame[i + 1] +
            previousFrame[i + 2]
          ) / 3;


        let difference =
          Math.abs(
            current -
            old
          );


        /*
          Suppress normal webcam sensor noise.
        */

        difference =
          Math.max(
            0,
            difference - 10
          );


        difference =
          Math.min(
            255,
            difference *
            MOTION_GAIN
          );


        /*
          Higher contrast movement map.
        */

        const normalized =
          difference /
          255;


        const shaped =
          Math.pow(
            normalized,
            0.65
          );


        const value =
          Math.floor(
            shaped *
            255
          );


        output.data[i] =
          value;


        output.data[i + 1] =
          value;


        output.data[i + 2] =
          value;


        output.data[i + 3] =
          255;


        totalMovement +=
          value;

      }


      motionContext.putImageData(
        output,
        0,
        0
      );


      const average =
        totalMovement /
        (
          width *
          height *
          255
        );


      const measured =
        Math.min(
          1,
          average * 8
        );


      motionLevel =
        motionLevel * 0.72 +
        measured * 0.28;


      motionPeak =
        Math.max(
          measured,
          motionPeak * 0.84
        );


      previousFrame.set(
        frame.data
      );


      requestAnimationFrame(
        updateMotion
      );

    }


    /* ======================================================
       HYDRA PATCH
    ======================================================= */

    function startHydraPatch() {

      try {

        /*
          ----------------------------------------------------
          o1 = WEBCAM MOTION MAP

          No noise().
          Only detected human movement.
          ----------------------------------------------------
        */

        src(s2)

          .contrast(
            4.5
          )

          .posterize(
            5,
            0.8
          )

          .pixelate(
            80,
            45
          )

          .out(o1);



        /*
          ----------------------------------------------------
          o2 = HORIZONTAL DIGITAL BANDS

          This creates slicing / tearing,
          rather than television static.
          ----------------------------------------------------
        */

        osc(
          5,
          0.02,
          0
        )

          .rotate(
            Math.PI / 2
          )

          .thresh(
            0.65,
            0.03
          )

          .pixelate(
            2,
            42
          )

          .scrollY(
            () =>
              Math.sin(
                time * 0.8
              ) * 0.06
          )

          .out(o2);



        /*
          ----------------------------------------------------
          MAIN FOOTAGE
          ----------------------------------------------------
        */

        src(s0)

          .scale(
            1.005
          )

          .saturate(
            1.15
          )

          .contrast(
            1.05
          )


          /*
            BODY MOVEMENT DEFORMS VIDEO.
          */

          .modulate(

            src(o1),

            () => {

              if (!cameraActive) {

                return 0;

              }


              return (

                0.01 +

                motionLevel *
                BODY_GLITCH +

                motionPeak *
                0.16

              );

            }

          )


          /*
            LARGE HORIZONTAL TEARING.
          */

          .blend(

            src(s0)

              .scrollX(

                () =>

                  0.015 +

                  motionPeak *
                  0.12 +

                  audioPeak *
                  0.06

              )

              .mask(
                src(o2)
              ),

            () =>

              0.10 +

              motionPeak *
              0.35 +

              audioPeak *
              0.18

          )


          /*
            TEAR IN OPPOSITE DIRECTION.
          */

          .blend(

            src(s0)

              .scrollX(

                () =>

                  -0.012 -

                  motionPeak *
                  0.09 -

                  audioPeak *
                  0.04

              )

              .mask(

                src(o2)

                  .invert()

                  .scrollY(
                    0.09
                  )

              ),

            () =>

              0.07 +

              motionPeak *
              0.28

          )


          /*
            RED CHANNEL SEPARATION.
          */

          .add(

            src(s0)

              .scrollX(

                () =>

                  0.004 +

                  motionPeak *
                  0.035 +

                  audioPeak *
                  0.025

              )

              .color(
                1.0,
                0.0,
                0.0
              )

              .mask(
                src(o2)
              ),

            () =>

              0.015 +

              motionPeak *
              0.09 +

              audioPeak *
              0.06

          )


          /*
            CYAN CHANNEL SEPARATION.
          */

          .add(

            src(s0)

              .scrollX(

                () =>

                  -0.005 -

                  motionPeak *
                  0.03 -

                  audioPeak *
                  0.02

              )

              .color(
                0,
                0.8,
                1.0
              )

              .mask(

                src(o2)
                  .invert()

              ),

            () =>

              0.012 +

              motionPeak *
              0.08 +

              audioPeak *
              0.05

          )


          /*
            WEBCAM FRAGMENTS.

            Webcam does not cover the entire footage.
            It appears mostly where movement exists.
          */

          .blend(

            src(s1)

              .saturate(
                0.65
              )

              .contrast(
                1.3
              )

              .posterize(
                7,
                0.75
              )

              .mask(
                src(o1)
              )

              .scrollX(

                () =>

                  Math.sin(
                    time * 2
                  ) *

                  motionPeak *

                  0.045

              ),

            () => {

              if (!cameraActive) {

                return 0;

              }


              return (

                WEBCAM_AMOUNT +

                motionLevel *
                0.24

              );

            }

          )


          /*
            LIGHT TEMPORAL FEEDBACK.

            Kept deliberately low so the image
            does not dissolve into static.
          */

          .blend(

            src(o0)

              .scale(

                () =>

                  1.001 +

                  motionLevel *
                  0.005

              )

              .scrollX(

                () =>

                  Math.sin(
                    time * 0.45
                  ) *

                  motionLevel *

                  0.025

              ),

            () =>

              FEEDBACK_AMOUNT +

              motionLevel *
              0.10 +

              audioPeak *
              0.04

          )


          /*
            AUDIO affects saturation and contrast.
          */

          .saturate(

            () =>

              1.10 +

              audioLevel *
              0.9

          )

          .contrast(

            () =>

              1.04 +

              audioPeak *
              0.16

          )

          .out(o0);



        /*
          ----------------------------------------------------
          LOCAL MOUSE GLITCH MASK
          ----------------------------------------------------
        */

        shape(
          4,
          () =>
            0.018 +
            mouseEnergy * 0.028,
          0.015
        )

          .scale(
            2.8,
            0.38
          )

          .scrollX(

            () =>
              mouseX -
              0.5

          )

          .scrollY(

            () =>
              0.5 -
              mouseY

          )

          .out(o3);



        /*
          ----------------------------------------------------
          FINAL IMAGE
          ----------------------------------------------------
        */

        src(o0)

          .blend(

            src(o0)

              .scrollX(

                () =>

                  mouseEnergy *
                  0.075

              )

              .mask(
                src(o3)
              ),

            () =>

              mouseEnergy *
              0.5

          )

          .out(o3);


        render(o3);


        statusText.textContent =
          "FOOTAGE READY";

      }

      catch(error) {

        /*
          If any part of the artistic patch fails,
          display the footage instead of a black screen.
        */

        console.error(
          "Hydra patch error:",
          error
        );


        try {

          src(s0)
            .out(o0);

          render(o0);


          statusText.textContent =
            "FOOTAGE FALLBACK MODE";

        }

        catch(fallbackError) {

          console.error(
            "Hydra fallback failed:",
            fallbackError
          );


          statusText.textContent =
            "HYDRA ERROR";

        }

      }

    }


    /* ======================================================
       SAFARI AUTOPLAY FALLBACK
    ======================================================= */

    document.addEventListener(
      "click",
      async () => {

        if (
          footage.paused
        ) {

          try {

            await footage.play();

          }

          catch(error) {

            console.log(
              "Safari playback:",
              error
            );

          }

        }

      },
      {
        once: true
      }
    );


  </script>

</body>

</html>
