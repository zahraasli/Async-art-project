<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>


  <style>

    /* =========================================================
       PAGE RESET
       Removes default browser spacing
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================================
       PAGE BACKGROUND
       Full-screen black background
    ========================================================= */

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      cursor: crosshair;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       MAIN OUTPUT CANVAS
       Displays footage, webcam halo and glitch
    ========================================================= */

    #outputCanvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
    }


    /* =========================================================
       HIDDEN VIDEO SOURCES
       Footage and webcam are processed in JavaScript
    ========================================================= */

    #footage,
    #webcam {
      position: fixed;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA + MICROPHONE BUTTON
    ========================================================= */

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 20;

      padding: 9px 14px;

      border: 1px solid rgba(255,255,255,0.8);

      background: rgba(0,0,0,0.5);

      color: white;

      font-size: 11px;

      letter-spacing: 1.4px;

      cursor: pointer;
    }


    /* =========================================================
       ACTIVE BUTTON
    ========================================================= */

    #startButton.active {
      opacity: 0.22;
    }

  </style>

</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this video later with your own footage
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >

    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================================================
       LIVE WEBCAM SOURCE
    ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       CAMERA + MICROPHONE CONTROL
    ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       FINAL OUTPUT CANVAS
    ========================================================== -->

  <canvas id="outputCanvas"></canvas>


  <script>


    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const canvas =
      document.getElementById("outputCanvas");

    const ctx =
      canvas.getContext("2d");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       COMPOSITE BUFFER
       Stores footage + webcam halo
    ========================================================= */

    const compositeCanvas =
      document.createElement("canvas");

    const compositeCtx =
      compositeCanvas.getContext("2d");


    /* =========================================================
       TEMPORAL MEMORY BUFFER
       Stores previous frames for datamosh feedback
    ========================================================= */

    const memoryCanvas =
      document.createElement("canvas");

    const memoryCtx =
      memoryCanvas.getContext("2d");


    /* =========================================================
       WEBCAM HALO BUFFER
       Processes webcam separately before merging
    ========================================================= */

    const haloCanvas =
      document.createElement("canvas");

    const haloCtx =
      haloCanvas.getContext("2d");


    /* =========================================================
       MOTION DETECTION BUFFER
    ========================================================= */

    const motionCanvas =
      document.createElement("canvas");

    const motionCtx =
      motionCanvas.getContext(
        "2d",
        { willReadFrequently: true }
      );


    const MOTION_WIDTH = 64;
    const MOTION_HEIGHT = 48;


    motionCanvas.width =
      MOTION_WIDTH;

    motionCanvas.height =
      MOTION_HEIGHT;


    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let webcamActive = false;

    let previousMotionFrame = null;

    let webcamMotionAmount = 0;

    let webcamMotionX =
      innerWidth / 2;

    let webcamMotionY =
      innerHeight / 2;


    /* =========================================================
       MOUSE STATE
    ========================================================= */

    let mouseX =
      innerWidth / 2;

    let mouseY =
      innerHeight / 2;

    let lastMouseX =
      mouseX;

    let lastMouseY =
      mouseY;

    let mouseSpeed = 0;

    let mouseMoving = false;

    let mouseTimer = null;


    /* =========================================================
       AUDIO STATE
    ========================================================= */

    let analyser = null;

    let timeData = null;

    let frequencyData = null;

    let audioLevel = 0;

    let bassLevel = 0;

    let audioPeak = 0;


    /* =========================================================
       WEBCAM HALO VISIBILITY
       Lower value = less visible webcam
    ========================================================= */

    const WEBCAM_HALO_OPACITY = 0.13;


    /* =========================================================
       WEBCAM HALO BLUR
       Higher value makes the webcam more ghost-like
    ========================================================= */

    const WEBCAM_BLUR = 15;


    /* =========================================================
       MOUSE GLITCH AREA
       Keeps mouse interaction local
    ========================================================= */

    const MOUSE_MIN_RADIUS = 20;
    const MOUSE_MAX_RADIUS = 55;


    /* =========================================================
       WEBCAM MOTION GLITCH AREA
    ========================================================= */

    const MOTION_MIN_RADIUS = 30;
    const MOTION_MAX_RADIUS = 120;


    /* =========================================================
       AUDIO SENSITIVITY
       Higher value = stronger reaction to sound
    ========================================================= */

    const AUDIO_SENSITIVITY = 11;


    /* =========================================================
       DATAMOSH STRENGTH
    ========================================================= */

    const MOSH_STRENGTH = 1.8;


    /* =========================================================
       TEMPORAL MEMORY
       Higher value preserves old image information longer
    ========================================================= */

    const MEMORY_AMOUNT = 0.91;


    /* =========================================================
       EXTREME GLITCH COLORS
       High-saturation palette
    ========================================================= */

    const glitchColors = [

      "#ff003c",
      "#ff0000",
      "#ff4d00",
      "#ff8c00",

      "#fff000",
      "#c8ff00",

      "#00ff3c",
      "#00ff9d",
      "#00fff0",

      "#00aaff",
      "#0040ff",

      "#5500ff",
      "#9600ff",

      "#ff00e1",
      "#ff0077"

    ];


    /* =========================================================
       RANDOM NUMBER HELPER
    ========================================================= */

    function random(min, max) {

      return (
        min +
        Math.random() *
        (max - min)
      );

    }


    /* =========================================================
       RANDOM INTEGER HELPER
    ========================================================= */

    function randomInt(min, max) {

      return Math.floor(
        random(min, max + 1)
      );

    }


    /* =========================================================
       RANDOM COLOR HELPER
    ========================================================= */

    function randomColor() {

      return glitchColors[
        Math.floor(
          Math.random() *
          glitchColors.length
        )
      ];

    }


    /* =========================================================
       CANVAS RESIZE
    ========================================================= */

    function resizeCanvas() {

      const width =
        innerWidth;

      const height =
        innerHeight;


      canvas.width =
        width;

      canvas.height =
        height;


      compositeCanvas.width =
        width;

      compositeCanvas.height =
        height;


      memoryCanvas.width =
        width;

      memoryCanvas.height =
        height;


      haloCanvas.width =
        width;

      haloCanvas.height =
        height;

    }


    resizeCanvas();


    addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================================
       VIDEO COVER DRAWING
       Draws video like object-fit: cover
    ========================================================= */

    function drawVideoCover(
      context,
      video,
      width,
      height
    ) {

      if (
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
      ) {

        return;

      }


      const videoRatio =
        video.videoWidth /
        video.videoHeight;


      const canvasRatio =
        width /
        height;


      let sourceX = 0;
      let sourceY = 0;

      let sourceWidth =
        video.videoWidth;

      let sourceHeight =
        video.videoHeight;


      if (
        videoRatio >
        canvasRatio
      ) {

        sourceHeight =
          video.videoHeight;

        sourceWidth =
          sourceHeight *
          canvasRatio;

        sourceX =
          (
            video.videoWidth -
            sourceWidth
          ) / 2;

      }

      else {

        sourceWidth =
          video.videoWidth;

        sourceHeight =
          sourceWidth /
          canvasRatio;

        sourceY =
          (
            video.videoHeight -
            sourceHeight
          ) / 2;

      }


      context.drawImage(

        video,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        0,
        0,

        width,
        height

      );

    }


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }

            });


          webcam.srcObject =
            stream;


          await webcam.play();


          webcamActive = true;


          /* =====================================================
             AUDIO ANALYSIS
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          await audioContext.resume();


          const source =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize =
            512;


          analyser.smoothingTimeConstant =
            0.28;


          source.connect(
            analyser
          );


          timeData =
            new Uint8Array(
              analyser.fftSize
            );


          frequencyData =
            new Uint8Array(
              analyser.frequencyBinCount
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }

        catch (error) {

          console.error(
            error
          );


          startButton.textContent =
            "ACCESS FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
       Strong response to voice, clap and music
    ========================================================= */

    function updateAudio() {

      if (
        !analyser
      ) {

        audioLevel *= 0.9;
        bassLevel *= 0.9;
        audioPeak *= 0.86;

        return;

      }


      analyser.getByteTimeDomainData(
        timeData
      );


      let sumSquares = 0;


      for (
        let i = 0;
        i < timeData.length;
        i++
      ) {

        const v =
          (
            timeData[i] -
            128
          ) / 128;


        sumSquares +=
          v * v;

      }


      const rms =
        Math.sqrt(
          sumSquares /
          timeData.length
        );


      analyser.getByteFrequencyData(
        frequencyData
      );


      let lowTotal = 0;


      for (
        let i = 0;
        i < 30;
        i++
      ) {

        lowTotal +=
          frequencyData[i];

      }


      const bass =
        lowTotal /
        30 /
        255;


      const targetAudio =
        Math.min(
          1,
          rms *
          AUDIO_SENSITIVITY
        );


      const targetBass =
        Math.min(
          1,
          bass * 4.2
        );


      audioLevel =
        audioLevel * 0.4 +
        targetAudio * 0.6;


      bassLevel =
        bassLevel * 0.45 +
        targetBass * 0.55;


      audioPeak =
        Math.max(

          audioLevel,

          bassLevel,

          audioPeak * 0.8

        );

    }


    /* =========================================================
       WEBCAM HALO PROCESSING
       Converts webcam into a blurred ghost image
       instead of a clear portrait
    ========================================================= */

    function buildWebcamHalo() {

      haloCtx.clearRect(
        0,
        0,
        haloCanvas.width,
        haloCanvas.height
      );


      if (
        !webcamActive ||
        webcam.readyState < 2
      ) {

        return;

      }


      haloCtx.save();


      /* Mirror webcam */

      haloCtx.translate(
        haloCanvas.width,
        0
      );


      haloCtx.scale(
        -1,
        1
      );


      /* Very soft and distorted webcam */

      haloCtx.filter =
        `
        blur(${WEBCAM_BLUR}px)
        contrast(2.5)
        saturate(3.5)
        brightness(1.2)
        `;


      haloCtx.globalAlpha =
        0.35;


      drawVideoCover(

        haloCtx,

        webcam,

        haloCanvas.width,

        haloCanvas.height

      );


      haloCtx.restore();


      /* =====================================================
         SECOND COLOR-SHIFTED HALO
         Creates chromatic ghosting
      ===================================================== */

      haloCtx.save();


      haloCtx.globalCompositeOperation =
        "screen";


      haloCtx.globalAlpha =
        0.18;


      haloCtx.filter =
        `
        blur(${WEBCAM_BLUR + 6}px)
        saturate(8)
        hue-rotate(100deg)
        contrast(2)
        `;


      haloCtx.translate(
        haloCanvas.width + 8,
        -3
      );


      haloCtx.scale(
        -1,
        1
      );


      drawVideoCover(

        haloCtx,

        webcam,

        haloCanvas.width,

        haloCanvas.height

      );


      haloCtx.restore();

    }


    /* =========================================================
       FOOTAGE + WEBCAM HALO MERGE
       Footage remains dominant
    ========================================================= */

    function buildCompositeFrame() {

      compositeCtx.clearRect(
        0,
        0,
        compositeCanvas.width,
        compositeCanvas.height
      );


      /* =====================================================
         MAIN FOOTAGE
      ===================================================== */

      compositeCtx.globalAlpha = 1;

      compositeCtx.globalCompositeOperation =
        "source-over";


      compositeCtx.filter =
        "saturate(1.35) contrast(1.08)";


      drawVideoCover(

        compositeCtx,

        footage,

        compositeCanvas.width,

        compositeCanvas.height

      );


      compositeCtx.filter =
        "none";


      /* =====================================================
         GHOST WEBCAM HALO
      ===================================================== */

      if (
        webcamActive
      ) {

        compositeCtx.save();


        compositeCtx.globalAlpha =
          WEBCAM_HALO_OPACITY;


        compositeCtx.globalCompositeOperation =
          "screen";


        compositeCtx.drawImage(

          haloCanvas,

          0,
          0,

          compositeCanvas.width,
          compositeCanvas.height

        );


        compositeCtx.restore();

      }

    }


    /* =========================================================
       WEBCAM MOTION DETECTION
    ========================================================= */

    function detectWebcamMotion() {

      if (
        !webcamActive ||
        webcam.readyState < 2
      ) {

        webcamMotionAmount *=
          0.82;

        return;

      }


      motionCtx.save();


      motionCtx.translate(
        MOTION_WIDTH,
        0
      );


      motionCtx.scale(
        -1,
        1
      );


      motionCtx.drawImage(

        webcam,

        0,
        0,

        MOTION_WIDTH,
        MOTION_HEIGHT

      );


      motionCtx.restore();


      const imageData =
        motionCtx.getImageData(

          0,
          0,

          MOTION_WIDTH,
          MOTION_HEIGHT

        );


      const pixels =
        imageData.data;


      if (
        !previousMotionFrame
      ) {

        previousMotionFrame =
          new Uint8ClampedArray(
            pixels
          );

        return;

      }


      let totalDifference = 0;

      let weightedX = 0;

      let weightedY = 0;


      for (
        let y = 0;
        y < MOTION_HEIGHT;
        y += 2
      ) {

        for (
          let x = 0;
          x < MOTION_WIDTH;
          x += 2
        ) {

          const index =
            (
              y *
              MOTION_WIDTH +
              x
            ) * 4;


          const current =
            (
              pixels[index] +
              pixels[index + 1] +
              pixels[index + 2]
            ) / 3;


          const previous =
            (
              previousMotionFrame[index] +
              previousMotionFrame[index + 1] +
              previousMotionFrame[index + 2]
            ) / 3;


          const difference =
            Math.abs(
              current -
              previous
            );


          if (
            difference > 15
          ) {

            const weight =
              difference - 15;


            totalDifference +=
              weight;


            weightedX +=
              x * weight;


            weightedY +=
              y * weight;

          }

        }

      }


      if (
        totalDifference > 0
      ) {

        const x =
          weightedX /
          totalDifference;


        const y =
          weightedY /
          totalDifference;


        webcamMotionX =
          webcamMotionX * 0.5 +
          (
            x /
            MOTION_WIDTH *
            canvas.width
          ) * 0.5;


        webcamMotionY =
          webcamMotionY * 0.5 +
          (
            y /
            MOTION_HEIGHT *
            canvas.height
          ) * 0.5;


        webcamMotionAmount =
          Math.min(

            1,

            webcamMotionAmount * 0.25 +
            totalDifference /
            7500

          );

      }

      else {

        webcamMotionAmount *=
          0.72;

      }


      previousMotionFrame.set(
        pixels
      );

    }


    /* =========================================================
       MOUSE TRACKING
       Mouse affects only a small local region
    ========================================================= */

    addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;


        const dx =
          mouseX -
          lastMouseX;


        const dy =
          mouseY -
          lastMouseY;


        mouseSpeed =
          Math.hypot(
            dx,
            dy
          );


        lastMouseX =
          mouseX;

        lastMouseY =
          mouseY;


        mouseMoving = true;


        clearTimeout(
          mouseTimer
        );


        mouseTimer =
          setTimeout(
            () => {

              mouseMoving =
                false;

            },
            60
          );

      }
    );


    /* =========================================================
       IRREGULAR ORGANIC PATH
       Creates unpredictable non-rectangular glitch shapes
    ========================================================= */

    function irregularPath(
      context,
      centerX,
      centerY,
      radius
    ) {

      const points =
        randomInt(
          7,
          18
        );


      context.beginPath();


      for (
        let i = 0;
        i < points;
        i++
      ) {

        const angle =
          (
            Math.PI *
            2 /
            points
          ) *
          i +
          random(
            -0.45,
            0.45
          );


        const distance =
          radius *
          random(
            0.12,
            1
          );


        const x =
          centerX +
          Math.cos(angle) *
          distance;


        const y =
          centerY +
          Math.sin(angle) *
          distance *
          random(
            0.25,
            1.2
          );


        if (
          i === 0
        ) {

          context.moveTo(
            x,
            y
          );

        }

        else {

          context.lineTo(
            x,
            y
          );

        }

      }


      context.closePath();

    }


    /* =========================================================
       COLOR DATAMOSH SHARD
       Strong neon temporal fragment
    ========================================================= */

    function colorShard(
      x,
      y,
      radius,
      strength
    ) {

      ctx.save();


      irregularPath(

        ctx,

        x +
        random(
          -radius,
          radius
        ),

        y +
        random(
          -radius,
          radius
        ),

        random(
          radius * 0.15,
          radius * 0.8
        )

      );


      ctx.clip();


      ctx.globalCompositeOperation =
        Math.random() > 0.5
          ? "screen"
          : "hard-light";


      ctx.globalAlpha =
        random(
          0.55,
          0.95
        );


      ctx.filter =
        `
        saturate(${random(8,18)})
        contrast(${random(1.6,3.4)})
        hue-rotate(${random(0,360)}deg)
        `;


      ctx.drawImage(

        memoryCanvas,

        random(
          -50,
          50
        ) *
        strength,

        random(
          -25,
          25
        ) *
        strength,

        canvas.width,
        canvas.height

      );


      ctx.restore();

    }


    /* =========================================================
       NEON ORGANIC COLOR
       Adds bright irregular color fields
    ========================================================= */

    function neonBlob(
      x,
      y,
      radius
    ) {

      ctx.save();


      irregularPath(

        ctx,

        x +
        random(
          -radius,
          radius
        ),

        y +
        random(
          -radius,
          radius
        ),

        random(
          4,
          radius * 0.65
        )

      );


      ctx.globalCompositeOperation =
        "screen";


      ctx.globalAlpha =
        random(
          0.5,
          0.95
        );


      ctx.fillStyle =
        randomColor();


      ctx.fill();


      ctx.restore();

    }


    /* =========================================================
       COLORED GHOST TRAIL
       Creates displaced colorful temporal echoes
    ========================================================= */

    function colorGhost(
      x,
      y,
      radius,
      strength
    ) {

      const repeats =
        randomInt(
          2,
          5
        );


      for (
        let i = 0;
        i < repeats;
        i++
      ) {

        ctx.save();


        irregularPath(

          ctx,

          x,

          y,

          random(
            radius * 0.15,
            radius * 0.75
          )

        );


        ctx.clip();


        ctx.globalAlpha =
          random(
            0.18,
            0.48
          );


        ctx.globalCompositeOperation =
          "screen";


        ctx.filter =
          `
          saturate(${random(5,12)})
          hue-rotate(${random(0,360)}deg)
          `;


        ctx.drawImage(

          memoryCanvas,

          random(
            -25,
            25
          ) *
          strength *
          i,

          random(
            -15,
            15
          ) *
          strength *
          i,

          canvas.width,
          canvas.height

        );


        ctx.restore();

      }

    }


    /* =========================================================
       IRREGULAR GLITCH ENGINE
       No fixed visual pattern
    ========================================================= */

    function createGlitch(
      x,
      y,
      radius,
      intensity,
      amount
    ) {

      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const choice =
          Math.random();


        if (
          choice < 0.42
        ) {

          colorShard(
            x,
            y,
            radius,
            intensity
          );

        }

        else if (
          choice < 0.70
        ) {

          colorGhost(
            x,
            y,
            radius,
            intensity
          );

        }

        else {

          neonBlob(
            x,
            y,
            radius
          );

        }

      }

    }


    /* =========================================================
       MOUSE GLITCH
    ========================================================= */

    function createMouseGlitch() {

      if (
        !mouseMoving ||
        mouseSpeed < 0.5
      ) {

        return;

      }


      const speed =
        Math.min(
          30,
          mouseSpeed
        );


      const radius =
        Math.min(

          MOUSE_MAX_RADIUS,

          MOUSE_MIN_RADIUS +
          speed * 0.8

        );


      createGlitch(

        mouseX,

        mouseY,

        radius,

        1.3 +
        speed * 0.04 +
        audioLevel * 2,

        Math.floor(
          2 +
          Math.random() * 4 +
          audioLevel * 6
        )

      );

    }


    /* =========================================================
       WEBCAM MOVEMENT GLITCH
       Movement inside camera creates colored glitch
    ========================================================= */

    function createWebcamGlitch() {

      if (
        webcamMotionAmount <
        0.02
      ) {

        return;

      }


      const radius =
        Math.min(

          MOTION_MAX_RADIUS,

          MOTION_MIN_RADIUS +
          webcamMotionAmount *
          100

        );


      createGlitch(

        webcamMotionX,

        webcamMotionY,

        radius,

        MOSH_STRENGTH +
        webcamMotionAmount *
        5 +
        audioPeak *
        3,

        Math.floor(

          4 +
          webcamMotionAmount *
          26 +
          audioLevel *
          14

        )

      );

    }


    /* =========================================================
       SOUND GLITCH
       Sound creates aggressive colored disruption
    ========================================================= */

    function createSoundGlitch() {

      const energy =
        Math.max(
          audioLevel,
          bassLevel
        );


      if (
        energy < 0.018
      ) {

        return;

      }


      const chance =
        0.22 +
        energy *
        0.95;


      if (
        Math.random() >
        chance
      ) {

        return;

      }


      const bursts =
        Math.floor(
          1 +
          energy * 7
        );


      for (
        let i = 0;
        i < bursts;
        i++
      ) {

        let x;
        let y;


        if (
          webcamMotionAmount >
          0.02 &&
          Math.random() >
          0.3
        ) {

          x =
            webcamMotionX +
            random(
              -100,
              100
            );


          y =
            webcamMotionY +
            random(
              -100,
              100
            );

        }

        else {

          x =
            random(
              0,
              canvas.width
            );


          y =
            random(
              0,
              canvas.height
            );

        }


        createGlitch(

          x,

          y,

          random(
            18,
            60 +
            energy *
            100
          ),

          1.5 +
          energy *
          6,

          randomInt(
            2,
            8
          )

        );

      }

    }


    /* =========================================================
       TEMPORAL MEMORY UPDATE
       Stores previous composite frames
    ========================================================= */

    function updateMemory() {

      memoryCtx.save();


      memoryCtx.globalAlpha =
        MEMORY_AMOUNT;


      memoryCtx.drawImage(

        memoryCanvas,

        random(
          -1,
          1
        ),

        random(
          -1,
          1
        ),

        memoryCanvas.width,
        memoryCanvas.height

      );


      memoryCtx.restore();


      memoryCtx.save();


      memoryCtx.globalAlpha =
        0.28;


      memoryCtx.globalCompositeOperation =
        "screen";


      memoryCtx.filter =
        "saturate(2)";


      memoryCtx.drawImage(

        compositeCanvas,

        0,
        0,

        memoryCanvas.width,
        memoryCanvas.height

      );


      memoryCtx.restore();

    }


    /* =========================================================
       DRAW MAIN IMAGE
       Keeps footage dominant
    ========================================================= */

    function drawBaseFrame() {

      ctx.globalCompositeOperation =
        "source-over";


      ctx.globalAlpha = 1;


      ctx.filter =
        "saturate(1.45) contrast(1.1)";


      ctx.drawImage(

        compositeCanvas,

        0,
        0,

        canvas.width,
        canvas.height

      );


      ctx.filter =
        "none";

    }


    /* =========================================================
       MAIN ANIMATION LOOP
    ========================================================= */

    function animate() {

      buildWebcamHalo();

      buildCompositeFrame();

      updateAudio();

      detectWebcamMotion();

      updateMemory();

      drawBaseFrame();

      createMouseGlitch();

      createWebcamGlitch();

      createSoundGlitch();


      requestAnimationFrame(
        animate
      );

    }


    /* =========================================================
       START INTERACTIVE SYSTEM
    ========================================================= */

    animate();


  </script>
