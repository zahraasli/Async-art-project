<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
    }

    #hydraCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #footage,
    #webcam {
      position: fixed;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      opacity: 0.001;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;

      padding: 9px 14px;

      border: 1px solid rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.42);
      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;

      cursor: pointer;
    }

    #startButton.active {
      opacity: 0.18;
    }

    #startButton:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- =========================================================
       YOUR FOOTAGE
       This exact file exists in your GitHub repository
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="./DSC_3062.mp4"
      type="video/mp4"
    >
  </video>


  <!-- =========================================================
       WEBCAM
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       BUTTON
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       HYDRA CANVAS
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       HYDRA
  ========================================================== -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       INTERACTION VARIABLES
    ========================================================= */

    let audioLevel = 0;
    let audioPeak = 0;

    let mouseX = 0.5;
    let mouseY = 0.5;

    let mouseEnergy = 0;

    let lastMouseX = 0.5;
    let lastMouseY = 0.5;


    /* =========================================================
       AUDIO
    ========================================================= */

    let analyser = null;
    let audioData = null;


    /* =========================================================
       STATE
    ========================================================= */

    let cameraActive = false;
    let hydraStarted = false;


    /* =========================================================
       VISUAL SETTINGS
    ========================================================= */

    const AUDIO_SENSITIVITY = 20;

    /*
      Webcam visibility is intentionally very low.
    */

    const CAMERA_PRESENCE = 0.07;

    /*
      But camera movement strongly distorts footage.
    */

    const CAMERA_WARP = 0.34;

    const FEEDBACK_AMOUNT = 0.70;

    const COLOR_AMOUNT = 0.018;

    const MOUSE_EFFECT = 0.05;


    /* =========================================================
       HYDRA ENGINE
    ========================================================= */

    const hydra = new Hydra({

      canvas: canvas,

      detectAudio: false,

      enableStreamCapture: false,

      makeGlobal: true

    });


    /* =========================================================
       RESIZE
    ========================================================= */

    function resizeHydra() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;


      if (
        typeof setResolution === "function"
      ) {

        setResolution(
          window.innerWidth,
          window.innerHeight
        );

      }

    }


    resizeHydra();


    window.addEventListener(
      "resize",
      resizeHydra
    );


    /* =========================================================
       LOAD FOOTAGE
    ========================================================= */

    async function initializeFootage() {

      try {

        footage.muted = true;
        footage.loop = true;

        await footage.play();

      }

      catch(error) {

        console.log(
          "Autoplay waiting for interaction:",
          error
        );

      }


      /*
        s0 = YOUR VIDEO
      */

      s0.init({
        src: footage
      });


      /*
        Temporary source before webcam activation.
      */

      s1.init({
        src: footage
      });


      if (!hydraStarted) {

        startHydraPatch();

        hydraStarted = true;

      }

    }


    footage.addEventListener(
      "loadeddata",
      initializeFootage,
      { once: true }
    );


    if (footage.readyState >= 2) {

      initializeFootage();

    }


    /* =========================================================
       FOOTAGE ERROR
    ========================================================= */

    footage.addEventListener(
      "error",
      () => {

        console.error(
          "DSC_3062.mp4 could not be loaded."
        );

        startButton.textContent =
          "FOOTAGE NOT FOUND";

      }
    );


    /* =========================================================
       MOUSE
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;


        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          lastMouseX;


        const dy =
          y -
          lastMouseY;


        mouseEnergy =
          Math.min(
            1,
            Math.hypot(
              dx,
              dy
            ) * 20
          );


        mouseX = x;
        mouseY = y;

        lastMouseX = x;
        lastMouseY = y;

      }
    );


    /* =========================================================
       CAMERA + MICROPHONE
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        if (cameraActive) {
          return;
        }


        try {

          await footage.play();

        }

        catch(error) {

          console.log(
            "Footage play error:",
            error
          );

        }


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }

            });


          /* =====================================================
             WEBCAM SOURCE
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          s1.init({
            src: webcam
          });


          cameraActive = true;


          /* =====================================================
             AUDIO ANALYSER
          ===================================================== */

          try {

            const AudioContext =
              window.AudioContext ||
              window.webkitAudioContext;


            const audioContext =
              new AudioContext();


            await audioContext.resume();


            const microphone =
              audioContext.createMediaStreamSource(
                stream
              );


            analyser =
              audioContext.createAnalyser();


            analyser.fftSize =
              512;


            analyser.smoothingTimeConstant =
              0.10;


            microphone.connect(
              analyser
            );


            audioData =
              new Uint8Array(
                analyser.fftSize
              );

          }

          catch(audioError) {

            console.log(
              "Audio analyser failed:",
              audioError
            );

          }


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );

        }

        catch(error) {

          console.error(
            "Camera / microphone failed:",
            error
          );


          startButton.textContent =
            "CAMERA / SOUND FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *= 0.86;
        audioPeak *= 0.80;
        mouseEnergy *= 0.88;


        requestAnimationFrame(
          updateAudio
        );


        return;

      }


      analyser.getByteTimeDomainData(
        audioData
      );


      let sum = 0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        const value =
          (
            audioData[i] -
            128
          ) / 128;


        sum +=
          value *
          value;

      }


      const rms =
        Math.sqrt(
          sum /
          audioData.length
        );


      const target =
        Math.min(
          1,
          rms *
          AUDIO_SENSITIVITY
        );


      audioLevel =
        audioLevel *
        0.24 +
        target *
        0.76;


      audioPeak =
        Math.max(
          target,
          audioPeak *
          0.74
        );


      mouseEnergy *=
        0.88;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       HYDRA PATCH
    ========================================================= */

    function startHydraPatch() {


      /* =====================================================
         CAMERA DISTORTION SOURCE

         Camera is processed heavily before it affects footage.
      ===================================================== */

      src(s1)

        .scale(
          () =>
            1.03 +
            audioLevel * 0.04
        )


        .modulate(

          noise(
            1.9,
            0.05
          )

            .rotate(
              () =>
                time * 0.03
            )

            .scale(
              1.6
            ),

          () =>
            0.08 +
            audioLevel * 0.20
        )


        .modulate(

          noise(
            5.0,
            0.10
          ),

          () =>
            0.035 +
            audioPeak * 0.13
        )


        .modulateHue(

          noise(
            2.1,
            0.04
          )

            .colorama(
              0.55
            ),

          () =>
            0.8 +
            audioLevel * 2.6
        )


        .posterize(
          12,
          0.7
        )


        .saturate(

          () =>
            3.0 +
            audioLevel * 4.0
        )


        .contrast(
          1.3
        )


        /* ===================================================
           CAMERA FEEDBACK
        =================================================== */

        .blend(

          src(o1)

            .scale(

              () =>
                1.008 +
                audioLevel * 0.015
            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.12
                ) *
                0.008
            )

            .modulate(

              noise(
                1.8,
                0.025
              ),

              () =>
                0.018 +
                audioPeak * 0.07
            ),

          () =>
            0.45 +
            audioLevel * 0.12
        )


        .out(o1);



      /* =====================================================
         YOUR VIDEO IS THE BASE
      ===================================================== */

      src(s0)


        .saturate(
          1.7
        )


        .contrast(
          1.08
        )


        /* ===================================================
           CAMERA MOVEMENT DISTORTS VIDEO
        =================================================== */

        .modulate(

          src(o1)

            .saturate(
              0
            )

            .contrast(
              2.5
            )

            .posterize(
              8,
              0.65
            ),

          () => {

            if (cameraActive) {

              return (
                CAMERA_WARP +
                audioLevel * 0.25
              );

            }

            return 0.015;

          }

        )


        /* ===================================================
           IRREGULAR GLITCH
        =================================================== */

        .modulate(

          noise(

            3.2,

            () =>
              0.02 +
              audioLevel * 0.06
          )

            .rotate(
              () =>
                time * 0.018
            )

            .scale(
              1.5
            ),

          () =>
            0.025 +
            audioLevel * 0.10
        )


        /* ===================================================
           VERY FAINT WEBCAM GHOST
        =================================================== */

        .blend(

          src(o1)

            .saturate(
              2
            )

            .contrast(
              1.4
            )

            .colorama(

              () =>
                0.012 +
                audioLevel * 0.025
            ),

          () => {

            if (cameraActive) {

              return (
                CAMERA_PRESENCE +
                audioLevel * 0.025
              );

            }

            return 0;

          }

        )


        /* ===================================================
           TEMPORAL FEEDBACK
        =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.003 +
                audioLevel * 0.012
            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.08
                ) *
                0.004
            )

            .modulate(

              noise(
                1.4,
                0.02
              ),

              () =>
                0.012 +
                audioLevel * 0.07
            )

            .colorama(

              () =>
                COLOR_AMOUNT +
                audioLevel * 0.035
            ),

          () =>
            FEEDBACK_AMOUNT +
            audioLevel * 0.08
        )


        /* ===================================================
           RED GLITCH CHANNEL
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                0.002 +
                audioPeak * 0.018
            )

            .color(
              1.25,
              0.05,
              0.12
            ),

          () =>
            0.055 +
            audioPeak * 0.13
        )


        /* ===================================================
           CYAN GLITCH CHANNEL
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                -0.003 -
                audioPeak * 0.016
            )

            .color(
              0.04,
              0.85,
              1.30
            ),

          () =>
            0.05 +
            audioPeak * 0.12
        )


        /* ===================================================
           COLOR
        =================================================== */

        .colorama(

          () =>
            0.004 +
            audioLevel * 0.025
        )


        .saturate(

          () =>
            1.8 +
            audioLevel * 2.8
        )


        .contrast(

          () =>
            1.05 +
            audioPeak * 0.22
        )


        .out(o0);



      /* =====================================================
         LOCAL MOUSE GLITCH
      ===================================================== */

      noise(
        7,
        0.13
      )

        .mask(

          shape(

            90,

            () =>
              0.04 +
              mouseEnergy *
              MOUSE_EFFECT,

            0.22
          )

            .scrollX(

              () =>
                mouseX -
                0.5
            )

            .scrollY(

              () =>
                mouseY -
                0.5
            )

        )


        .contrast(
          2.5
        )


        .out(o2);



      /* =====================================================
         APPLY LOCAL MOUSE EFFECT
      ===================================================== */

      src(o0)

        .modulate(

          src(o2),

          () =>
            mouseEnergy *
            0.10
        )

        .out(o3);



      /* =====================================================
         OUTPUT
      ===================================================== */

      render(o3);

    }


    /* =========================================================
       SAFARI FALLBACK
    ========================================================= */

    document.addEventListener(
      "click",
      async () => {

        if (footage.paused) {

          try {

            await footage.play();

          }

          catch(error) {

            console.log(error);

          }

        }

      },
      { once: true }
    );

  </script>

</body>

</html>
