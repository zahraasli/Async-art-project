<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>

    /* =========================================================
       PAGE SETUP
       Full-screen installation environment
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: crosshair;
    }


    /* =========================================================
       HYDRA OUTPUT CANVAS
       All final visuals appear here
    ========================================================= */

    #hydraCanvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
    }


    /* =========================================================
       SOURCE VIDEOS
       They stay almost invisible but remain active
       for Hydra and Safari/iOS compatibility
    ========================================================= */

    #footage,
    #webcam {
      position: fixed;

      top: 0;
      left: 0;

      width: 2px;
      height: 2px;

      opacity: 0.001;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA + SOUND BUTTON
    ========================================================= */

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 100;

      padding: 9px 14px;

      border: 1px solid rgba(255,255,255,0.75);

      background: rgba(0,0,0,0.42);

      color: white;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      letter-spacing: 1.5px;

      cursor: pointer;
    }


    /* =========================================================
       ACTIVE BUTTON
       Fades UI after activation
    ========================================================= */

    #startButton.active {
      opacity: 0.18;
    }

  </style>
</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this with your own video later
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >
    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >
  </video>


  <!-- =========================================================
       LIVE WEBCAM
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       CAMERA + MICROPHONE CONTROL
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       HYDRA CANVAS
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       HYDRA-SYNTH LIBRARY
       Hydra runs directly inside this webpage
  ========================================================== -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>

    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const canvas =
      document.getElementById("hydraCanvas");

    const footage =
      document.getElementById("footage");

    const webcam =
      document.getElementById("webcam");

    const startButton =
      document.getElementById("startButton");


    /* =========================================================
       INTERACTION VALUES
    ========================================================= */

    let audioLevel = 0;

    let audioPeak = 0;

    let mouseX = 0.5;

    let mouseY = 0.5;

    let mouseEnergy = 0;

    let lastMouseX = 0.5;

    let lastMouseY = 0.5;


    /* =========================================================
       AUDIO ANALYSIS VALUES
    ========================================================= */

    let analyser = null;

    let audioData = null;


    /* =========================================================
       MAIN VISUAL SETTINGS
       These are the parameters we will tune later
    ========================================================= */

    const AUDIO_SENSITIVITY = 18;

    const CAMERA_PRESENCE = 0.52;

    const CAMERA_WARP = 0.16;

    const FEEDBACK_AMOUNT = 0.72;

    const COLOR_AMOUNT = 0.018;

    const MOUSE_EFFECT = 20;


    /* =========================================================
       HYDRA ENGINE
       Uses the same visual synthesis system as Hydra
    ========================================================= */

    const hydra = new Hydra({

      canvas: canvas,

      detectAudio: false,

      enableStreamCapture: false,

      makeGlobal: true

    });


    /* =========================================================
       RESIZE HYDRA
    ========================================================= */

    function resizeHydra() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;


      if (
        typeof setResolution === "function"
      ) {

        setResolution(
          window.innerWidth,
          window.innerHeight
        );

      }

    }


    resizeHydra();


    window.addEventListener(
      "resize",
      resizeHydra
    );


    /* =========================================================
       MAIN FOOTAGE SOURCE
       Hydra source s0 = background footage
    ========================================================= */

    footage.addEventListener(
      "loadeddata",
      () => {

        s0.init({
          src: footage
        });

      }
    );


    /* =========================================================
       MOUSE TRACKING
       Mouse is only a subtle local disturbance
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        const x =
          event.clientX /
          window.innerWidth;


        const y =
          event.clientY /
          window.innerHeight;


        const dx =
          x -
          lastMouseX;


        const dy =
          y -
          lastMouseY;


        mouseEnergy =
          Math.min(
            1,
            Math.hypot(
              dx,
              dy
            ) * 18
          );


        mouseX = x;

        mouseY = y;


        lastMouseX = x;

        lastMouseY = y;

      }
    );


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }

            });


          /* =====================================================
             WEBCAM SOURCE
             Hydra source s1 = live webcam
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          s1.init({
            src: webcam
          });


          /* =====================================================
             MICROPHONE ANALYSER
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          await audioContext.resume();


          const microphone =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize =
            512;


          analyser.smoothingTimeConstant =
            0.12;


          microphone.connect(
            analyser
          );


          audioData =
            new Uint8Array(
              analyser.fftSize
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );


          /* =====================================================
             START HYDRA VISUAL PATCH
          ===================================================== */

          startHydraPatch();

        }

        catch(error) {

          console.error(error);


          startButton.textContent =
            "CAMERA / SOUND FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
       Converts microphone amplitude to 0–1 values
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *= 0.86;

        audioPeak *= 0.80;

        requestAnimationFrame(
          updateAudio
        );

        return;

      }


      analyser.getByteTimeDomainData(
        audioData
      );


      let sum = 0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        const value =
          (
            audioData[i] -
            128
          ) / 128;


        sum +=
          value *
          value;

      }


      const rms =
        Math.sqrt(
          sum /
          audioData.length
        );


      const target =
        Math.min(
          1,
          rms *
          AUDIO_SENSITIVITY
        );


      audioLevel =
        audioLevel *
        0.26 +
        target *
        0.74;


      audioPeak =
        Math.max(
          target,
          audioPeak *
          0.76
        );


      mouseEnergy *=
        0.88;


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       HYDRA PSYCHEDELIC PATCH
       This is the core visual language
    ========================================================= */

    function startHydraPatch() {


      /* =====================================================
         WEBCAM GHOST SOURCE
         Webcam is heavily distorted BEFORE it is mixed
         with the footage.

         o1 becomes a liquid, colored, unstable camera ghost.
      ===================================================== */

      src(s1)

        .scale(
          () =>
            1.015 +
            audioLevel * 0.035
        )

        .modulate(

          noise(
            2.2,
            0.045
          )

            .rotate(
              () =>
                time * 0.025
            )

            .scale(
              1.25
            ),

          () =>
            0.055 +
            audioLevel * 0.17
        )

        .modulateHue(

          noise(
            1.6,
            0.025
          )

            .colorama(
              0.3
            ),

          () =>
            0.8 +
            audioLevel * 2.8
        )

        .colorama(

          () =>
            0.012 +
            audioLevel * 0.08
        )

        .saturate(

          () =>
            3.8 +
            audioLevel * 5
        )

        .contrast(

          () =>
            1.15 +
            audioLevel * 0.7
        )

        .posterize(
          12,
          0.75
        )

        /* ===================================================
           CAMERA FEEDBACK
           This is what causes the face to smear,
           persist and merge instead of appearing clean.
        =================================================== */

        .blend(

          src(o1)

            .scale(

              () =>
                1.006 +
                audioLevel * 0.018
            )

            .rotate(

              () =>
                Math.sin(time * 0.12) *
                0.006
            )

            .scrollX(

              () =>
                Math.sin(time * 0.21) *
                0.004
            )

            .scrollY(

              () =>
                Math.cos(time * 0.17) *
                0.004
            )

            .modulate(

              noise(
                1.4,
                0.02
              ),

              () =>
                0.015 +
                audioPeak * 0.065
            ),

          () =>
            0.52 +
            audioLevel * 0.22
        )

        .out(o1);



      /* =====================================================
         FOOTAGE LIQUID BASE
         Footage stays visible but is continuously warped.
      ===================================================== */

      src(s0)

        .saturate(
          2.4
        )

        .contrast(
          1.12
        )

        .colorama(
          0.006
        )

        /* ===================================================
           WEBCAM AS GEOMETRIC FORCE
           Camera doesn't merely sit over footage.
           Its colors physically warp footage coordinates.
        =================================================== */

        .modulate(

          src(o1)

            .saturate(
              0
            )

            .contrast(
              1.65
            ),

          () =>
            CAMERA_WARP +
            audioLevel * 0.22
        )

        /* ===================================================
           SLOW LIQUID WORLD DISTORTION
        =================================================== */

        .modulate(

          noise(

            2.1,

            () =>
              0.018 +
              audioLevel * 0.05
          )

            .scale(
              1.5
            )

            .rotate(
              () =>
                time * 0.015
            ),

          () =>
            0.018 +
            audioLevel * 0.075
        )

        /* ===================================================
           CAMERA + FOOTAGE MERGE
           The webcam ghost is now mixed INTO the footage.
        =================================================== */

        .blend(

          src(o1)

            .colorama(

              () =>
                0.02 +
                Math.sin(
                  time * 0.13
                ) *
                0.015
            )

            .saturate(

              () =>
                4 +
                audioLevel * 5
            )

            .modulate(

              src(s0)

                .saturate(
                  0
                )

                .contrast(
                  1.4
                ),

              0.05
            ),

          () =>
            CAMERA_PRESENCE +
            audioLevel * 0.18
        )

        /* ===================================================
           FULL-SCENE TEMPORAL FEEDBACK
           Previous output melts back into the current image.
        =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.003 +
                audioLevel * 0.014
            )

            .rotate(

              () =>
                Math.sin(
                  time * 0.08
                ) *
                0.004
            )

            .modulate(

              noise(
                1.3,
                0.015
              ),

              () =>
                0.012 +
                audioLevel * 0.07
            )

            .colorama(

              () =>
                COLOR_AMOUNT +
                audioLevel * 0.04
            )

            .saturate(

              () =>
                1.8 +
                audioLevel * 3.2
            ),

          () =>
            FEEDBACK_AMOUNT +
            audioLevel * 0.12
        )

        /* ===================================================
           CHROMATIC BLEED
           RGB channels continuously contaminate one another.
        =================================================== */

        .add(

          src(o0)

            .scrollX(

              () =>
                0.002 +
                audioPeak * 0.018
            )

            .color(
              1.35,
              0.08,
              0.25
            ),

          () =>
            0.08 +
            audioPeak * 0.16
        )

        .add(

          src(o0)

            .scrollX(

              () =>
                -0.003 -
                audioPeak * 0.015
            )

            .color(
              0.05,
              0.9,
              1.4
            ),

          () =>
            0.07 +
            audioPeak * 0.15
        )

        /* ===================================================
           PSYCHEDELIC COLOR OVERDRIVE
        =================================================== */

        .colorama(

          () =>
            0.008 +
            audioLevel * 0.045 +
            Math.sin(
              time * 0.1
            ) *
            0.006
        )

        .saturate(

          () =>
            2.8 +
            audioLevel * 4.5
        )

        .contrast(

          () =>
            1.08 +
            audioPeak * 0.3
        )

        .brightness(

          () =>
            0.02 +
            audioPeak * 0.08
        )

        .out(o0);



      /* =====================================================
         SMALL LOCAL MOUSE DISTURBANCE
         Mouse does not control the whole image.
         It only introduces an additional localized energy source.
      ===================================================== */

      noise(
        6,
        0.12
      )

        .mask(

          shape(
            80,

            () =>
              0.045 +
              mouseEnergy *
              MOUSE_EFFECT,

            0.25
          )

            .scrollX(

              () =>
                mouseX -
                0.5
            )

            .scrollY(

              () =>
                mouseY -
                0.5
            )

        )

        .contrast(
          2
        )

        .out(o2);



      /* =====================================================
         FINAL MOUSE MODULATION
         Uses the tiny masked area to disturb the final image.
      ===================================================== */

      src(o0)

        .modulate(

          src(o2),

          () =>
            mouseEnergy *
            0.09
        )

        .out(o3);



      /* =====================================================
         FINAL OUTPUT
    ===================================================== */

      render(o3);

    }

  </script>

</body>

</html>
