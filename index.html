<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Async Art Project</title>

  <style>

    /* =========================================================
       PAGE SETUP
       Full-screen interactive installation
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: black;

      cursor: crosshair;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================================================
       HYDRA OUTPUT
       Final visual appears here
    ========================================================= */

    #hydraCanvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
    }


    /* =========================================================
       HIDDEN VIDEO SOURCES
       Videos remain active but are not shown directly
    ========================================================= */

    #footage,
    #webcam {
      position: fixed;

      width: 2px;
      height: 2px;

      opacity: 0.001;

      pointer-events: none;
    }


    /* =========================================================
       HIDDEN MOUSE FIELD
       This canvas generates a smooth mouse influence map
    ========================================================= */

    #mouseField {
      position: fixed;

      width: 2px;
      height: 2px;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================================================
       CAMERA + SOUND BUTTON
    ========================================================= */

    #startButton {
      position: fixed;

      top: 16px;
      left: 16px;

      z-index: 100;

      padding: 9px 14px;

      border:
        1px solid
        rgba(255,255,255,0.72);

      background:
        rgba(0,0,0,0.40);

      color: white;

      font-size: 10px;

      letter-spacing: 1.5px;

      cursor: pointer;
    }


    /* =========================================================
       ACTIVE BUTTON
    ========================================================= */

    #startButton.active {
      opacity: 0.18;
    }

  </style>

</head>


<body>


  <!-- =========================================================
       MAIN FOOTAGE
       Replace this video later with your own footage
  ========================================================== -->

  <video
    id="footage"
    autoplay
    muted
    loop
    playsinline
    crossorigin="anonymous"
  >

    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================================================
       LIVE WEBCAM
  ========================================================== -->

  <video
    id="webcam"
    autoplay
    muted
    playsinline
  ></video>


  <!-- =========================================================
       MOUSE FIELD CANVAS
  ========================================================== -->

  <canvas id="mouseField"></canvas>


  <!-- =========================================================
       CAMERA + MICROPHONE CONTROL
  ========================================================== -->

  <button id="startButton">
    ENABLE CAMERA + SOUND
  </button>


  <!-- =========================================================
       HYDRA OUTPUT CANVAS
  ========================================================== -->

  <canvas id="hydraCanvas"></canvas>


  <!-- =========================================================
       HYDRA-SYNTH LIBRARY
  ========================================================== -->

  <script src="https://unpkg.com/hydra-synth"></script>


  <script>


    /* =========================================================
       HTML ELEMENT REFERENCES
    ========================================================= */

    const hydraCanvas =
      document.getElementById(
        "hydraCanvas"
      );

    const footage =
      document.getElementById(
        "footage"
      );

    const webcam =
      document.getElementById(
        "webcam"
      );

    const mouseCanvas =
      document.getElementById(
        "mouseField"
      );

    const mouseCtx =
      mouseCanvas.getContext(
        "2d"
      );

    const startButton =
      document.getElementById(
        "startButton"
      );


    /* =========================================================
       INTERACTION STATE
    ========================================================= */

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let lastMouseX =
      mouseX;

    let lastMouseY =
      mouseY;

    let mouseEnergy = 0;


    /* =========================================================
       AUDIO STATE
    ========================================================= */

    let analyser = null;

    let audioData = null;

    let audioLevel = 0;

    let audioPeak = 0;


    /* =========================================================
       CAMERA STATE
    ========================================================= */

    let cameraStarted = false;


    /* =========================================================
       MAIN VISUAL SETTINGS
       These control the overall balance
    ========================================================= */

    const AUDIO_SENSITIVITY = 17;


    /* =========================================================
       FOOTAGE PRESENCE
       Higher = footage remains more recognizable
    ========================================================= */

    const FOOTAGE_PRESENCE = 0.78;


    /* =========================================================
       CAMERA PRESENCE
       Higher = webcam is more visible inside the footage
    ========================================================= */

    const CAMERA_PRESENCE = 0.31;


    /* =========================================================
       CAMERA WARP
       Controls how strongly webcam bends the footage
    ========================================================= */

    const CAMERA_WARP = 0.085;


    /* =========================================================
       FEEDBACK AMOUNT
       Lower than previous version to remove sandy texture
    ========================================================= */

    const FEEDBACK_AMOUNT = 0.29;


    /* =========================================================
       MOUSE WARP
       Controls how strongly mouse distorts the image
    ========================================================= */

    const MOUSE_WARP = 0.42;


    /* =========================================================
       MOUSE FIELD SIZE
       Radius in screen pixels
    ========================================================= */

    const MOUSE_RADIUS = 150;


    /* =========================================================
       COLOR INTENSITY
       Controls psychedelic saturation
    ========================================================= */

    const COLOR_INTENSITY = 2.2;


    /* =========================================================
       HYDRA ENGINE
    ========================================================= */

    const hydra =
      new Hydra({

        canvas:
          hydraCanvas,

        detectAudio:
          false,

        enableStreamCapture:
          false,

        makeGlobal:
          true

      });


    /* =========================================================
       RESIZE SYSTEM
    ========================================================= */

    function resize() {

      const width =
        window.innerWidth;

      const height =
        window.innerHeight;


      hydraCanvas.width =
        width;

      hydraCanvas.height =
        height;


      mouseCanvas.width =
        width;

      mouseCanvas.height =
        height;


      if (
        typeof setResolution ===
        "function"
      ) {

        setResolution(
          width,
          height
        );

      }

    }


    resize();


    window.addEventListener(
      "resize",
      resize
    );


    /* =========================================================
       FOOTAGE SOURCE
       Hydra s0 = main background footage
    ========================================================= */

    function initializeFootage() {

      s0.init({
        src: footage
      });

    }


    if (
      footage.readyState >= 2
    ) {

      initializeFootage();

    }

    else {

      footage.addEventListener(
        "loadeddata",
        initializeFootage,
        {
          once: true
        }
      );

    }


    /* =========================================================
       MOUSE FIELD SOURCE
       Hydra s2 = soft radial mouse map
    ========================================================= */

    s2.init({
      src: mouseCanvas
    });


    /* =========================================================
       MOUSE TRACKING
       Calculates both position and movement velocity
    ========================================================= */

    window.addEventListener(
      "mousemove",
      event => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;


        const dx =
          mouseX -
          lastMouseX;

        const dy =
          mouseY -
          lastMouseY;


        const speed =
          Math.hypot(
            dx,
            dy
          );


        mouseEnergy =
          Math.min(
            1,
            mouseEnergy +
            speed * 0.018
          );


        lastMouseX =
          mouseX;

        lastMouseY =
          mouseY;

      }
    );


    /* =========================================================
       MOUSE FIELD DRAWING
       Creates a smooth organic field around the cursor
    ========================================================= */

    function drawMouseField() {

      mouseCtx.clearRect(
        0,
        0,
        mouseCanvas.width,
        mouseCanvas.height
      );


      /* =====================================================
         FIELD SIZE
         Faster mouse movement creates a slightly larger field
      ===================================================== */

      const radius =

        MOUSE_RADIUS +

        mouseEnergy *
        120;


      /* =====================================================
         SOFT RADIAL GRADIENT
         White center = strong Hydra modulation
         Black outside = no modulation
      ===================================================== */

      const gradient =
        mouseCtx.createRadialGradient(

          mouseX,
          mouseY,
          0,

          mouseX,
          mouseY,
          radius

        );


      gradient.addColorStop(
        0,
        `rgba(
          255,
          255,
          255,
          ${0.95 * mouseEnergy}
        )`
      );


      gradient.addColorStop(
        0.20,
        `rgba(
          255,
          255,
          255,
          ${0.75 * mouseEnergy}
        )`
      );


      gradient.addColorStop(
        0.55,
        `rgba(
          180,
          180,
          180,
          ${0.35 * mouseEnergy}
        )`
      );


      gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
      );


      mouseCtx.fillStyle =
        gradient;


      mouseCtx.fillRect(
        0,
        0,
        mouseCanvas.width,
        mouseCanvas.height
      );


      /* =====================================================
         MOUSE ENERGY DECAY
         Keeps the distortion alive briefly after movement
      ===================================================== */

      mouseEnergy *=
        0.945;


      requestAnimationFrame(
        drawMouseField
      );

    }


    drawMouseField();


    /* =========================================================
       CAMERA + MICROPHONE ACTIVATION
    ========================================================= */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          cameraStarted
        ) {
          return;
        }


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode:
                  "user"
              },

              audio: {
                echoCancellation:
                  false,

                noiseSuppression:
                  false,

                autoGainControl:
                  true
              }

            });


          /* =====================================================
             WEBCAM SOURCE
             Hydra s1 = live camera
          ===================================================== */

          webcam.srcObject =
            stream;


          await webcam.play();


          s1.init({
            src: webcam
          });


          cameraStarted =
            true;


          /* =====================================================
             MICROPHONE ANALYSIS
          ===================================================== */

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


          const audioContext =
            new AudioContext();


          await audioContext.resume();


          const microphone =
            audioContext.createMediaStreamSource(
              stream
            );


          analyser =
            audioContext.createAnalyser();


          analyser.fftSize =
            512;


          /* =====================================================
             AUDIO SMOOTHING
             Moderate smoothing avoids grainy visual flicker
          ===================================================== */

          analyser.smoothingTimeConstant =
            0.38;


          microphone.connect(
            analyser
          );


          audioData =
            new Uint8Array(
              analyser.fftSize
            );


          startButton.textContent =
            "CAMERA + SOUND ACTIVE";


          startButton.classList.add(
            "active"
          );


          /* =====================================================
             START VISUAL PATCH
          ===================================================== */

          startHydraPatch();

        }

        catch(error) {

          console.error(error);


          startButton.textContent =
            "CAMERA / SOUND FAILED";

        }

      }
    );


    /* =========================================================
       AUDIO ANALYSIS
       Converts microphone amplitude into smooth visual energy
    ========================================================= */

    function updateAudio() {

      if (
        !analyser ||
        !audioData
      ) {

        audioLevel *=
          0.90;

        audioPeak *=
          0.86;


        requestAnimationFrame(
          updateAudio
        );

        return;

      }


      analyser.getByteTimeDomainData(
        audioData
      );


      let sum =
        0;


      for (
        let i = 0;
        i < audioData.length;
        i++
      ) {

        const value =

          (
            audioData[i] -
            128
          ) /

          128;


        sum +=
          value *
          value;

      }


      const rms =
        Math.sqrt(

          sum /
          audioData.length

        );


      const target =
        Math.min(

          1,

          rms *
          AUDIO_SENSITIVITY

        );


      /* =====================================================
         SMOOTH AUDIO RESPONSE
         Prevents sandy frame-by-frame flicker
      ===================================================== */

      audioLevel =

        audioLevel *
        0.55 +

        target *
        0.45;


      audioPeak =
        Math.max(

          target,

          audioPeak *
          0.88

        );


      requestAnimationFrame(
        updateAudio
      );

    }


    updateAudio();


    /* =========================================================
       HYDRA PATCH
       Footage + webcam + mouse + sound are merged here
    ========================================================= */

    function startHydraPatch() {


      /* =====================================================
         WEBCAM LIQUID GHOST
         o1 contains the camera as a smooth psychedelic presence
         without posterization or high-frequency grain
      ===================================================== */

      src(s1)

        .scale(

          () =>
            1.015 +
            audioLevel *
            0.018

        )

        /* ===================================================
           SMOOTH CAMERA WARP
           Low-frequency modulation replaces sandy noise
        =================================================== */

        .modulate(

          osc(
            2.2,
            0.025,
            0.8
          )

            .rotate(
              () =>
                0.15 +
                Math.sin(
                  time * 0.08
                ) *
                0.08
            )

            .kaleid(
              3
            ),

          () =>
            0.025 +
            audioLevel *
            0.06

        )

        /* ===================================================
           CAMERA COLOR SHIFT
        =================================================== */

        .colorama(

          () =>
            0.008 +
            audioLevel *
            0.025 +
            Math.sin(
              time * 0.08
            ) *
            0.006

        )

        .saturate(

          () =>
            2.4 +
            audioLevel *
            2.6

        )

        .contrast(
          1.08
        )

        /* ===================================================
           SOFT CAMERA FEEDBACK
           Creates trails without turning into visual sand
        =================================================== */

        .blend(

          src(o1)

            .scale(

              () =>
                1.0025 +
                audioLevel *
                0.004

            )

            .scrollX(

              () =>
                Math.sin(
                  time * 0.09
                ) *
                0.0025

            )

            .scrollY(

              () =>
                Math.cos(
                  time * 0.07
                ) *
                0.002

            )

            .colorama(
              0.003
            ),

          () =>
            0.18 +
            audioLevel *
            0.10

        )

        .out(o1);



      /* =====================================================
         MAIN FOOTAGE BASE
         o0 begins with the footage and always preserves it
    ===================================================== */

      src(s0)

        .saturate(

          () =>
            COLOR_INTENSITY +
            audioLevel *
            1.2

        )

        .contrast(
          1.08
        )

        .brightness(
          0.015
        )


        /* ===================================================
           SLOW ORGANIC FOOTAGE MOVEMENT
           Makes footage breathe rather than fragment
        =================================================== */

        .modulate(

          osc(
            1.4,
            0.012,
            0.25
          )

            .rotate(
              () =>
                Math.sin(
                  time * 0.06
                ) *
                0.2
            ),

          () =>
            0.008 +
            audioLevel *
            0.025

        )


        /* ===================================================
           WEBCAM WARPS FOOTAGE
           Camera geometry physically deforms the footage
        =================================================== */

        .modulate(

          src(o1)

            .saturate(
              0
            )

            .contrast(
              1.25
            ),

          () =>
            CAMERA_WARP +
            audioLevel *
            0.07

        )


        /* ===================================================
           WEBCAM MERGES INTO FOOTAGE
           Lower blend prevents webcam from erasing footage
        =================================================== */

        .blend(

          src(o1)

            .saturate(

              () =>
                2.5 +
                audioLevel *
                2.5

            )

            .colorama(

              () =>
                0.012 +
                audioLevel *
                0.025

            ),

          () =>
            CAMERA_PRESENCE +
            audioLevel *
            0.06

        )


        /* ===================================================
           TEMPORAL FEEDBACK
           Small amount creates fluid persistence
           while footage remains structurally visible
        =================================================== */

        .blend(

          src(o0)

            .scale(

              () =>
                1.0015 +
                audioLevel *
                0.003

            )

            .scrollX(

              () =>
                Math.sin(
                  time * 0.1
                ) *
                0.0015

            )

            .scrollY(

              () =>
                Math.cos(
                  time * 0.085
                ) *
                0.0015

            )

            .colorama(
              0.003
            ),

          () =>
            FEEDBACK_AMOUNT +
            audioLevel *
            0.08

        )


        /* ===================================================
           PSYCHEDELIC COLOR DRIFT
           Smooth color evolution without grain
        =================================================== */

        .colorama(

          () =>
            0.005 +
            Math.sin(
              time * 0.075
            ) *
            0.004 +
            audioLevel *
            0.018

        )

        .saturate(

          () =>
            2.0 +
            audioLevel *
            1.8

        )

        .out(o0);



      /* =====================================================
         MOUSE FIELD PROCESSING
         o2 = smooth influence field following the actual cursor
    ===================================================== */

      src(s2)

        .blur(
          0.8
        )

        .contrast(
          1.35
        )

        /* ===================================================
           MAKE MOUSE FIELD MORE ORGANIC
           Very low-frequency modulation prevents circular look
        =================================================== */

        .modulate(

          osc(
            3,
            0.03,
            0.5
          )

            .rotate(
              () =>
                time *
                0.02
            ),

          () =>
            mouseEnergy *
            0.08

        )

        .out(o2);



      /* =====================================================
         MOUSE WARP PASS
         The real mouse field now warps the complete composition
    ===================================================== */

      src(o0)

        .modulate(

          src(o2),

          () =>
            mouseEnergy *
            MOUSE_WARP

        )

        /* ===================================================
           MOUSE COLOR BENDING
           Mouse locally produces additional psychedelic color
        =================================================== */

        .blend(

          src(o0)

            .modulateHue(

              src(o2),

              () =>
                mouseEnergy *
                1.8

            )

            .colorama(

              () =>
                mouseEnergy *
                0.028

            )

            .saturate(

              () =>
                1.0 +
                mouseEnergy *
                1.4

            ),

          () =>
            mouseEnergy *
            0.18

        )

        .out(o3);



      /* =====================================================
         FINAL FOOTAGE REINFORCEMENT
         Adds a subtle amount of original footage back in
         so the video source can never completely disappear
    ===================================================== */

      src(o3)

        .blend(

          src(s0)

            .saturate(
              1.6
            )

            .contrast(
              1.02
            ),

          () =>
            1.0 -
            FOOTAGE_PRESENCE

        )

        .out(o3);



      /* =====================================================
         FINAL OUTPUT
    ===================================================== */

      render(o3);

    }

  </script>

</body>

</html>
